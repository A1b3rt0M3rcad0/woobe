[project]
name = "woobe"
version = "0.12.1"
description = "Self-hostable control plane and runtime for versioned AI products"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.15.0",
    "asyncpg>=0.31.0",
    "boto3>=1.35.0",
    "cryptography>=50.0.0",
    "fastapi>=0.136.3",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langgraph-sdk>=0.4.4",
    "langchain-openai>=0.3.0",
    "langsmith>=0.8.18",
    "pgvector>=0.4.2",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pymongo>=4.18.2",
    "pypdf>=6.19.0",
    "pyyaml>=6.0.3",
    "python-multipart>=0.0.20",
    "redis>=6.4.0",
    "sqlalchemy>=2.0.50",
    "starlette>=1.3.1",
    "uuid6>=2025.0.1",
    "aio-pika>=9.5.0",
    "uvicorn>=0.48.0",
    "urllib3>=2.8.0",
    "jsonschema>=4.25.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "pytest-mock>=3.14",
    "httpx>=0.28",
    "aiosqlite>=0.21",
    "pytest-cov>=6.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.410",
    "ruff>=0.15.15",
]

[tool.pyright]
extraPaths = [
    "packages/woobe-core/src",
    "packages/woobe-api/src",
    "packages/woobe-workers/src",
    "tooling/woobe-testkit/src",
    "tooling/woobe-mock/src",
    "tooling/quality-gate/src",
]

[tool.ruff.lint.per-file-ignores]
"packages/woobe-core/src/modules/agent/application/mcp_oauth_flows.py" = ["F401"]
"packages/woobe-core/src/modules/agent/infra/database/models.py" = ["F401"]

