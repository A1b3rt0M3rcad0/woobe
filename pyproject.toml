[project]
name = "projectrai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.15.0",
    "asyncpg>=0.31.0",
    "boto3>=1.35.0",
    "cryptography>=48.0.0",
    "fastapi>=0.136.3",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "pgvector>=0.4.2",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pypdf>=6.0.0",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.50",
    "uuid6>=2025.0.1",
    "aio-pika>=9.5.0",
    "uvicorn>=0.48.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "pytest-mock>=3.14",
    "httpx>=0.28",
    "aiosqlite>=0.21",
    "pytest-cov>=6.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.410",
    "ruff>=0.15.15",
]

[tool.ruff.lint.per-file-ignores]
"src/modules/agent/application/mcp_oauth_flows.py" = ["F401"]
"src/modules/agent/infra/database/models.py" = ["F401"]
