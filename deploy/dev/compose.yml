# Optional contributor topology.
# Use together with the root Community compose:
# docker compose -f compose.yaml -f deploy/dev/compose.yml up -d --build

services:
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    environment:
      DATABASE_URL: ${WOOBE_POSTGRES_URL:?Run scripts/generate_self_host_env.py}
      PGBOUNCER_CLIENT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-woobe}
      LISTEN_ADDR: "0.0.0.0"
      LISTEN_PORT: "6432"
      POOL_MODE: ${PGBOUNCER_POOL_MODE:-transaction}
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-200}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-20}
      RESERVE_POOL_SIZE: ${PGBOUNCER_RESERVE_POOL_SIZE:-5}
      MAX_DB_CONNECTIONS: ${PGBOUNCER_MAX_DB_CONNECTIONS:-30}
      AUTH_TYPE: scram-sha-256
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "psql \"$${PGBOUNCER_CLIENT_URL}\" -tAc 'SELECT 1' | grep -qx 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - "300"
      - "10"

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-woobe}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-local-woobe-object-storage-key}
    volumes:
      - woobe_dev_minio:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    environment:
      MINIO_URL: http://minio:9000
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-woobe}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-local-woobe-object-storage-key}
      MINIO_BUCKET: ${WOOBE_S3_BUCKET:-woobe-local}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set local "$${MINIO_URL}" "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 1; done;
        mc mb --ignore-existing "local/$${MINIO_BUCKET}"
    depends_on:
      - minio
    restart: "no"

  api:
    environment:
      WOOBE_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-woobe}
      WOOBE_REDIS_URL: redis://redis:6379/0
      WOOBE_MCP_SESSION_CACHE_ENABLED: "true"
      WOOBE_STORAGE_DRIVER: s3
      WOOBE_S3_BUCKET: ${WOOBE_S3_BUCKET:-woobe-local}
      WOOBE_S3_REGION: ${WOOBE_S3_REGION:-us-east-1}
      WOOBE_S3_ENDPOINT_URL: http://minio:9000
      WOOBE_S3_FORCE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-woobe}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-local-woobe-object-storage-key}
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  workers:
    environment:
      WOOBE_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-woobe}
      WOOBE_REDIS_URL: redis://redis:6379/0
      WOOBE_MCP_SESSION_CACHE_ENABLED: "true"
      WOOBE_STORAGE_DRIVER: s3
      WOOBE_S3_BUCKET: ${WOOBE_S3_BUCKET:-woobe-local}
      WOOBE_S3_REGION: ${WOOBE_S3_REGION:-us-east-1}
      WOOBE_S3_ENDPOINT_URL: http://minio:9000
      WOOBE_S3_FORCE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-woobe}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-local-woobe-object-storage-key}
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

volumes:
  woobe_dev_minio:
