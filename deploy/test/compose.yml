x-test-backend-environment: &test-backend-environment
  WOOBE_EDITION: community
  WOOBE_ENVIRONMENT: test
  WOOBE_DEBUG: "false"
  WOOBE_DATABASE_URL: ${WOOBE_DATABASE_URL}
  WOOBE_POSTGRES_URL: ${WOOBE_POSTGRES_URL}
  WOOBE_SECRET_KEY: ${WOOBE_SECRET_KEY}
  WOOBE_ENCRYPTION_KEY: ${WOOBE_ENCRYPTION_KEY}
  WOOBE_CHAT_TOKEN_SIGNING_KEY: ${WOOBE_CHAT_TOKEN_SIGNING_KEY}
  WOOBE_RABBITMQ_URL: ${WOOBE_RABBITMQ_URL}
  WOOBE_REDIS_URL: redis://redis:6379/0
  WOOBE_MCP_SESSION_CACHE_ENABLED: "true"
  WOOBE_STORAGE_DRIVER: s3
  WOOBE_S3_BUCKET: ${WOOBE_S3_BUCKET}
  WOOBE_S3_REGION: ${WOOBE_S3_REGION}
  WOOBE_S3_ENDPOINT_URL: http://minio:9000
  WOOBE_S3_FORCE_PATH_STYLE: "true"
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
  WOOBE_CORS_ORIGINS: ${WOOBE_CORS_ORIGINS}
  WOOBE_TRUSTED_HOSTS: ${WOOBE_TRUSTED_HOSTS}
  WOOBE_TEST_FAKE_LLM_URL: http://fake-llm:9009/v1
  PYTHONPATH: /app/src:/app

services:
  fake-llm:
    build:
      context: .
      target: test
    command: ["uvicorn", "tests.fakes.openai_provider:app", "--host", "0.0.0.0", "--port", "9009"]
    environment:
      PYTHONPATH: /app/src:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9009/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: "no"

  backend-tests:
    build:
      context: .
      target: test
    environment:
      <<: *test-backend-environment
    depends_on:
      pgbouncer:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      fake-llm:
        condition: service_healthy
    volumes:
      - ./.test-artifacts:/artifacts
    command:
      - /bin/sh
      - -c
      - >-
        set -eu;
        ruff check src tests migrations;
        pyright src migrations;
        alembic upgrade head;
        alembic current;
        alembic check;
        alembic downgrade -1;
        alembic upgrade head;
        alembic check;
        python -m pytest -q --junitxml=/artifacts/backend-pytest.xml
    restart: "no"

  frontend-tests:
    build:
      context: web
      target: test
    environment:
      VITE_API_URL: ${VITE_API_URL}
      VITE_CHAT_EMBED_URL: ${VITE_CHAT_EMBED_URL}
      VITE_WOOBE_EDITION: community
    command: ["/bin/sh", "-c", "npm run test:run && npm run build"]
    restart: "no"

  web-preview:
    build:
      context: web
      target: test
    environment:
      VITE_API_URL: http://web-preview:4173
      VITE_CHAT_EMBED_URL: http://chat-embed:8080
      VITE_WOOBE_EDITION: community
    command: ["/bin/sh", "-c", "npm run build && npm run preview -- --host 0.0.0.0 --port 4173"]
    ports:
      - "4173:4173"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:4173"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: "no"

  browser-mocked:
    build:
      context: .
      dockerfile: e2e/Dockerfile
    environment:
      CI: "true"
      PLAYWRIGHT_BASE_URL: http://web-preview:4173
    depends_on:
      web-preview:
        condition: service_healthy
    volumes:
      - ./.test-artifacts/playwright-mocked:/workspace/e2e/playwright-report
      - ./.test-artifacts/playwright-mocked-results:/workspace/e2e/test-results
    command: ["npx", "playwright", "test", "--config", "playwright.config.ts"]
    restart: "no"

  browser-e2e:
    build:
      context: .
      dockerfile: e2e/Dockerfile
    environment:
      CI: "true"
      PLAYWRIGHT_BASE_URL: http://host.docker.internal:${WOOBE_WEB_PORT:-8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    volumes:
      - ./.test-artifacts/playwright-fullstack:/workspace/e2e/playwright-report-fullstack
      - ./.test-artifacts/playwright-fullstack-results:/workspace/e2e/test-results
    command: ["npx", "playwright", "test", "--config", "fullstack.config.ts"]
    restart: "no"
