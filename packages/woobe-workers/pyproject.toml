[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "woobe-workers"
version = "0.12.0"
description = "Woobe background execution process host"
requires-python = ">=3.14"
dependencies = ["woobe-core==0.12.0"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["worker_main"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["woobe_workers*"]
