[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "woobe-workers"
version = "0.1.0"
description = "Woobe worker process package"
requires-python = ">=3.14"
dependencies = ["woobe-core==0.1.0"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["worker_main", "network_agent_runtime_composition"]
