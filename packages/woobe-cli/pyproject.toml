[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "woobe-cli"
version = "0.1.0"
description = "CLI client for the Woobe control plane"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
woobe = "woobe_cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/woobe_cli"]
