[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "woobe-core"
version = "0.13.0"
description = "Woobe Community/Core domain and runtime package"
requires-python = ">=3.14"
dependencies = [
    "aio-pika>=9.5.0",
    "alembic>=1.15.0",
    "asyncpg>=0.31.0",
    "boto3>=1.35.0",
    "cryptography>=50.0.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langgraph-sdk>=0.4.4",
    "langchain-openai>=0.3.0",
    "langsmith>=0.8.18",
    "markdown-it-py==4.0.0",
    "jsonschema>=4.25.1",
    "pgvector>=0.4.2",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pymongo>=4.18.2",
    "pypdf>=6.19.0",
    "pypdfium2==5.14.0",
    "Pillow==12.3.0",
    "pyyaml>=6.0.3",
    "redis>=6.4.0",
    "sqlalchemy>=2.0.50",
    "urllib3>=2.8.0",
    "uuid6>=2025.0.1",
]

[project.optional-dependencies]
docling-processing = [
    "docling-slim[convert-core,format-docx,format-pdf-docling]==2.140.0",
    "docling-core==2.103.1",
    "docling-parse==7.22.1",
    "python-docx==1.2.0",
    "lxml==6.1.3",
    "numpy==2.4.6",
    "scipy==1.18.1",
    "rtree==1.4.1",
    "pandas==3.0.6",
    "tabulate==0.10.0",
    "doclang==0.7.3",
    "defusedxml==0.7.1",
    "latex2mathml==3.81.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["modules*", "shared*"]

[tool.setuptools.package-data]
"modules.package.domain.schemas" = ["*.json"]
"modules.artifacts.infra.processing" = ["manifests/*.json"]
