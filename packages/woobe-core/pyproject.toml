[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "woobe-core"
version = "0.12.0"
description = "Woobe Community/Core domain and runtime package"
requires-python = ">=3.14"
dependencies = [
    "aio-pika>=9.5.0",
    "alembic>=1.15.0",
    "asyncpg>=0.31.0",
    "boto3>=1.35.0",
    "cryptography>=50.0.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langsmith>=0.8.18",
    "pgvector>=0.4.2",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pymongo>=4.11.0",
    "pypdf>=6.0.0",
    "pyyaml>=6.0.3",
    "redis>=6.4.0",
    "sqlalchemy>=2.0.50",
    "uuid6>=2025.0.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["modules*", "shared*"]
