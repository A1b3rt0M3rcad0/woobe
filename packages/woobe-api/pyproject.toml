[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "woobe-api"
version = "0.1.0"
description = "Woobe HTTP/API process package"
requires-python = ">=3.14"
dependencies = ["woobe-core==0.1.0"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["main", "public_runtime_routes", "runtime_composition", "chat_runtime_composition"]
