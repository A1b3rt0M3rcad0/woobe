[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "woobe-api"
version = "0.14.0"
description = "Woobe HTTP/API process package"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.136.3",
    "pydantic>=2.13.4",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.50",
    "starlette>=1.3.1",
    "uvicorn>=0.48.0",
    "woobe-core==0.14.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["main", "public_runtime_routes", "runtime_composition", "chat_runtime_composition"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["woobe_api*"]
