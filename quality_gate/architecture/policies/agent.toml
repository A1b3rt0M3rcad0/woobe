[module]
name = "agent"
root = "src/modules/agent"
package = "modules.agent"
required_layers = ["domain", "application", "infra", "presentation", "composition"]

[constraints]
forbid_cross_module_imports = true
forbid_dynamic_imports = true
forbid_wildcard_imports = true
forbid_cycles = true
forbidden_paths = [
  "runtime",
  "application/composers",
  "domain/ports",
  "domain/repositories.py",
]

[composer_contract]
source = ["composition/composers/**"]
function_suffix = "_composer"
streaming_suffix = "_stream_composer"
allowed_handlers = ["TransactionalHandler", "StreamingTransactionalHandler"]
regular_handler = "TransactionalHandler"
streaming_handler = "StreamingTransactionalHandler"
uow_types = ["AgentUnitOfWork"]
forbidden_parameter_types = ["AsyncSession", "AsyncEngine", "async_sessionmaker"]
forbidden_parameter_names = ["session", "session_factory", "async_engine", "engine"]
forbidden_calls = ["Settings", "Settings.model_validate", "create_engine", "create_session_factory", "create_file_storage"]
repository_suffixes = ["Repository", "OutboxEventWriter"]
forbid_control_flow = true
forbid_nested_definitions = true
forbid_uow_attribute_access = true
require_repository_uow_argument = true
require_zero_arguments = true
dependency_parameter_tokens = [
  "database", "settings", "session", "engine", "factory", "executor",
  "repository", "repo", "storage", "publisher", "client", "registry",
  "uow", "unit_of_work",
]
uow_resource_names = ["DATABASE_ENGINE"]
forbid_module_level_transients = true
transient_suffixes = [
  "UnitOfWork", "Repository", "OutboxEventWriter", "UseCase", "Controller",
  "Handler", "Service",
]
forbid_composed_dependency_calls = true
enforce_zero_arg_callsites = true
forbidden_module_level_calls = [
  "Settings", "create_engine", "create_session_factory", "create_file_storage",
  "get_http_tool_executor",
]

[unit_of_work_contract]
interface_files = ["src/shared/contracts/unit_of_work.py"]
deprecated_interface_files = []
concrete_sources = ["infra/database/unit_of_work.py"]
forbidden_interface_imports = [
  "sqlalchemy", "alembic", "asyncpg", "psycopg2", "pgvector",
  "fastapi", "starlette", "aio_pika", "boto3", "langchain",
  "langchain_core", "langchain_openai", "shared.infra", "modules",
]
repository_name_fragments = ["Repository", "Writer"]
allowed_properties = ["session"]
forbid_repository_imports = true
forbid_repository_properties = true

[repository_contract]
interface_sources = [
  "application/interfaces/repositories.py",
  "application/interfaces/*repository*.py",
]
concrete_sources = ["infra/database/**/*.py", "infra/database/*.py"]
external_base_files = []
concrete_name_prefixes = ["SQLAlchemy", "SqlAlchemy"]
excluded_port_bases = ["BaseSQLAlchemyRepository", "SqlAlchemyRepositoryBase"]
forbidden_interface_imports = [
  "sqlalchemy", "alembic", "asyncpg", "psycopg2", "pgvector",
  "modules.agent.infra", "shared.infra",
]
forbidden_constructor_types = ["AsyncSession", "AsyncEngine", "async_sessionmaker"]
forbidden_transaction_methods = ["commit", "rollback"]
require_application_port_base = true
require_uow_constructor = true

[application_contract]
source = [
  "application/use_cases/**/*.py",
  "application/use_cases/*.py",
  "application/*use_case*.py",
]
dependency_name_tokens = [
  "repo", "repository", "reader", "writer", "factory", "executor",
  "storage", "cipher", "publisher", "clock",
]
forbid_untyped_dependencies = true

# First-match semantics: narrow rules precede broad layer rules.
# Agent execution is not an architectural layer. Long-lived provider/tool execution
# is implemented by infra/execution behind Application contracts; wiring belongs to
# composition and HTTP/SSE formatting belongs to presentation.

[[rules]]
id = "ARCH026"
description = "composers are pure composition roots: they may wire concrete implementations but cannot depend directly on frameworks, transport primitives or configuration loaders"
source = ["composition/composers/**"]
allow = [
  "modules.agent.composition",
  "modules.agent.domain",
  "modules.agent.application",
  "modules.agent.infra",
  "modules.agent.presentation.controllers",
  "modules.agent.presentation.http.controllers",
  "modules.agent.presentation.interfaces",
  "modules.agent.presentation.schemas",
  "shared.contracts",
  "shared.security",
  "shared.infra.crypto",
  "shared.infra.transactional_handler",
  "shared.infra.streaming_transactional_handler",
]
deny = [
  "modules.agent.presentation.routes",
  "modules.agent.presentation.credential_routes",
  "modules.agent.presentation.release_activation_routes",
  "modules.agent.presentation.tool_lifecycle_routes",
  "modules.agent.presentation.vector_snapshot_routes",
  "modules.agent.presentation.mcp_tools_routes",
  "shared.infra.config",
  "shared.presentation",
  "sqlalchemy",
  "alembic",
  "asyncpg",
  "psycopg2",
  "pgvector",
  "fastapi",
  "starlette",
  "aio_pika",
  "boto3",
  "langchain",
  "langchain_core",
  "langchain_openai",
  "httpx",
  "uvicorn",
]

[[rules]]
id = "ARCH005"
description = "presentation controllers depend only on application contracts, domain values and presentation code"
source = ["presentation/controllers/**", "presentation/http/controllers/**"]
allow = [
  "shared.contracts",
  "shared.security.principal",
  "modules.agent.presentation",
  "modules.agent.application.interfaces",
  "modules.agent.application.dtos",
  "modules.agent.domain",
  "shared.presentation",
]
deny = [
  "modules.agent.application.use_cases",
  "modules.agent.infra",
  "modules.agent.composition",
  "shared.infra",
  "shared.messaging",
  "shared.workers",
]

[[rules]]
id = "ARCH006H"
description = "HTTP routes are transport adapters and may invoke zero-argument Agent composers, but cannot own infrastructure or application use cases"
source = ["presentation/http/**"]
allow = [
  "shared.contracts",
  "shared.security.principal",
  "modules.agent.presentation",
  "modules.agent.application.interfaces",
  "modules.agent.application.dtos",
  "modules.agent.domain",
  "modules.agent.composition.composers",
  "shared.presentation",
  "shared.security",
]
deny = [
  "modules.agent.application.use_cases",
  "modules.agent.infra",
  "modules.agent.composition.resources",
  "shared.infra",
  "shared.messaging",
  "shared.workers",
  "sqlalchemy",
]

[[rules]]
id = "ARCH006"
description = "presentation is transport-only and cannot import composition or infrastructure"
source = ["presentation/**"]
allow = [
  "shared.contracts",
  "shared.security.principal",
  "modules.agent.presentation",
  "modules.agent.application.interfaces",
  "modules.agent.application.dtos",
  "modules.agent.domain",
  "shared.presentation",
  "shared.security",
]
deny = [
  "modules.agent.application.use_cases",
  "modules.agent.infra",
  "modules.agent.composition",
  "shared.infra",
  "shared.messaging",
  "shared.workers",
  "sqlalchemy",
]

[[rules]]
id = "ARCH004E"
description = "explicit legacy Agent execution files may temporarily consume Application orchestration while the runtime layer removal is completed; all other infra execution code follows ARCH004"
source = [
  "infra/execution/agent_tool_executor.py",
  "infra/execution/agent_tool_runtime_gateway.py",
  "infra/execution/ask_use_case.py",
  "infra/execution/execution_instrumentation.py",
  "infra/execution/explicit_runtime_persistence.py",
  "infra/execution/instrumented_execution_finalizer.py",
  "infra/execution/instrumented_failed_finalizer.py",
  "infra/execution/instrumented_fallback_mixin.py",
  "infra/execution/instrumented_primary_mixin.py",
  "infra/execution/release_runtime_resolver.py",
  "infra/execution/structured_output_ask_use_case.py",
  "infra/execution/tool_runtime_registry.py",
]
allow = [
  "modules.agent.infra",
  "modules.agent.application",
  "modules.agent.domain",
  "shared",
]
deny = [
  "modules.agent.presentation",
  "modules.agent.composition",
]

[[rules]]
id = "ARCH004W"
description = "infra workers are inbound adapters: they may invoke Application use cases but cannot depend on presentation or composition"
source = ["infra/workers/**"]
allow = [
  "modules.agent.infra",
  "modules.agent.application",
  "modules.agent.domain",
  "shared",
]
deny = [
  "modules.agent.presentation",
  "modules.agent.composition",
]

[[rules]]
id = "ARCH019"
description = "composition is the outer module layer and may wire application, infrastructure and presentation without being imported back by them"
source = ["composition/**"]
allow = [
  "modules.agent.composition",
  "modules.agent.domain",
  "modules.agent.application",
  "modules.agent.infra",
  "modules.agent.presentation",
  "shared",
]
deny = []

[[rules]]
id = "ARCH020"
description = "agent entrypoint reaches module internals only through composition"
source = ["entrypoint.py", "__init__.py"]
allow = ["modules.agent.composition"]
deny = [
  "modules.agent.domain",
  "modules.agent.application",
  "modules.agent.infra",
  "modules.agent.presentation",
]

[[rules]]
id = "ARCH002"
description = "domain remains independent from outer layers and technical frameworks"
source = ["domain/**"]
allow = ["modules.agent.domain", "shared.contracts"]
deny = [
  "modules.agent.application",
  "modules.agent.infra",
  "modules.agent.presentation",
  "modules.agent.composition",
  "shared.infra",
  "shared.messaging",
  "shared.presentation",
  "shared.workers",
  "sqlalchemy", "alembic", "asyncpg", "psycopg2", "pgvector",
  "fastapi", "starlette", "aio_pika", "boto3", "langchain",
  "langchain_core", "langchain_openai", "httpx", "uvicorn",
]

[[rules]]
id = "ARCH003"
description = "application owns ports and business orchestration and depends only on application, domain and stable shared contracts"
source = ["application/**"]
allow = [
  "modules.agent.application",
  "modules.agent.domain",
  "shared.contracts",
  "shared.security.redaction",
  "shared.security.crypto",
]
deny = [
  "modules.agent.infra",
  "modules.agent.presentation",
  "modules.agent.composition",
  "shared.infra",
  "shared.messaging",
  "shared.presentation",
  "shared.workers",
  "sqlalchemy", "alembic", "asyncpg", "psycopg2", "pgvector",
  "fastapi", "starlette", "aio_pika", "boto3", "langchain",
  "langchain_core", "langchain_openai", "httpx", "uvicorn",
]

[[rules]]
id = "ARCH004"
description = "infrastructure implements application contracts and cannot depend on concrete application use cases, presentation or composition"
source = ["infra/**"]
allow = [
  "modules.agent.infra",
  "modules.agent.application.interfaces",
  "modules.agent.application.dtos",
  "modules.agent.domain",
  "shared",
]
deny = [
  "modules.agent.application.use_cases",
  "modules.agent.presentation",
  "modules.agent.composition",
]
