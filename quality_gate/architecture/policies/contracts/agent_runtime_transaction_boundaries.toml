[runtime_transaction_boundaries]
module_root = "src/modules/agent"
resources_file = "src/modules/agent/composition/resources.py"
uow_type = "AgentUnitOfWork"
engine_resource = "DATABASE_ENGINE"
long_lived_annotation = "Callable"
long_lived_composer_sources = [
  "composition/composers/ask_agent_composer.py",
  "composition/composers/ask_agent_stream_composer.py",
  "composition/composers/public_runtime_composers.py",
]
long_lived_composer_functions = [
  "ask_agent_composer",
  "ask_agent_stream_composer",
  "public_run_composer",
  "public_stream_composer",
]
forbidden_database_types = ["AsyncEngine", "AsyncSession", "async_sessionmaker"]
framework_forbidden_scopes = [
  "application",
  "presentation",
  "infra/execution",
  "infra/adapters",
]
uow_constructor_forbidden_scopes = [
  "application",
  "presentation",
  "infra/execution",
  "infra/adapters",
]
engine_allowed_consumers = ["AgentUnitOfWork"]
engine_allowed_paths = [
  "composition/composers/**",
  "composition/factories/agent_uow_factory.py",
]
