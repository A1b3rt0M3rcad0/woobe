[transaction_ownership]
module_root = "src/modules/agent"
uow_file = "src/modules/agent/infra/database/unit_of_work.py"
resources_file = "src/modules/agent/composition/resources.py"
process_resources = ["SETTINGS", "DATABASE_ENGINE", "FILE_STORAGE"]
forbidden_database_facades = [
  "AgentDatabase",
  "AgentDatabaseInput",
  "agent_session_factory",
  "coerce_agent_database",
  "SESSION_FACTORY",
  "AGENT_DATABASE",
]
forbidden_session_creators = [
  "async_sessionmaker",
  "sessionmaker",
  "create_session_factory",
  "open_session",
]
transaction_methods = ["begin", "commit", "rollback", "close"]
transaction_target_names = [
  "session",
  "_session",
  "transaction",
  "_transaction",
  "tx",
  "_tx",
]
facade_forbidden_scopes = ["runtime", "composition"]
uow_type = "AgentUnitOfWork"
uow_engine_type = "AsyncEngine"
forbidden_uow_constructor_types = ["AgentDatabase", "async_sessionmaker", "AsyncSession"]
