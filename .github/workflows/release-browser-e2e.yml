name: Release browser E2E

on:
  pull_request:
    branches: [development-mvp]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend and pinned browser runner
        run: |
          npm --prefix web ci
          npm --prefix e2e install --no-save --no-package-lock @playwright/test@1.52.0
          npx --prefix e2e playwright install --with-deps chromium
      - name: Run Chromium MVP flows without retries
        run: npx --prefix e2e playwright test --config playwright.config.ts
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-browser-evidence
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: warn
