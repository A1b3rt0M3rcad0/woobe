name: Security audit

on:
  pull_request:
    branches: [development]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  secret-history:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: 8.24.3
          GITLEAKS_ARCHIVE: gitleaks_8.24.3_linux_x64.tar.gz
          GITLEAKS_ARCHIVE_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/gitleaks-${GITLEAKS_VERSION}"
          archive_path="$RUNNER_TEMP/${GITLEAKS_ARCHIVE}"
          rm -rf "$install_dir" "$archive_path"
          mkdir -p "$install_dir"
          curl -fsSLo "$archive_path" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${GITLEAKS_ARCHIVE}"
          echo "${GITLEAKS_ARCHIVE_SHA256}  ${archive_path}" | sha256sum -c -
          tar -xzf "$archive_path" -C "$install_dir" gitleaks
          chmod +x "$install_dir/gitleaks"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Scan reachable Git history
        shell: bash
        run: |
          set -euo pipefail
          gitleaks git --redact --exit-code 1 --log-opts="--all" .
