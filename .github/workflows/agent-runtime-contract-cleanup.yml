name: Agent runtime contract cleanup

on:
  push:
    branches: [feature/agent-quality-gate]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/agent-quality-gate
          fetch-depth: 0
      - name: Separate runtime contracts from concrete orchestration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import ast
          import shutil

          root = Path('.')
          agent = root / 'src/modules/agent'
          app_interfaces = agent / 'application/interfaces'
          runtime = agent / 'composition/runtime'

          # Execution context is an application-owned runtime contract/carrier.
          source_context = agent / 'application/use_cases/execution_context.py'
          target_context = app_interfaces / 'execution_context.py'
          if source_context.exists():
              shutil.move(str(source_context), str(target_context))

          execution_contract = app_interfaces / 'execution.py'
          if not execution_contract.exists():
              execution_contract.write_text(
                  'from dataclasses import dataclass, field\n'
                  'from typing import Any\n\n'
                  'from modules.agent.application.dtos.runtime_dtos import ToolCallInfo\n\n\n'
                  '@dataclass\n'
                  'class InstrumentedExecution:\n'
                  '    result: Any\n'
                  '    tool_calls: list[ToolCallInfo] = field(default_factory=list)\n'
                  '    llm_calls: list[dict[str, Any]] = field(default_factory=list)\n'
                  '    timeline: list[dict[str, Any]] = field(default_factory=list)\n'
                  '    tool_wall_latency_ms: int = 0\n'
                  '    tool_call_duration_sum_ms: int = 0\n'
                  '    failure_context: dict[str, Any] | None = None\n\n\n'
                  'class InstrumentedExecutionError(RuntimeError):\n'
                  '    def __init__(\n'
                  '        self,\n'
                  '        message: str,\n'
                  '        *,\n'
                  '        llm_calls: list[dict[str, Any]] | None = None,\n'
                  '        tool_calls: list[ToolCallInfo] | None = None,\n'
                  '        timeline: list[dict[str, Any]] | None = None,\n'
                  '        tool_wall_latency_ms: int = 0,\n'
                  '        tool_call_duration_sum_ms: int = 0,\n'
                  '        failure_context: dict[str, Any] | None = None,\n'
                  '    ) -> None:\n'
                  '        super().__init__(message)\n'
                  '        self.llm_calls = llm_calls or []\n'
                  '        self.tool_calls = tool_calls or []\n'
                  '        self.timeline = timeline or []\n'
                  '        self.tool_wall_latency_ms = tool_wall_latency_ms\n'
                  '        self.tool_call_duration_sum_ms = tool_call_duration_sum_ms\n'
                  '        self.failure_context = failure_context\n',
                  encoding='utf-8',
              )

          # Remove the concrete file's duplicate contract definitions.
          instrumentation = runtime / 'execution_instrumentation.py'
          text = instrumentation.read_text(encoding='utf-8')
          tree = ast.parse(text)
          lines = text.splitlines(keepends=True)
          targets = [
              node for node in tree.body
              if isinstance(node, ast.ClassDef)
              and node.name in {'InstrumentedExecution', 'InstrumentedExecutionError'}
          ]
          for node in sorted(targets, key=lambda n: n.lineno, reverse=True):
              del lines[node.lineno - 1:(node.end_lineno or node.lineno)]
          text = ''.join(lines)
          text = text.replace('from dataclasses import dataclass, field\n', '')
          contract_import = (
              'from modules.agent.application.interfaces.execution import (\n'
              '    InstrumentedExecution,\n'
              '    InstrumentedExecutionError,\n'
              ')\n'
          )
          marker = 'from modules.agent.application.dtos.runtime_dtos import ToolCallInfo, UsageInfo\n'
          if contract_import not in text:
              text = text.replace(marker, marker + contract_import)
          instrumentation.write_text(text, encoding='utf-8')

          # Context must reference the application-owned execution result contract.
          context_text = target_context.read_text(encoding='utf-8')
          context_text = context_text.replace(
              'from modules.agent.composition.runtime.execution_instrumentation import (\n    InstrumentedExecution,\n)\n',
              'from modules.agent.application.interfaces.execution import InstrumentedExecution\n',
          )
          target_context.write_text(context_text, encoding='utf-8')

          # These helpers are tightly coupled to concrete runtime streaming/LLM orchestration.
          more_runtime = [
              'instrumented_execution_runner.py',
              'instrumented_fallback_mixin.py',
              'runtime_output_validation.py',
          ]
          replacements = {
              'modules.agent.application.use_cases.execution_context': 'modules.agent.application.interfaces.execution_context',
          }
          for name in more_runtime:
              source = agent / 'application/use_cases' / name
              if source.exists():
                  shutil.move(str(source), str(runtime / name))
              module = name[:-3]
              replacements[
                  f'modules.agent.application.use_cases.{module}'
              ] = f'modules.agent.composition.runtime.{module}'

          # Composition runtime should use the canonical execution contract directly.
          replacements[
              'modules.agent.composition.runtime.execution_instrumentation import InstrumentedExecution'
          ] = 'modules.agent.application.interfaces.execution import InstrumentedExecution'

          for base in (root / 'src', root / 'tests'):
              for path in base.rglob('*.py'):
                  text = path.read_text(encoding='utf-8-sig')
                  updated = text
                  for before, after in replacements.items():
                      updated = updated.replace(before, after)
                  if updated != text:
                      path.write_text(updated, encoding='utf-8')

          # Application package must not re-export concrete Composition runtime types.
          use_cases_init = agent / 'application/use_cases/__init__.py'
          text = use_cases_init.read_text(encoding='utf-8')
          text = text.replace(
              'from modules.agent.composition.runtime.ask_agent_stream_service import AskAgentStreamService\n',
              '',
          )
          text = text.replace(
              'from modules.agent.composition.runtime.ask_use_case import AskAgentUseCase\n',
              '',
          )
          text = text.replace('    "AskAgentStreamService",\n', '')
          text = text.replace('    "AskAgentUseCase",\n', '')
          use_cases_init.write_text(text, encoding='utf-8')
          PY
          python -m compileall -q src/modules/agent
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          git commit -m 'refactor: separate agent runtime contracts from orchestration'
          git push origin HEAD:feature/agent-quality-gate
