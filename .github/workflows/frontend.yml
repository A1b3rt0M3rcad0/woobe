name: Frontend test and build

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "packages/woobe-frontend/**"
      - "packages/woobe-embed/**"
      - "packages/woobe-runtime-client/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/woobe-frontend
    env:
      VITE_API_URL: http://127.0.0.1:8000
      VITE_CHAT_EMBED_URL: http://127.0.0.1:8081
      VITE_WOOBE_EDITION: core
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/woobe-frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test:run

      - name: Build frontend production bundle
        run: npm run build

      - name: Install Chat Embed dependencies
        working-directory: packages/woobe-embed
        run: npm ci

      - name: Run Chat Embed tests
        working-directory: packages/woobe-embed
        run: npm test

      - name: Typecheck Chat Embed
        working-directory: packages/woobe-embed
        run: npm run typecheck
