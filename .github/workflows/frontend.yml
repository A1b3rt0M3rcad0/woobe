name: Frontend

on:
  pull_request:
    branches:
      - development-mvp
      - development
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_API_URL: http://localhost:8000
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript and Vite build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee frontend-build.log
      - name: Upload frontend build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: web/frontend-build.log
          if-no-files-found: warn
      - name: Vitest
        shell: bash
        run: |
          set -o pipefail
          npm run test:run 2>&1 | tee frontend-vitest.log
      - name: Upload frontend Vitest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-vitest
          path: web/frontend-vitest.log
          if-no-files-found: warn
