name: Frontend test and build

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "packages/woobe-frontend/**"
      - "packages/woobe-ui/**"
      - "packages/woobe-embed/**"
      - "packages/woobe-runtime-client/**"
      - "tests/e2e/**"
      - "docs/design/**"
      - "docs/screenshots/**"
      - "scripts/frontend_visual_inventory.py"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/woobe-frontend
    env:
      VITE_API_URL: http://127.0.0.1:8000
      VITE_CHAT_EMBED_URL: http://127.0.0.1:8081
      VITE_WOOBE_EDITION: core
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/woobe-frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test:run

      - name: Build frontend production bundle
        run: npm run build

      - name: Install browser fixture dependencies
        working-directory: tests/e2e
        run: npm ci

      - name: Prepare pinned Chromium
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      - name: Install Chat Embed dependencies
        working-directory: packages/woobe-embed
        run: npm ci

      - name: Qualify built frontend with browser API fixtures
        working-directory: tests/e2e
        run: npx playwright test --config playwright.config.ts

      - name: Verify frontend visual evidence inventory
        working-directory: .
        run: python3 scripts/frontend_visual_inventory.py

      - name: Run Chat Embed tests
        working-directory: packages/woobe-embed
        run: npm test

      - name: Qualify shared components, overlays and responsive states
        working-directory: tests/e2e
        run: npx playwright test --config review.config.ts --workers=2

      - name: Typecheck Chat Embed
        working-directory: packages/woobe-embed
        run: npm run typecheck
