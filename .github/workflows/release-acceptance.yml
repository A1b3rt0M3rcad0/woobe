name: Release acceptance

on:
  pull_request:
    branches: [development-mvp]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance-security-load:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: projectrai
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d projectrai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      rabbitmq:
        image: rabbitmq:4-management
        env:
          RABBITMQ_DEFAULT_USER: projectrai
          RABBITMQ_DEFAULT_PASS: projectrai
        ports: [5672:5672]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      PYTHONPATH: src:.
      PROJECTRAI_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/projectrai
      PROJECTRAI_SECRET_KEY: ci-secret-key-at-least-32-characters
      PROJECTRAI_ENCRYPTION_KEY: ci-encryption-key-at-least-32-characters
      PROJECTRAI_RABBITMQ_URL: amqp://projectrai:projectrai@localhost:5672/
      PROJECTRAI_ENVIRONMENT: test
      PROJECTRAI_DEBUG: "false"
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies and PostgreSQL client
        run: |
          uv sync --frozen --all-groups --extra test
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Exercise empty migration rollback and re-upgrade
        run: |
          set -euo pipefail
          uv run alembic upgrade head | tee migration-upgrade.log
          uv run alembic current | tee migration-current-before.log
          uv run alembic downgrade -1 | tee migration-downgrade.log
          uv run alembic upgrade head | tee migration-reupgrade.log
          uv run alembic current | tee migration-current-after.log
          uv run alembic check
      - name: Exercise backup and restore into isolated database
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d projectrai -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE IF NOT EXISTS public.release_restore_probe (id integer PRIMARY KEY, value text NOT NULL);
          INSERT INTO public.release_restore_probe (id, value)
          VALUES (1, 'stage-08')
          ON CONFLICT (id) DO UPDATE SET value = EXCLUDED.value;
          SQL
          mkdir -p "$RUNNER_TEMP/backups"
          backup_file="$(POSTGRES_HOST=localhost POSTGRES_DB=projectrai POSTGRES_USER=postgres POSTGRES_PASSWORD=postgres BACKUP_DIR="$RUNNER_TEMP/backups" sh scripts/backup_postgres.sh)"
          createdb -h localhost -U postgres projectrai_restore
          POSTGRES_HOST=localhost POSTGRES_DB=projectrai_restore POSTGRES_USER=postgres POSTGRES_PASSWORD=postgres RESTORE_FILE="$backup_file" RESTORE_CONFIRM=restore-projectrai sh scripts/restore_postgres.sh
          test "$(psql -h localhost -U postgres -d projectrai_restore -Atc "SELECT value FROM public.release_restore_probe WHERE id = 1")" = "stage-08"
          printf '%s\n' "$backup_file" > backup-restore-evidence.txt
          sha256sum -c "$backup_file.sha256" | tee -a backup-restore-evidence.txt
      - name: Run release acceptance and security matrix
        run: |
          uv run pytest -q \
            tests/fakes \
            tests/security \
            tests/performance \
            tests/integration/security/test_tenant_authorization_postgres.py \
            tests/integration/security/test_api_key_guard_postgres.py \
            tests/integration/agent/test_stream_event_contracts.py \
            tests/integration/agent/test_stream_cancellation_postgres.py \
            tests/integration/agent/test_session_history_reload_postgres.py \
            --junitxml=release-acceptance.xml
      - name: Start deterministic provider
        run: |
          uv run uvicorn tests.fakes.openai_provider:app --host 127.0.0.1 --port 8099 > fake-provider.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8099/health && exit 0
            sleep 1
          done
          cat fake-provider.log
          exit 1
      - name: Run sync and streaming load gates
        run: |
          uv run python tests/performance/release_load.py \
            --url http://127.0.0.1:8099/v1/chat/completions \
            --requests 120 --concurrency 12 \
            --max-p95-ms 500 --max-error-rate 0 \
            --output release-load-sync.json
          uv run python tests/performance/release_load.py \
            --url http://127.0.0.1:8099/v1/chat/completions \
            --requests 80 --concurrency 8 --stream \
            --max-p95-ms 750 --max-ttft-p95-ms 250 --max-error-rate 0 \
            --output release-load-stream.json
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-acceptance-evidence
          path: |
            migration-*.log
            backup-restore-evidence.txt
            release-acceptance.xml
            release-load-*.json
            fake-provider.log
          if-no-files-found: warn
