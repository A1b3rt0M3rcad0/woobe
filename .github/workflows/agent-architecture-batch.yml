name: Agent architecture boundary cleanup

on:
  push:
    branches: [feature/agent-quality-gate]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/agent-quality-gate
          fetch-depth: 0
      - name: Apply boundary cleanup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import ast
          import shutil

          root = Path('.')
          src = root / 'src'
          agent = src / 'modules/agent'

          # Shared remains a technical-only kernel: contracts live in shared/contracts,
          # never in shared/domain or shared/application.
          contracts = src / 'shared/contracts'
          contracts.mkdir(parents=True, exist_ok=True)
          (contracts / '__init__.py').touch()
          shared_moves = {
              src / 'shared/domain/errors.py': contracts / 'errors.py',
              src / 'shared/application/pagination.py': contracts / 'pagination.py',
              src / 'shared/application/time.py': contracts / 'time.py',
              src / 'shared/application/llm_cost.py': contracts / 'llm_cost.py',
              src / 'shared/application/llm_usage.py': contracts / 'llm_usage.py',
          }
          for source, target in shared_moves.items():
              if source.exists():
                  shutil.move(str(source), str(target))
          for directory in (src / 'shared/domain', src / 'shared/application'):
              init = directory / '__init__.py'
              if init.exists():
                  init.unlink()
              if directory.exists() and not any(directory.iterdir()):
                  directory.rmdir()

          replacements = {
              'shared.domain.errors': 'shared.contracts.errors',
              'shared.application.pagination': 'shared.contracts.pagination',
              'shared.application.time': 'shared.contracts.time',
              'shared.application.llm_cost': 'shared.contracts.llm_cost',
              'shared.application.llm_usage': 'shared.contracts.llm_usage',
          }
          for base in (src, root / 'tests'):
              for path in base.rglob('*.py'):
                  text = path.read_text(encoding='utf-8-sig')
                  updated = text
                  for before, after in replacements.items():
                      updated = updated.replace(before, after)
                  if updated != text:
                      path.write_text(updated, encoding='utf-8')

          # Agent application depends on the cipher port, not its concrete adapter.
          for relative in ('mcp_oauth.py', 'mcp_oauth_flow_safety.py', 'mcp_oauth_flows.py'):
              path = agent / 'application' / relative
              text = path.read_text(encoding='utf-8')
              text = text.replace(
                  'from modules.agent.infra.adapters.secret_cipher import SecretCipherAdapter\n',
                  'from modules.agent.application.interfaces.ports import SecretCipherPort\n',
              )
              # mcp_oauth already imports other symbols from interfaces.ports; duplicate
              # imports are valid and Ruff can consolidate later without changing behavior.
              text = text.replace('SecretCipherAdapter', 'SecretCipherPort')
              path.write_text(text, encoding='utf-8')

          # Pure application contract/helper surfaces consumed by outer adapters belong
          # to application/interfaces.
          interface_moves = {
              agent / 'application/services/rag/embedding_errors.py': agent / 'application/interfaces/embedding_errors.py',
              agent / 'application/mcp_readiness.py': agent / 'application/interfaces/mcp_readiness.py',
          }
          for source, target in interface_moves.items():
              if source.exists():
                  shutil.move(str(source), str(target))
          path_replacements = {
              'modules.agent.application.services.rag.embedding_errors': 'modules.agent.application.interfaces.embedding_errors',
              'modules.agent.application.mcp_readiness': 'modules.agent.application.interfaces.mcp_readiness',
          }
          for base in (src, root / 'tests'):
              for path in base.rglob('*.py'):
                  text = path.read_text(encoding='utf-8-sig')
                  updated = text
                  for before, after in path_replacements.items():
                      updated = updated.replace(before, after)
                  if updated != text:
                      path.write_text(updated, encoding='utf-8')

          # Move AgentToolExecutor (runtime orchestration) out of infra. HttpToolExecutor
          # remains the concrete low-level HTTP adapter in infra.
          tool_executor = agent / 'infra/adapters/tool_executor.py'
          text = tool_executor.read_text(encoding='utf-8')
          tree = ast.parse(text)
          agent_class = next(
              node for node in tree.body
              if isinstance(node, ast.ClassDef) and node.name == 'AgentToolExecutor'
          )
          lines = text.splitlines(keepends=True)
          class_source = ''.join(lines[agent_class.lineno - 1:(agent_class.end_lineno or agent_class.lineno)])
          del lines[agent_class.lineno - 1:(agent_class.end_lineno or agent_class.lineno)]
          infra_text = ''.join(lines)
          for stale in (
              'from modules.agent.application.tool_converter import agent_tool_to_openai_definition\n',
              'from modules.agent.application.interfaces.tool_executor import ToolExecutor\n',
              'from modules.agent.application.interfaces.repositories import ToolRepository\n',
          ):
              infra_text = infra_text.replace(stale, '')
          tool_executor.write_text(infra_text, encoding='utf-8')

          runtime_executor = agent / 'composition/runtime/agent_tool_executor.py'
          runtime_executor.write_text(
              'from modules.agent.application.interfaces.ports import (\n'
              '    ToolExecutionPort,\n'
              '    ToolSecretResolverPort,\n'
              ')\n'
              'from modules.agent.application.interfaces.repositories import ToolRepository\n'
              'from modules.agent.application.interfaces.tool_executor import ToolExecutor\n'
              'from modules.agent.application.tool_converter import agent_tool_to_openai_definition\n'
              'from modules.agent.infra.adapters.tool_executor import HttpToolExecutor\n\n\n'
              + class_source.lstrip(),
              encoding='utf-8',
          )
          executor_import_before = 'from modules.agent.infra.adapters.tool_executor import AgentToolExecutor'
          executor_import_after = 'from modules.agent.composition.runtime.agent_tool_executor import AgentToolExecutor'
          for base in (src, root / 'tests'):
              for path in base.rglob('*.py'):
                  text = path.read_text(encoding='utf-8-sig')
                  updated = text.replace(executor_import_before, executor_import_after)
                  if updated != text:
                      path.write_text(updated, encoding='utf-8')

          # Public /v1 runtime dispatch composes Agent + Network and therefore belongs at
          # the application root, above both bounded contexts.
          old_public = agent / 'presentation/public_runtime_routes.py'
          new_public = src / 'public_runtime_routes.py'
          if old_public.exists():
              shutil.move(str(old_public), str(new_public))
          for base in (src, root / 'tests'):
              for path in base.rglob('*.py'):
                  text = path.read_text(encoding='utf-8-sig')
                  updated = text.replace(
                      'modules.agent.presentation.public_runtime_routes',
                      'public_runtime_routes',
                  )
                  if updated != text:
                      path.write_text(updated, encoding='utf-8')

          # Worker discovery uses each module's explicit entrypoint when available.
          discovery = src / 'shared/workers/discovery.py'
          text = discovery.read_text(encoding='utf-8')
          text = text.replace(
              '    module_paths = [\n'
              '        (module_name, f"modules.{module_name}.infra.workers.registry")\n'
              '        for module_name in CORE_MODULE_WORKER_REGISTRIES\n'
              '    ]\n',
              '    module_paths = [\n'
              '        (\n'
              '            module_name,\n'
              '            "modules.agent.entrypoint"\n'
              '            if module_name == "agent"\n'
              '            else f"modules.{module_name}.infra.workers.registry",\n'
              '        )\n'
              '        for module_name in CORE_MODULE_WORKER_REGISTRIES\n'
              '    ]\n',
          )
          discovery.write_text(text, encoding='utf-8')

          # Policy follows the existing technical-only shared contract convention.
          policy = root / 'quality_gate/architecture/policies/agent.toml'
          text = policy.read_text(encoding='utf-8')
          text = text.replace('"shared.domain"', '"shared.contracts"')
          text = text.replace('"shared.application"', '"shared.contracts"')
          policy.write_text(text, encoding='utf-8')
          PY
          python -m compileall -q src/modules/agent src/shared/contracts src/public_runtime_routes.py
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests quality_gate
          git commit -m 'refactor: enforce agent adapter and shared contract boundaries'
          git push origin HEAD:feature/agent-quality-gate
