name: Agent runtime boundary migration

on:
  push:
    branches: [feature/agent-quality-gate]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/agent-quality-gate
          fetch-depth: 0
      - name: Move concrete runtime orchestration to composition
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import shutil

          root = Path('.')
          agent = root / 'src/modules/agent'
          runtime = agent / 'composition/runtime'
          runtime.mkdir(parents=True, exist_ok=True)
          (runtime / '__init__.py').touch()

          runtime_names = [
              'ask_agent_stream_service.py',
              'ask_use_case.py',
              'structured_output_ask_use_case.py',
              'execution_instrumentation.py',
              'instrumented_execution_finalizer.py',
              'instrumented_failed_finalizer.py',
              'instrumented_primary_mixin.py',
              'structured_json_repair.py',
              'tool_execution_loop.py',
              'legacy_runtime_status_adapter.py',
              'release_runtime_resolver.py',
              'runtime_environment_guard.py',
              'runtime_streaming.py',
              'session_continuity_runtime_resolver.py',
          ]
          replacements = {}
          for name in runtime_names:
              source = agent / 'application/use_cases' / name
              if not source.exists():
                  continue
              target = runtime / name
              shutil.move(str(source), str(target))
              module = name[:-3]
              replacements[
                  f'modules.agent.application.use_cases.{module}'
              ] = f'modules.agent.composition.runtime.{module}'

          worker_runtime = agent / 'composition/worker_runtime'
          worker_runtime.mkdir(parents=True, exist_ok=True)
          (worker_runtime / '__init__.py').touch()
          for name in ('ask_job_worker.py', 'vector_snapshot_worker.py', 'registry.py'):
              source = agent / 'infra/workers' / name
              if source.exists():
                  shutil.move(str(source), str(worker_runtime / name))
              module = name[:-3]
              replacements[
                  f'modules.agent.infra.workers.{module}'
              ] = f'modules.agent.composition.worker_runtime.{module}'

          for base in (root / 'src', root / 'tests'):
              for path in base.rglob('*.py'):
                  text = path.read_text(encoding='utf-8-sig')
                  updated = text
                  for before, after in replacements.items():
                      updated = updated.replace(before, after)
                  if updated != text:
                      path.write_text(updated, encoding='utf-8')

          # Preserve the stable module entrypoint while routing the registry through composition.
          workers = agent / 'composition/workers.py'
          text = workers.read_text(encoding='utf-8')
          text = text.replace(
              'from modules.agent.infra.workers.registry import',
              'from modules.agent.composition.worker_runtime.registry import',
          )
          workers.write_text(text, encoding='utf-8')
          PY
          python -m compileall -q src/modules/agent
      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          git commit -m 'refactor: move concrete agent runtime orchestration to composition'
          git push origin HEAD:feature/agent-quality-gate
