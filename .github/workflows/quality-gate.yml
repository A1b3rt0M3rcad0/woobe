name: Quality Gate

on:
  pull_request:
    branches:
      - development
      - master
    paths:
      - "packages/woobe-core/**"
      - "packages/woobe-api/**"
      - "packages/woobe-workers/**"
      - "tooling/quality-gate/**"
      - "tests/quality_gate/**"
      - "tests/architecture/**"
      - "pyproject.toml"
      - "pytest.ini"
      - "uv.lock"
      - ".github/workflows/quality-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  agent-architecture:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Install development dependencies
        run: uv sync --frozen --all-groups --extra test
      - name: Quality gate self-tests
        run: uv run pytest -q tests/quality_gate
      - name: Runtime architecture gates
        run: >-
          uv run pytest -q
          tests/architecture/test_chat_surface_runtime_boundary.py
          tests/architecture/test_context_assembler_boundary.py
          tests/architecture/test_execution_strategy_boundary.py
          tests/architecture/execution_strategy/test_strategy_import_quality_gate.py
          tests/architecture/test_runtime_client_boundary.py
          tests/architecture/test_runtime_observer_boundary.py
          tests/architecture/test_runtime_process_composition_packaging.py
      - name: Agent architecture policy
        run: >-
          PYTHONPATH=tooling/quality-gate/src
          uv run python -m quality_gate.architecture.checker
          --policy-dir tooling/quality-gate/src/quality_gate/architecture/policies
