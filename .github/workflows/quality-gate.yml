name: Quality Gate

on:
  pull_request:
    branches:
      - development
      - master
    paths:
      - "packages/woobe-core/**"
      - "packages/woobe-api/**"
      - "packages/woobe-workers/**"
      - "tooling/quality-gate/**"
      - "tests/quality_gate/**"
      - "tests/architecture/**"
      - "pyproject.toml"
      - "pytest.ini"
      - "uv.lock"
      - ".github/workflows/quality-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  agent-architecture:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
      - name: Install development dependencies
        run: uv sync --frozen --all-groups --extra test
      - name: Quality gate self-tests
        run: uv run pytest -q tests/quality_gate
      - name: Repository architecture gates
        run: uv run pytest -q tests/architecture
      - name: Agent architecture policy
        run: >-
          PYTHONPATH=tooling/quality-gate/src
          uv run python -m quality_gate.architecture.checker
          --policy-dir tooling/quality-gate/src/quality_gate/architecture/policies
