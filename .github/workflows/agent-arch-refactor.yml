name: Agent architecture cleanup

on:
  push:
    branches:
      - feature/agent-quality-gate

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/agent-quality-gate
          fetch-depth: 0
      - name: Normalize pure shared contracts and Agent imports
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import shutil

          root = Path('.')
          src = root / 'src'
          agent = src / 'modules/agent'

          shared_domain = src / 'shared/domain'
          shared_app = src / 'shared/application'
          shared_domain.mkdir(parents=True, exist_ok=True)
          shared_app.mkdir(parents=True, exist_ok=True)
          (shared_domain / '__init__.py').touch()
          (shared_app / '__init__.py').touch()

          copies = {
              src / 'shared/infra/errors.py': shared_domain / 'errors.py',
              src / 'shared/infra/objects.py': shared_app / 'pagination.py',
              src / 'shared/infra/time.py': shared_app / 'time.py',
              src / 'shared/infra/llm_cost.py': shared_app / 'llm_cost.py',
              src / 'shared/infra/llm_usage.py': shared_app / 'llm_usage.py',
              src / 'shared/messaging/outbox_writer.py': agent / 'application/interfaces/outbox.py',
          }
          for source, target in copies.items():
              if not target.exists():
                  shutil.copyfile(source, target)

          replacements = {
              'shared.infra.errors': 'shared.domain.errors',
              'shared.infra.objects': 'shared.application.pagination',
              'shared.infra.time': 'shared.application.time',
              'shared.infra.llm_cost': 'shared.application.llm_cost',
              'shared.infra.llm_usage': 'shared.application.llm_usage',
              'shared.messaging.outbox_writer': 'modules.agent.application.interfaces.outbox',
          }
          for path in agent.rglob('*.py'):
              text = path.read_text(encoding='utf-8-sig')
              updated = text
              for before, after in replacements.items():
                  updated = updated.replace(before, after)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          llm_factory = agent / 'infra/adapters/langchain_llm_factory.py'
          text = llm_factory.read_text(encoding='utf-8')
          text = text.replace('import importlib\n\n', '')
          text = text.replace(
              'from modules.agent.application.interfaces.llm_factory import LLMFactory\n',
              'from modules.agent.application.interfaces.llm_factory import LLMFactory\n'
              'from modules.agent.infra.llm.langchain_factory import create_chat_model\n',
          )
          text = text.replace(
              '        langchain_mod = importlib.import_module("modules.agent.infra.llm.langchain_factory")\n'
              '        return langchain_mod.create_chat_model(\n',
              '        return create_chat_model(\n',
          )
          llm_factory.write_text(text, encoding='utf-8')

          policy = root / 'quality_gate/architecture/policies/agent.toml'
          text = policy.read_text(encoding='utf-8')
          text = text.replace(
              '  "modules.agent.domain",\n  "modules.agent.application",\n  "modules.agent.infra",\n',
              '  "modules.agent.domain",\n  "modules.agent.application",\n  "modules.agent.infra",\n',
          )
          # Composition must be allowed to call sibling composers.
          marker = 'source = ["composition/**"]\nallow = [\n'
          text = text.replace(marker, marker + '  "modules.agent.composition",\n', 1)
          # Pure shared contracts/utilities are valid inward dependencies.
          app_marker = 'id = "ARCH003"\ndescription = "application owns its ports and may depend only on application and domain code"\nsource = ["application/**"]\nallow = [\n  "modules.agent.application",\n  "modules.agent.domain",\n'
          text = text.replace(
              app_marker,
              app_marker + '  "shared.domain",\n  "shared.application",\n  "shared.security.redaction",\n',
              1,
          )
          controller_marker = 'source = ["presentation/controllers/**"]\nallow = [\n'
          text = text.replace(
              controller_marker,
              controller_marker + '  "shared.domain",\n  "shared.security.principal",\n',
              1,
          )
          presentation_marker = 'id = "ARCH010"\ndescription = "presentation support code may use domain values, presentation primitives and application contracts only"\nsource = ["presentation/**"]\nallow = [\n'
          text = text.replace(
              presentation_marker,
              presentation_marker + '  "shared.domain",\n  "shared.security.principal",\n',
              1,
          )
          domain_marker = 'id = "ARCH002"\ndescription = "domain must remain independent from outer layers and technical shared packages"\nsource = ["domain/**"]\nallow = [\n  "modules.agent.domain",\n'
          text = text.replace(domain_marker, domain_marker + '  "shared.domain",\n', 1)
          # Do not blanket-deny shared after explicitly allowing shared.domain.
          text = text.replace('  "shared",\n  "sqlalchemy",', '  "shared.infra",\n  "shared.messaging",\n  "shared.presentation",\n  "shared.workers",\n  "sqlalchemy",', 1)
          policy.write_text(text, encoding='utf-8')
          PY
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No cleanup changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src quality_gate
          git commit -m 'refactor: isolate agent from shared infrastructure contracts'
          git push origin HEAD:feature/agent-quality-gate
