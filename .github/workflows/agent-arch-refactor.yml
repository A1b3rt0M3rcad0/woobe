name: Agent architecture migration

on:
  push:
    branches:
      - feature/agent-quality-gate

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/agent-quality-gate
          fetch-depth: 0
      - name: Apply mechanical architecture moves
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import shutil

          root = Path('.')
          agent = root / 'src/modules/agent'

          interfaces = agent / 'application/interfaces'
          interfaces.mkdir(parents=True, exist_ok=True)
          init = interfaces / '__init__.py'
          if not init.exists():
              init.write_text('', encoding='utf-8')

          old_ports = agent / 'domain/ports'
          if old_ports.exists():
              for source in old_ports.iterdir():
                  if source.is_file():
                      shutil.move(str(source), str(interfaces / source.name))
              old_ports.rmdir()

          old_repositories = agent / 'domain/repositories.py'
          if old_repositories.exists():
              shutil.move(str(old_repositories), str(interfaces / 'repositories.py'))

          old_application_ports = agent / 'application/ports.py'
          if old_application_ports.exists():
              shutil.move(str(old_application_ports), str(interfaces / 'ports.py'))

          replacements = {
              'modules.agent.application.composers': 'modules.agent.composition.composers',
              'modules.agent.domain.ports.': 'modules.agent.application.interfaces.',
              'modules.agent.domain.repositories': 'modules.agent.application.interfaces.repositories',
              'modules.agent.application.ports': 'modules.agent.application.interfaces.ports',
          }

          suffixes = {'.py', '.pyi'}
          for base in (root / 'src', root / 'tests'):
              if not base.exists():
                  continue
              for path in base.rglob('*'):
                  if not path.is_file() or path.suffix not in suffixes:
                      continue
                  text = path.read_text(encoding='utf-8')
                  updated = text
                  for before, after in replacements.items():
                      updated = updated.replace(before, after)
                  if updated != text:
                      path.write_text(updated, encoding='utf-8')

          package_init = agent / '__init__.py'
          package_init.write_text(
              'from modules.agent.composition.workers import AgentWorkerRegistry, register_agent_workers\n\n'
              '__all__ = ["AgentWorkerRegistry", "register_agent_workers"]\n',
              encoding='utf-8',
          )
          PY
      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No migration changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          git commit -m 'refactor: align agent composition and application interfaces'
          git push origin HEAD:feature/agent-quality-gate
