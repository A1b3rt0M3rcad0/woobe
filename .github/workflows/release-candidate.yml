name: Release candidate images
run-name: Release candidate ${{ inputs.expected_version }} @ ${{ inputs.ref }} / ${{ inputs.orchestration_id }}

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      expected_version:
        required: true
        type: string
      orchestration_id:
        required: true
        type: string
    outputs:
      validation_id:
        description: Immutable validation identity for this candidate pass.
        value: ${{ jobs.manifest.outputs.validation_id }}
      api_digest:
        value: ${{ jobs.manifest.outputs.api_digest }}
      workers_digest:
        value: ${{ jobs.manifest.outputs.workers_digest }}
      frontend_digest:
        value: ${{ jobs.manifest.outputs.frontend_digest }}
      embed_digest:
        value: ${{ jobs.manifest.outputs.embed_digest }}
  workflow_dispatch:
    inputs:
      ref:
        description: Exact commit SHA to build.
        required: true
        type: string
      expected_version:
        description: Canonical VERSION expected at ref.
        required: true
        type: string
      orchestration_id:
        description: Correlation identity for a manual/recovery validation.
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: release-candidate-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
      owner: ${{ steps.meta.outputs.owner }}
      revision: ${{ steps.meta.outputs.revision }}
      candidate_tag: ${{ steps.meta.outputs.candidate_tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Validate exact candidate identity
        id: meta
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          EXPECTED_REVISION: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          test "$version" = "$EXPECTED_VERSION"
          python scripts/ci/check_package_versions.py

          revision="$(git rev-parse HEAD)"
          test "$revision" = "$EXPECTED_REVISION"
          owner="${GITHUB_REPOSITORY_OWNER,,}"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "candidate_tag=sha-$revision" >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - unit: api
            image: woobe-api
            dockerfile: Dockerfile
            target: api
          - unit: workers
            image: woobe-workers
            dockerfile: Dockerfile
            target: workers
          - unit: frontend
            image: woobe-frontend
            dockerfile: packages/woobe-frontend/Dockerfile
            target: runtime
          - unit: embed
            image: woobe-embed
            dockerfile: packages/woobe-embed/Dockerfile
            target: runtime
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref }}

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Probe immutable candidate
        id: candidate
        shell: bash
        env:
          REF: ghcr.io/${{ needs.metadata.outputs.owner }}/${{ matrix.image }}:${{ needs.metadata.outputs.candidate_tag }}
        run: |
          set -euo pipefail

          probe_candidate() {
            local ref="$1"
            local output=""
            local delay=2

            for attempt in 1 2 3 4 5; do
              if output="$(docker buildx imagetools inspect "$ref" 2>&1)"; then
                echo "exists"
                return 0
              fi

              if grep -Eqi '(manifest unknown|no such manifest|not found)' <<<"$output"; then
                echo "missing"
                return 0
              fi

              echo "::warning::Candidate lookup failed for $ref (attempt $attempt/5): $output" >&2
              if [[ "$attempt" != 5 ]]; then
                sleep "$delay"
                delay=$((delay * 2))
              fi
            done

            echo "::error::Unable to determine whether immutable candidate exists: $ref" >&2
            return 1
          }

          state="$(probe_candidate "$REF")"
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "Candidate state for $REF: $state"

      - name: Build and push immutable candidate
        if: ${{ steps.candidate.outputs.state == 'missing' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/${{ needs.metadata.outputs.owner }}/${{ matrix.image }}:${{ needs.metadata.outputs.candidate_tag }}
          labels: |
            org.opencontainers.image.version=${{ needs.metadata.outputs.version }}
            org.opencontainers.image.revision=${{ needs.metadata.outputs.revision }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=release-candidate-${{ matrix.unit }}
          cache-to: type=gha,mode=max,scope=release-candidate-${{ matrix.unit }}

      - name: Verify immutable candidate identity
        shell: bash
        run: |
          set -euo pipefail
          ref="ghcr.io/${{ needs.metadata.outputs.owner }}/${{ matrix.image }}:${{ needs.metadata.outputs.candidate_tag }}"
          docker pull --platform linux/amd64 "$ref"
          revision="$(docker image inspect "$ref" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          version="$(docker image inspect "$ref" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
          test "$revision" = "${{ needs.metadata.outputs.revision }}"
          test "$version" = "${{ needs.metadata.outputs.version }}"

  verify-platforms:
    needs: [metadata, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Require amd64 and arm64 manifests
        shell: bash
        run: |
          set -euo pipefail

          inspect_with_retry() {
            local ref="$1"
            local output=""
            local delay=2
            for attempt in 1 2 3 4 5; do
              if output="$(docker buildx imagetools inspect "$ref" 2>&1)"; then
                printf '%s\n' "$output"
                return 0
              fi
              echo "::warning::Unable to inspect $ref (attempt $attempt/5): $output" >&2
              if [[ "$attempt" != 5 ]]; then
                sleep "$delay"
                delay=$((delay * 2))
              fi
            done
            echo "::error::Unable to inspect candidate manifest after retries: $ref" >&2
            return 1
          }

          for unit in api workers frontend embed; do
            image="ghcr.io/${{ needs.metadata.outputs.owner }}/woobe-${unit}:${{ needs.metadata.outputs.candidate_tag }}"
            manifest="$(inspect_with_retry "$image")"
            printf '%s\n' "$manifest"
            grep -q 'linux/amd64' <<<"$manifest"
            grep -q 'linux/arm64' <<<"$manifest"
          done

  smoke:
    needs: [metadata, build, verify-platforms]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: woobe-candidate-${{ github.run_id }}-${{ github.run_attempt }}
      WOOBE_API_IMAGE: ghcr.io/${{ needs.metadata.outputs.owner }}/woobe-api:${{ needs.metadata.outputs.candidate_tag }}
      WOOBE_WORKERS_IMAGE: ghcr.io/${{ needs.metadata.outputs.owner }}/woobe-workers:${{ needs.metadata.outputs.candidate_tag }}
      WOOBE_FRONTEND_IMAGE: ghcr.io/${{ needs.metadata.outputs.owner }}/woobe-frontend:${{ needs.metadata.outputs.candidate_tag }}
      WOOBE_EMBED_IMAGE: ghcr.io/${{ needs.metadata.outputs.owner }}/woobe-embed:${{ needs.metadata.outputs.candidate_tag }}
      WOOBE_API_BASE_URL: http://127.0.0.1:8000
      WOOBE_WEB_BASE_URL: http://127.0.0.1:8080
      WOOBE_CHAT_EMBED_BASE_URL: http://127.0.0.1:8081
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull exact candidate images
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$WOOBE_API_IMAGE"
          docker pull "$WOOBE_WORKERS_IMAGE"
          docker pull "$WOOBE_FRONTEND_IMAGE"
          docker pull "$WOOBE_EMBED_IMAGE"

      - name: Generate production-shaped environment
        run: |
          python scripts/generate_self_host_env.py --force
          python - <<'PY'
          from pathlib import Path

          path = Path(".env")
          values = {
              "WOOBE_ENVIRONMENT": "production",
              "WOOBE_ACCESS_COOKIE_SECURE": "true",
              "WOOBE_REFRESH_COOKIE_SECURE": "true",
              "WOOBE_CORS_ORIGINS": "https://app.example.test,https://chat.example.test",
              "WOOBE_TRUSTED_HOSTS": "localhost,127.0.0.1",
          }
          lines = path.read_text().splitlines()
          for key, value in values.items():
              prefix = f"{key}="
              for index, line in enumerate(lines):
                  if line.startswith(prefix):
                      lines[index] = f"{key}={value}"
                      break
              else:
                  lines.append(f"{key}={value}")
          path.write_text("\n".join(lines) + "\n")
          PY

      - name: Smoke exact candidate images
        run: bash scripts/ci/smoke_prebuilt_core_images.sh

      - name: Capture candidate diagnostics
        if: failure()
        run: |
          docker compose -f compose.yaml -f docker/ci/compose.release-images.yml ps --all || true
          docker compose -f compose.yaml -f docker/ci/compose.release-images.yml logs --no-color || true

      - name: Tear down
        if: always()
        run: docker compose -f compose.yaml -f docker/ci/compose.release-images.yml down -v --remove-orphans || true

  manifest:
    needs: [metadata, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      validation_id: ${{ steps.identity.outputs.validation_id }}
      api_digest: ${{ steps.digests.outputs.api_digest }}
      workers_digest: ${{ steps.digests.outputs.workers_digest }}
      frontend_digest: ${{ steps.digests.outputs.frontend_digest }}
      embed_digest: ${{ steps.digests.outputs.embed_digest }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve exact validated digests
        id: digests
        shell: bash
        env:
          OWNER: ${{ needs.metadata.outputs.owner }}
          CANDIDATE_TAG: ${{ needs.metadata.outputs.candidate_tag }}
        run: |
          set -euo pipefail

          digest_with_retry() {
            local ref="$1"
            local output=""
            local digest=""
            local delay=2
            for attempt in 1 2 3 4 5; do
              if output="$(docker buildx imagetools inspect "$ref" 2>&1)"; then
                digest="$(awk '$1 == "Digest:" { print $2; exit }' <<<"$output")"
                if [[ -n "$digest" ]]; then
                  printf '%s\n' "$digest"
                  return 0
                fi
                output="manifest returned without a digest"
              fi
              echo "::warning::Unable to resolve digest for $ref (attempt $attempt/5): $output" >&2
              if [[ "$attempt" != 5 ]]; then
                sleep "$delay"
                delay=$((delay * 2))
              fi
            done
            echo "::error::Unable to resolve validated candidate digest: $ref" >&2
            return 1
          }

          for unit in api workers frontend embed; do
            ref="ghcr.io/$OWNER/woobe-$unit:$CANDIDATE_TAG"
            digest="$(digest_with_retry "$ref")"
            echo "${unit}_digest=$digest" >> "$GITHUB_OUTPUT"
            echo "$unit: $digest"
          done

      - name: Record validation identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          validation_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}:${{ inputs.orchestration_id }}"
          echo "validation_id=$validation_id" >> "$GITHUB_OUTPUT"
          {
            echo "### Validated release candidate"
            echo
            printf 'Version: `%s`\n' "${{ needs.metadata.outputs.version }}"
            printf 'Revision: `%s`\n' "${{ needs.metadata.outputs.revision }}"
            printf 'Validation: `%s`\n' "$validation_id"
            printf 'API: `%s`\n' "${{ steps.digests.outputs.api_digest }}"
            printf 'Workers: `%s`\n' "${{ steps.digests.outputs.workers_digest }}"
            printf 'Frontend: `%s`\n' "${{ steps.digests.outputs.frontend_digest }}"
            printf 'Embed: `%s`\n' "${{ steps.digests.outputs.embed_digest }}"
          } >> "$GITHUB_STEP_SUMMARY"
