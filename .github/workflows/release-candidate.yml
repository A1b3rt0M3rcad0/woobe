name: Release candidate images

on:
  push:
    branches: [master]
    paths:
      - VERSION
  workflow_dispatch:
    inputs:
      ref:
        description: Optional branch, tag or commit to build. Defaults to the selected workflow ref.
        required: false
        type: string
      expected_version:
        description: Optional canonical VERSION expected at ref
        required: false
        type: string
      finalize_release:
        description: Finalize the validated candidate into a release
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: release-candidate-${{ inputs.ref || github.sha }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.detect.outputs.should_build }}
      source_ref: ${{ steps.detect.outputs.source_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 2

      - name: Detect platform release transition
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail

          source_ref="${REQUESTED_REF:-${GITHUB_SHA}}"
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e HEAD^:VERSION 2>/dev/null; then
            echo "Canonical VERSION was just introduced; skipping bootstrap candidate build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous="$(git show HEAD^:VERSION | tr -d '[:space:]')"
          current="$(tr -d '[:space:]' < VERSION)"

          if [[ "$current" != "$previous" ]]; then
            echo "Platform version transition: $previous -> $current"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION did not change."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  metadata:
    needs: detect
    if: ${{ needs.detect.outputs.should_build == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      owner: ${{ steps.meta.outputs.owner }}
      revision: ${{ steps.meta.outputs.revision }}
      candidate_tag: ${{ steps.meta.outputs.candidate_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect.outputs.source_ref }}
          fetch-depth: 0

      - name: Validate canonical release state
        id: meta
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ -n "$EXPECTED_VERSION" ]]; then
            test "$version" = "$EXPECTED_VERSION"
          fi
          python scripts/ci/check_package_versions.py

          revision="$(git rev-parse HEAD)"
          owner="${GITHUB_REPOSITORY_OWNER,,}"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "candidate_tag=sha-$revision" >> "$GITHUB_OUTPUT"

  build:
    needs: [detect, metadata]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - unit: api
            image: woobe-api
            dockerfile: Dockerfile
            target: api
          - unit: workers
            image: woobe-workers
            dockerfile: Dockerfile
            target: workers
          - unit: frontend
            image: woobe-frontend
            dockerfile: packages/woobe-frontend/Dockerfile
            target: runtime
          - unit: embed
            image: woobe-embed
            dockerfile: packages/woobe-embed/Dockerfile
            target: runtime
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect.outputs.source_ref }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check immutable candidate existence
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          ref="ghcr.io/${{ needs.metadata.outputs.owner }}/${{ matrix.image }}:${{ needs.metadata.outputs.candidate_tag }}"
          if docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push immutable candidate
        if: ${{ steps.candidate.outputs.exists != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/${{ needs.metadata.outputs.owner }}/${{ matrix.image }}:${{ needs.metadata.outputs.candidate_tag }}
          labels: |
            org.opencontainers.image.version=${{ needs.metadata.outputs.version }}
            org.opencontainers.image.revision=${{ needs.metadata.outputs.revision }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=release-candidate-${{ matrix.unit }}
          cache-to: type=gha,mode=max,scope=release-candidate-${{ matrix.unit }}

      - name: Verify immutable candidate identity
        shell: bash
        run: |
          set -euo pipefail
          ref="ghcr.io/${{ needs.metadata.outputs.owner }}/${{ matrix.image }}:${{ needs.metadata.outputs.candidate_tag }}"
          docker pull --platform linux/amd64 "$ref"
          revision="$(docker image inspect "$ref" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          version="$(docker image inspect "$ref" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
          test "$revision" = "${{ needs.metadata.outputs.revision }}"
          test "$version" = "${{ needs.metadata.outputs.version }}"

  verify-platforms:
    needs: [metadata, build]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Require amd64 and arm64 manifests
        shell: bash
        run: |
          set -euo pipefail
          for unit in api workers frontend embed; do
            image="ghcr.io/${{ needs.metadata.outputs.owner }}/woobe-${unit}:${{ needs.metadata.outputs.candidate_tag }}"
            manifest="$(docker buildx imagetools inspect "$image")"
            printf '%s\n' "$manifest"
            grep -q 'linux/amd64' <<<"$manifest"
            grep -q 'linux/arm64' <<<"$manifest"
          done

  smoke:
    needs: [detect, metadata, build, verify-platforms]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: woobe-candidate-${{ github.run_id }}
      WOOBE_API_IMAGE: ghcr.io/${{ needs.metadata.outputs.owner }}/woobe-api:${{ needs.metadata.outputs.candidate_tag }}
      WOOBE_WORKERS_IMAGE: ghcr.io/${{ needs.metadata.outputs.owner }}/woobe-workers:${{ needs.metadata.outputs.candidate_tag }}
      WOOBE_FRONTEND_IMAGE: ghcr.io/${{ needs.metadata.outputs.owner }}/woobe-frontend:${{ needs.metadata.outputs.candidate_tag }}
      WOOBE_EMBED_IMAGE: ghcr.io/${{ needs.metadata.outputs.owner }}/woobe-embed:${{ needs.metadata.outputs.candidate_tag }}
      WOOBE_API_BASE_URL: http://127.0.0.1:8000
      WOOBE_WEB_BASE_URL: http://127.0.0.1:8080
      WOOBE_CHAT_EMBED_BASE_URL: http://127.0.0.1:8081
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect.outputs.source_ref }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull exact candidate images
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$WOOBE_API_IMAGE"
          docker pull "$WOOBE_WORKERS_IMAGE"
          docker pull "$WOOBE_FRONTEND_IMAGE"
          docker pull "$WOOBE_EMBED_IMAGE"

      - name: Generate production-shaped environment
        run: |
          python scripts/generate_self_host_env.py --force
          python - <<'PY'
          from pathlib import Path

          path = Path(".env")
          values = {
              "WOOBE_ENVIRONMENT": "production",
              "WOOBE_ACCESS_COOKIE_SECURE": "true",
              "WOOBE_REFRESH_COOKIE_SECURE": "true",
              "WOOBE_CORS_ORIGINS": "https://app.example.test,https://chat.example.test",
              "WOOBE_TRUSTED_HOSTS": "localhost,127.0.0.1",
          }
          lines = path.read_text().splitlines()
          for key, value in values.items():
              prefix = f"{key}="
              for index, line in enumerate(lines):
                  if line.startswith(prefix):
                      lines[index] = f"{key}={value}"
                      break
              else:
                  lines.append(f"{key}={value}")
          path.write_text("\n".join(lines) + "\n")
          PY

      - name: Smoke exact candidate images
        run: bash scripts/ci/smoke_prebuilt_core_images.sh

      - name: Capture candidate diagnostics
        if: failure()
        run: |
          docker compose -f compose.yaml -f docker/ci/compose.release-images.yml ps --all || true
          docker compose -f compose.yaml -f docker/ci/compose.release-images.yml logs --no-color || true

      - name: Tear down
        if: always()
        run: docker compose -f compose.yaml -f docker/ci/compose.release-images.yml down -v --remove-orphans || true


  finalize-release:
    needs: [detect, metadata, smoke]
    if: ${{ needs.detect.outputs.should_build == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.finalize_release == true)) }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect.outputs.source_ref }}
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preflight immutable version tags
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          REVISION: ${{ needs.metadata.outputs.revision }}
          OWNER: ${{ needs.metadata.outputs.owner }}
        run: |
          set -euo pipefail

          digest_of() {
            docker buildx imagetools inspect "$1" | awk '$1 == "Digest:" { print $2; exit }'
          }

          candidate_tag="sha-$REVISION"
          for unit in api workers frontend embed; do
            repository="ghcr.io/$OWNER/woobe-$unit"
            candidate_ref="$repository:$candidate_tag"
            version_ref="$repository:$VERSION"
            candidate_digest="$(digest_of "$candidate_ref")"
            test -n "$candidate_digest"

            if docker buildx imagetools inspect "$version_ref" >/dev/null 2>&1; then
              version_digest="$(digest_of "$version_ref")"
              if [[ "$version_digest" != "$candidate_digest" ]]; then
                echo "Version $VERSION is already occupied by a different immutable GHCR artifact: $version_ref" >&2
                echo "existing=$version_digest candidate=$candidate_digest" >&2
                exit 1
              fi
              echo "$unit: existing version tag already matches the validated candidate."
            fi
          done

      - name: Create immutable release tag
        id: tag
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          REVISION: ${{ needs.metadata.outputs.revision }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          git fetch --force --tags origin

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
            tagged_revision="$(git rev-parse "$tag^{commit}")"
            test "$tagged_revision" = "$REVISION"
            echo "Tag $tag already exists on the validated release commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" "$REVISION" -m "Woobe $tag"
            git push origin "refs/tags/$tag"
          fi

          echo "name=$tag" >> "$GITHUB_OUTPUT"

      - name: Dispatch exact release publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$TAG"

      - name: Finalization summary
        run: |
          {
            echo "### Release candidate validated"
            echo
            echo "Version: `${{ needs.metadata.outputs.version }}`"
            echo "Revision: `${{ needs.metadata.outputs.revision }}`"
            echo "Tag: `${{ steps.tag.outputs.name }}`"
            echo
            echo "Exact release publication was dispatched automatically."
          } >> "$GITHUB_STEP_SUMMARY"
