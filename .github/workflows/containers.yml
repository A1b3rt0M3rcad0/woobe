name: Community containers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  community-containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Generate isolated Community manifest
        run: python scripts/generate_self_host_env.py --force
      - name: Validate Community Compose
        run: docker compose -f docker-compose.community.yml config --quiet
      - name: Build backend
        run: docker build --tag woobe-api:ci .
      - name: Build frontend
        run: >-
          docker build
          --build-arg VITE_API_URL=http://127.0.0.1:8000
          --build-arg VITE_CHAT_EMBED_URL=http://127.0.0.1:8081
          --build-arg VITE_WOOBE_EDITION=community
          --tag woobe-web:ci web
      - name: Build ChatSurface embed
        run: docker build --tag woobe-chat-embed:ci embed
      - name: Require non-root application images
        run: |
          set -euo pipefail
          for image in woobe-api:ci woobe-web:ci woobe-chat-embed:ci; do
            configured_user="$(docker image inspect "$image" --format '{{.Config.User}}')"
            test -n "$configured_user"
            test "$configured_user" != "0"
            test "$configured_user" != "root"
            docker run --rm --entrypoint sh "$image" -c 'test "$(id -u)" -ne 0'
          done
