name: Containers

on:
  pull_request:
    branches:
      - development-mvp
      - development
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: containers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare deployment manifest
        run: cp .env.example .env
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build backend image
        run: docker build --tag projectrai-api:ci .
      - name: Build frontend image
        shell: bash
        run: |
          set -euo pipefail
          VITE_API_URL="$(sed -n 's/^VITE_API_URL=//p' .env)"
          docker build --build-arg "VITE_API_URL=$VITE_API_URL" --tag projectrai-web:ci web
  smoke:
    name: smoke
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare isolated environment
        run: cp .env.example .env
      - name: Start essential services
        run: docker compose up --detach --build api workers
      - name: Wait for API readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/ready; then
              exit 0
            fi
            sleep 2
          done
          echo "API did not become ready" >&2
          docker compose ps
          exit 1
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop services
        if: always()
        run: docker compose down --volumes --remove-orphans
