name: Container quality

on:
  pull_request:
    branches: [development, master]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  containers:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Docker access
        run: bash scripts/ci/prepare_docker_access.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
      - name: Build standalone Core package
        run: |
          mkdir -p .test-artifacts/core-dist
          uv build packages/woobe-core --out-dir .test-artifacts/core-dist
          test -n "$(find .test-artifacts/core-dist -maxdepth 1 -name 'woobe_core-*.whl' -print -quit)"
      - name: Generate isolated Core environment
        run: python scripts/generate_self_host_env.py --force
      - name: Validate the supported Core Compose contract
        run: docker compose config --quiet
      - name: Build API image
        run: docker build --pull --no-cache --target api --tag woobe-api:ci .
      - name: Build Workers image
        run: docker build --pull --no-cache --target workers --tag woobe-workers:ci .
      - name: Verify API and Workers image isolation
        run: |
          set -euo pipefail
          docker run --rm --entrypoint python woobe-api:ci -c "import importlib.util; import main, woobe_api; assert importlib.util.find_spec('woobe_workers') is None"
          docker run --rm --entrypoint sh woobe-api:ci -c 'test ! -d /app/packages/woobe-workers/src'
          docker run --rm --entrypoint python woobe-workers:ci -c "import importlib.util; import worker_main, woobe_workers; assert importlib.util.find_spec('woobe_api') is None"
          docker run --rm --entrypoint sh woobe-workers:ci -c 'test ! -d /app/packages/woobe-api/src'
      - name: Build Web image
        run: >-
          docker build
          --pull
          --no-cache
          --file packages/woobe-frontend/Dockerfile
          --build-arg VITE_API_URL=http://127.0.0.1:8000
          --build-arg VITE_CHAT_EMBED_URL=http://127.0.0.1:8081
          --build-arg VITE_WOOBE_EDITION=core
          --tag woobe-web:ci .
      - name: Build ChatSurface image
        run: >-
          docker build
          --pull
          --no-cache
          --file packages/woobe-embed/Dockerfile
          --tag woobe-chat-embed:ci .
      - name: Require non-root runtime users
        run: |
          set -euo pipefail
          for image in woobe-api:ci woobe-workers:ci woobe-web:ci woobe-chat-embed:ci; do
            configured_user="$(docker image inspect "$image" --format '{{.Config.User}}')"
            test -n "$configured_user"
            test "$configured_user" != "0"
            test "$configured_user" != "root"
            docker run --rm --entrypoint sh "$image" -c 'test "$(id -u)" -ne 0'
          done
      - name: Require Core image license metadata
        run: |
          set -euo pipefail
          for image in woobe-api:ci woobe-workers:ci woobe-web:ci woobe-chat-embed:ci; do
            license="$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.licenses" }}')"
            test "$license" = "LicenseRef-Woobe-Core-Sustainable-Use-1.0"
          done
      - name: Prepare release evidence directory
        run: mkdir -p .test-artifacts
      - name: Generate API SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: woobe-api:ci
          artifact-name: woobe-api-sbom.spdx.json
          output-file: .test-artifacts/woobe-api-sbom.spdx.json
          format: spdx-json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate Workers SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: woobe-workers:ci
          artifact-name: woobe-workers-sbom.spdx.json
          output-file: .test-artifacts/woobe-workers-sbom.spdx.json
          format: spdx-json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate Web SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: woobe-web:ci
          artifact-name: woobe-web-sbom.spdx.json
          output-file: .test-artifacts/woobe-web-sbom.spdx.json
          format: spdx-json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate ChatSurface SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: woobe-chat-embed:ci
          artifact-name: woobe-chat-embed-sbom.spdx.json
          output-file: .test-artifacts/woobe-chat-embed-sbom.spdx.json
          format: spdx-json
          upload-artifact: false
          upload-release-assets: false
      - name: Render third-party dependency inventory
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          sboms = sorted(Path('.test-artifacts').glob('woobe-*-sbom.spdx.json'))
          rows = set()
          for sbom in sboms:
              payload = json.loads(sbom.read_text(encoding='utf-8'))
              for package in payload.get('packages', []):
                  if not isinstance(package, dict):
                      continue
                  rows.add((
                      sbom.name,
                      str(package.get('name') or 'NOASSERTION'),
                      str(package.get('versionInfo') or 'NOASSERTION'),
                      str(package.get('licenseDeclared') or 'NOASSERTION'),
                      str(package.get('licenseConcluded') or 'NOASSERTION'),
                  ))

          output = Path('.test-artifacts/THIRD_PARTY_INVENTORY.md')
          lines = [
              '# Woobe Core third-party dependency inventory',
              '',
              'Generated from the SPDX SBOMs of the exact Core container artifacts.',
              'This inventory is release evidence and still requires manual review of notice obligations and original license texts.',
              '',
              '| Artifact | Package | Version | Declared license | Concluded license |',
              '| --- | --- | --- | --- | --- |',
          ]
          for row in sorted(rows):
              escaped = [value.replace('|', '\\|').replace('\n', ' ') for value in row]
              lines.append('| ' + ' | '.join(escaped) + ' |')
          lines.append('')
          output.write_text('\n'.join(lines), encoding='utf-8')
          PY
      - name: Upload third-party dependency inventory
        if: ${{ github.event_name == 'workflow_dispatch' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: woobe-third-party-inventory
          path: .test-artifacts/THIRD_PARTY_INVENTORY.md
          if-no-files-found: error
          retention-days: 1
      - name: Reclaim Docker space before vulnerability scans
        run: |
          docker builder prune --all --force || true
          docker image prune --force || true
          rm -rf .cache/trivy

      - name: Scan API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: woobe-api:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan Workers image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: woobe-workers:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan Web image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: woobe-web:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan ChatSurface image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: woobe-chat-embed:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Cleanup Docker access
        if: always()
        run: bash scripts/ci/cleanup_docker_access.sh
