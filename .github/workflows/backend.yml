name: Backend

on:
  pull_request:
    branches:
      - development-mvp
      - development
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: projectrai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d projectrai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      rabbitmq:
        image: rabbitmq:4-management
        env:
          RABBITMQ_DEFAULT_USER: projectrai
          RABBITMQ_DEFAULT_PASS: projectrai
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      PYTHONPATH: src
      PROJECTRAI_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/projectrai
      PROJECTRAI_SECRET_KEY: ci-secret-key-at-least-32-characters
      PROJECTRAI_ENCRYPTION_KEY: ci-encryption-key-at-least-32-characters
      PROJECTRAI_RABBITMQ_URL: amqp://projectrai:projectrai@localhost:5672/
      PROJECTRAI_ENVIRONMENT: test
      PROJECTRAI_DEBUG: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --frozen --all-groups --extra test

      - name: Ruff
        run: uv run ruff check src tests

      - name: Pyright changed production files
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base_sha="${PR_BASE_SHA:-}"
          if [[ -z "$base_sha" ]]; then
            base_sha="$(git rev-parse HEAD^)"
          fi

          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR "$base_sha" HEAD -- src migrations \
              | grep -E '^(src|migrations)/.*\.py$' || true
          )

          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No changed production Python files to type-check." | tee pyright.log
            exit 0
          fi

          printf 'Type-checking changed production files:\n' | tee pyright.log
          printf '  %s\n' "${files[@]}" | tee -a pyright.log
          uv run pyright "${files[@]}" 2>&1 | tee -a pyright.log

      - name: Upload Pyright log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyright-changed-production
          path: pyright.log
          if-no-files-found: warn

      - name: Apply migrations
        shell: bash
        run: |
          set -o pipefail
          uv run alembic upgrade head 2>&1 | tee backend-alembic-upgrade.log

      - name: Upload backend migration log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-alembic-upgrade
          path: backend-alembic-upgrade.log
          if-no-files-found: warn

      - name: Pytest
        shell: bash
        run: |
          set -o pipefail
          uv run python -m pytest -q --junitxml=pytest-report.xml 2>&1 | tee pytest.log

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-stage-05
          path: |
            pytest-report.xml
            pytest.log
          if-no-files-found: warn
