name: Backend quality

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: woobe
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d woobe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      rabbitmq:
        image: rabbitmq:4-management
        env:
          RABBITMQ_DEFAULT_USER: woobe
          RABBITMQ_DEFAULT_PASS: woobe
        ports: [5672:5672]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      PYTHONPATH: src
      WOOBE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/woobe
      WOOBE_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/woobe
      WOOBE_SECRET_KEY: ci-secret-key-at-least-32-characters-woobe
      WOOBE_ENCRYPTION_KEY: ci-encryption-key-at-least-32-characters-woobe
      WOOBE_CHAT_TOKEN_SIGNING_KEY: ci-chat-signing-key-at-least-32-characters-woobe
      WOOBE_RABBITMQ_URL: amqp://woobe:woobe@localhost:5672/
      WOOBE_ENVIRONMENT: test
      WOOBE_DEBUG: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        run: uv sync --frozen --all-groups --extra test
      - name: Ruff
        run: uv run ruff check src tests migrations
      - name: Full Pyright
        run: uv run pyright src migrations
      - name: Validate migrations including one-step rollback
        run: |
          set -euo pipefail
          uv run alembic upgrade head
          uv run alembic current
          uv run alembic check
          uv run alembic downgrade -1
          uv run alembic upgrade head
          uv run alembic check
      - name: Pytest
        run: uv run python -m pytest -q --junitxml=pytest-report.xml
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-quality-evidence
          path: pytest-report.xml
          if-no-files-found: warn
