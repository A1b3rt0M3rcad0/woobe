name: Optional local PageIndex qualification

on:
  pull_request:
    branches: [master]
    paths:
      - 'Dockerfile'
      - 'packages/woobe-core/src/modules/artifacts/**'
      - 'packages/woobe-core/src/shared/infra/vendor/pageindex_flash/**'
      - 'packages/woobe-core/pyproject.toml'
      - 'packages/woobe-core/migrations/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'tests/unit/artifacts/test_pageindex_adapter.py'
      - 'tests/integration/artifacts/test_pageindex_postgres.py'
      - 'tests/fixtures/artifacts/**'
      - 'scripts/ci/check_pageindex_optional.py'
      - 'scripts/ci/artifact_s3_test_server.py'
      - '.github/workflows/artifacts-pageindex.yml'

permissions:
  contents: read

jobs:
  local-adapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: artifact_test
          POSTGRES_PASSWORD: artifact_test
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U artifact_test -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      WOOBE_ENVIRONMENT: test
      WOOBE_RUN_PERSISTENCE_MODE: legacy_finalization
      WOOBE_ARTIFACT_TEST_POSTGRES_URL: postgresql://artifact_test:artifact_test@127.0.0.1:5432/postgres
      WOOBE_ARTIFACT_TEST_S3_CONFIG_FILE: /tmp/woobe-artifact-s3/test-credentials.json
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Generate ephemeral application configuration
        run: |
          python - <<'PY'
          import base64
          import os
          import secrets
          with open(os.environ['GITHUB_ENV'], 'a') as target:
              target.write('WOOBE_SECRET_KEY=' + secrets.token_urlsafe(48) + '\n')
              target.write('WOOBE_ENCRYPTION_KEY=' + base64.urlsafe_b64encode(secrets.token_bytes(32)).decode() + '\n')
          PY
      - name: Verify normal startup without PageIndex-only dependencies
        run: |
          uv sync --frozen --all-groups --extra test --no-install-project
          uv pip install --python .venv/bin/python --no-deps -e packages/woobe-core -e packages/woobe-api -e packages/woobe-workers
          .venv/bin/python scripts/ci/check_pageindex_optional.py
      - name: Install the frozen PageIndex optional profile
        run: uv sync --frozen --all-groups --extra test --extra pageindex-local --no-install-project --inexact
      - name: Start verified private S3-compatible storage
        run: .venv/bin/python scripts/ci/artifact_s3_test_server.py
      - name: Qualify real PageIndex extraction, concurrency, publication and fallback
        run: |
          .venv/bin/python scripts/ci/check_pageindex_optional.py --available
          .venv/bin/python -m pytest -q tests/unit/artifacts/test_pageindex_adapter.py
          .venv/bin/python -m pytest -q tests/integration/artifacts/test_pageindex_postgres.py
      - name: Stop only the owned storage process
        if: always()
        run: |
          if [[ -x .venv/bin/python ]]; then
            .venv/bin/python scripts/ci/artifact_s3_test_server.py --stop
          fi
