name: Release production smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Generate production-shaped local manifest
        run: |
          python scripts/generate_self_host_env.py --force
          python - <<'PY'
          from pathlib import Path
          def set_env(content: str, key: str, value: str) -> str:
              lines = content.splitlines()
              prefix = f'{key}='
              for index, line in enumerate(lines):
                  if line.startswith(prefix):
                      lines[index] = f'{key}={value}'
                      return '\n'.join(lines) + '\n'
              lines.append(f'{key}={value}')
              return '\n'.join(lines) + '\n'
          content = Path('.env').read_text()
          for key, value in {
              'WOOBE_ENVIRONMENT': 'production',
              'WOOBE_ACCESS_COOKIE_SECURE': 'true',
              'WOOBE_REFRESH_COOKIE_SECURE': 'true',
              'WOOBE_CORS_ORIGINS': 'https://app.example.test,https://chat.example.test',
              'WOOBE_TRUSTED_HOSTS': 'localhost,127.0.0.1',
          }.items():
              content = set_env(content, key, value)
          Path('.env').write_text(content)
          PY
      - name: Build and start Community production-shaped topology
        run: |
          set -euo pipefail
          docker compose -f docker-compose.community.yml config --quiet
          docker compose -f docker-compose.community.yml up -d --build db rabbitmq
          docker compose -f docker-compose.community.yml run --rm migrate
          docker compose -f docker-compose.community.yml up -d api workers web chat-embed
          for attempt in $(seq 1 60); do
            if WOOBE_WEB_BASE_URL=http://127.0.0.1:8080 WOOBE_API_BASE_URL=http://127.0.0.1:8000 WOOBE_CHAT_EMBED_BASE_URL=http://127.0.0.1:8081 sh scripts/smoke_production.sh; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.community.yml ps
          docker compose -f docker-compose.community.yml logs --no-color
          exit 1
      - name: Exercise graceful application restart
        run: |
          set -euo pipefail
          docker compose -f docker-compose.community.yml stop --timeout 45 web chat-embed api workers
          docker compose -f docker-compose.community.yml up -d api workers web chat-embed
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/ready >/dev/null && curl --fail --silent http://127.0.0.1:8081/chat/v1/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Capture evidence
        if: always()
        run: |
          docker compose -f docker-compose.community.yml ps --all > production-compose-ps.txt || true
          docker compose -f docker-compose.community.yml logs --no-color > production-compose.log 2>&1 || true
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.community.yml down -v --remove-orphans
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-production-smoke-evidence
          path: |
            production-compose-ps.txt
            production-compose.log
          if-no-files-found: warn
