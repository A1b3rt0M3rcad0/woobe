name: Release production smoke

on:
  pull_request:
    branches: [development-mvp]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-production-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Generate ephemeral production configuration
        run: |
          python - <<'PY'
          from pathlib import Path
          from secrets import token_urlsafe

          database_password = token_urlsafe(24)
          rabbitmq_password = token_urlsafe(24)
          secret_key = token_urlsafe(48)
          encryption_key = token_urlsafe(48)
          content = f"""PROJECTRAI_ENVIRONMENT=production
          PROJECTRAI_DEBUG=false
          PROJECTRAI_JSON_LOGS=true
          PROJECTRAI_METRICS_ENABLED=true
          PROJECTRAI_LOG_LEVEL=INFO
          PROJECTRAI_REQUEST_MAX_BYTES=1048576
          PROJECTRAI_DATABASE_URL=
          PROJECTRAI_RABBITMQ_URL=
          PROJECTRAI_RABBITMQ_EXCHANGE=projectrai.events
          PROJECTRAI_REDIS_URL=
          PROJECTRAI_SECRET_KEY={secret_key}
          PROJECTRAI_ENCRYPTION_KEY={encryption_key}
          PROJECTRAI_ACCESS_COOKIE_SECURE=true
          PROJECTRAI_REFRESH_COOKIE_SECURE=true
          PROJECTRAI_CORS_ORIGINS=https://127.0.0.1:8080
          PROJECTRAI_TRUSTED_HOSTS=127.0.0.1,localhost
          PROJECTRAI_DB_POOL_SIZE=5
          PROJECTRAI_DB_MAX_OVERFLOW=5
          POSTGRES_USER=projectrai
          POSTGRES_PASSWORD={database_password}
          POSTGRES_DB=projectrai
          RABBITMQ_USER=projectrai
          RABBITMQ_PASSWORD={rabbitmq_password}
          PGBOUNCER_POOL_MODE=transaction
          PGBOUNCER_MAX_CLIENT_CONN=200
          PGBOUNCER_DEFAULT_POOL_SIZE=20
          PGBOUNCER_RESERVE_POOL_SIZE=5
          PGBOUNCER_MAX_DB_CONNECTIONS=30
          VITE_API_URL=http://127.0.0.1:8080
          """
          Path(".env").write_text(content)
          PY
      - name: Build production images
        run: docker compose -f docker-compose.prod.yml build
      - name: Start production topology and run smoke
        run: |
          set -euo pipefail
          docker compose -f docker-compose.prod.yml config --quiet
          docker compose -f docker-compose.prod.yml up -d db pgbouncer rabbitmq
          if ! docker compose -f docker-compose.prod.yml run --name projectrai-release-migrate migrate > production-migrate.log 2>&1; then
            cat production-migrate.log
            exit 1
          fi
          docker compose -f docker-compose.prod.yml up -d api workers web
          for attempt in $(seq 1 60); do
            if PROJECTRAI_BASE_URL=http://127.0.0.1:8080 sh scripts/smoke_production.sh; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.prod.yml ps
          docker compose -f docker-compose.prod.yml logs --no-color
          exit 1
      - name: Exercise graceful application rollback
        run: |
          set -euo pipefail
          docker compose -f docker-compose.prod.yml stop --timeout 45 web api workers
          test -z "$(docker compose -f docker-compose.prod.yml ps --status running -q web api workers)"
          docker compose -f docker-compose.prod.yml up -d api workers web
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.prod.yml ps --all
          docker compose -f docker-compose.prod.yml logs --no-color
          exit 1
      - name: Capture production evidence
        if: always()
        run: |
          docker compose -f docker-compose.prod.yml ps --all > production-compose-ps.txt || true
          docker compose -f docker-compose.prod.yml logs --no-color > production-compose.log 2>&1 || true
          docker logs projectrai-release-migrate >> production-migrate.log 2>&1 || true
      - name: Tear down production topology
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v --remove-orphans
      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-production-smoke-evidence
          path: |
            production-migrate.log
            production-compose-ps.txt
            production-compose.log
          if-no-files-found: warn
