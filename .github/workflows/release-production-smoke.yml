name: Release production smoke

on:
  pull_request:
    branches: [development-mvp]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-production-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Generate production-shaped local manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          from secrets import token_urlsafe

          content = Path('.env.example').read_text()
          database_password = token_urlsafe(24)
          rabbitmq_password = token_urlsafe(24)
          object_storage_password = token_urlsafe(24)
          database_user = 'projectrai_smoke'
          rabbitmq_user = 'projectrai_smoke'
          replacements = {
              'PROJECTRAI_ENVIRONMENT=development': 'PROJECTRAI_ENVIRONMENT=production',
              'PROJECTRAI_SECRET_KEY=local-projectrai-signing-key-4v7N2x9Q8m5K1c6Z': f'PROJECTRAI_SECRET_KEY={token_urlsafe(48)}',
              'PROJECTRAI_ENCRYPTION_KEY=local-projectrai-encryption-key-7Q2m9K4x1V8c5Z6N': f'PROJECTRAI_ENCRYPTION_KEY={token_urlsafe(48)}',
              'PROJECTRAI_POSTGRES_URL=postgresql://projectrai:projectrai@db:5432/projectrai': f'PROJECTRAI_POSTGRES_URL=postgresql://{database_user}:{database_password}@db:5432/projectrai',
              'POSTGRES_USER=projectrai': f'POSTGRES_USER={database_user}',
              'POSTGRES_PASSWORD=projectrai': f'POSTGRES_PASSWORD={database_password}',
              'PROJECTRAI_DATABASE_URL=postgresql://projectrai:projectrai@pgbouncer:6432/projectrai': f'PROJECTRAI_DATABASE_URL=postgresql://{database_user}:{database_password}@pgbouncer:6432/projectrai',
              'PROJECTRAI_RABBITMQ_URL=amqp://projectrai:projectrai@rabbitmq:5672/': f'PROJECTRAI_RABBITMQ_URL=amqp://{rabbitmq_user}:{rabbitmq_password}@rabbitmq:5672/',
              'RABBITMQ_USER=projectrai': f'RABBITMQ_USER={rabbitmq_user}',
              'RABBITMQ_PASSWORD=projectrai': f'RABBITMQ_PASSWORD={rabbitmq_password}',
              'AWS_ACCESS_KEY_ID=projectrai': 'AWS_ACCESS_KEY_ID=projectrai_smoke',
              'AWS_SECRET_ACCESS_KEY=local-projectrai-object-storage-key-7Q2m9K4x': f'AWS_SECRET_ACCESS_KEY={object_storage_password}',
              'PROJECTRAI_ACCESS_COOKIE_SECURE=false': 'PROJECTRAI_ACCESS_COOKIE_SECURE=true',
              'PROJECTRAI_REFRESH_COOKIE_SECURE=false': 'PROJECTRAI_REFRESH_COOKIE_SECURE=true',
              'PROJECTRAI_CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173': 'PROJECTRAI_CORS_ORIGINS=https://app.example.test',
              'PROJECTRAI_TRUSTED_HOSTS=localhost,127.0.0.1': 'PROJECTRAI_TRUSTED_HOSTS=127.0.0.1,localhost',
              'VITE_API_URL=http://localhost:8000': 'VITE_API_URL=http://127.0.0.1:8000',
          }
          for old, new in replacements.items():
              if old not in content:
                  raise SystemExit(f'missing expected template value: {old}')
              content = content.replace(old, new)
          Path('.env').write_text(content)
          PY
      - name: Build integration images
        run: docker compose build
      - name: Start production-shaped topology and run smoke
        run: |
          set -euo pipefail
          docker compose config --quiet
          docker compose up -d db pgbouncer rabbitmq redis minio minio-init
          if ! docker compose run --name projectrai-release-migrate migrate > production-migrate.log 2>&1; then
            cat production-migrate.log
            exit 1
          fi
          docker compose up -d api workers web
          for attempt in $(seq 1 60); do
            if PROJECTRAI_WEB_BASE_URL=http://127.0.0.1:5173 \
               PROJECTRAI_API_BASE_URL=http://127.0.0.1:8000 \
               sh scripts/smoke_production.sh; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color
          exit 1
      - name: Exercise graceful application rollback
        run: |
          set -euo pipefail
          docker compose stop --timeout 45 web api workers
          test -z "$(docker compose ps --status running -q web api workers)"
          docker compose up -d api workers web
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps --all
          docker compose logs --no-color
          exit 1
      - name: Capture production evidence
        if: always()
        run: |
          docker compose ps --all > production-compose-ps.txt || true
          docker compose logs --no-color > production-compose.log 2>&1 || true
          docker logs projectrai-release-migrate >> production-migrate.log 2>&1 || true
      - name: Tear down production topology
        if: always()
        run: docker compose down -v --remove-orphans
      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-production-smoke-evidence
          path: |
            production-migrate.log
            production-compose-ps.txt
            production-compose.log
          if-no-files-found: warn
