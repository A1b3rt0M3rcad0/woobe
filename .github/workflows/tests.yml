name: Backend test suite

on:
  pull_request:
    branches: [development, master]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: [self-hosted, Linux, X64]
    # Shared Docker acquisition can wait up to 40 minutes; leave the full
    # test contract its execution budget after acquisition.
    timeout-minutes: 90
    steps:

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Prepare Docker access
        run: bash scripts/ci/prepare_docker_access.sh

      - name: Reset stale validation stack
        run: docker compose -f compose.test.yaml down -v --remove-orphans || true

      - name: Prepare validation artifacts
        run: |
          rm -rf .test-artifacts
          mkdir -p .test-artifacts

      - name: Checkout the reviewed public CLI
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: A1b3rt0M3rcad0/woobe-cli
          ref: bfec295703a7ee29c335f6f16d362c60e158f211
          path: .ci/woobe-cli
          persist-credentials: false

      - name: Prepare CLI toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: .ci/woobe-cli/go.sum

      - name: Build and verify the CLI used by the backend contract
        working-directory: .ci/woobe-cli
        env:
          CGO_ENABLED: '0'
        run: |
          go mod verify
          go build -trimpath -ldflags '-X github.com/A1b3rt0M3rcad0/woobe-cli/internal/cli.Commit=bfec295703a7ee29c335f6f16d362c60e158f211' -o ../../.test-artifacts/woobe ./cmd/woobe
          ../../.test-artifacts/woobe version > ../../.test-artifacts/cli-version.json

      - name: Validate standalone backend test Compose contract
        run: docker compose -f compose.test.yaml config --quiet

      - name: Run the local/CI backend test contract
        env:
          WOOBE_REQUIRE_CLI_E2E: 'true'
          WOOBE_TEST_SERVER_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: docker compose -f compose.test.yaml up --build --exit-code-from tests tests

      - name: Capture Compose diagnostics
        if: failure()
        run: |
          docker compose -f compose.test.yaml ps --all | tee .test-artifacts/compose-ps.txt || true
          docker compose -f compose.test.yaml logs --no-color 2>&1 | tee .test-artifacts/compose.log || true

      - name: Tear down validation stack
        if: always()
        run: timeout 120 docker compose -f compose.test.yaml down -v --remove-orphans || true

      - name: Cleanup Docker access
        if: always()
        run: bash scripts/ci/cleanup_docker_access.sh

      - name: Upload backend test evidence
        if: ${{ always() && vars.WOOBE_UPLOAD_CI_ARTIFACTS == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: woobe-backend-test-evidence-self-hosted
          path: .test-artifacts
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 1
