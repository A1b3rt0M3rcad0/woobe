name: Backend test suite

on:
  pull_request:
    branches: [development]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - name: Refresh and persist uv.lock for runtime dependency changes
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/agent-runtime-transaction-boundaries'
        run: |
          uv lock
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already synchronized"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add uv.lock
            git commit -m "chore(deps): synchronize redis lockfile"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Reset stale validation stack
        run: docker compose -f compose.test.yaml down -v --remove-orphans || true

      - name: Prepare validation artifacts
        run: |
          rm -rf .test-artifacts
          mkdir -p .test-artifacts

      - name: Validate standalone backend test Compose contract
        run: docker compose -f compose.test.yaml config --quiet

      - name: Run the local/CI backend test contract
        run: docker compose -f compose.test.yaml up --build --exit-code-from tests tests

      - name: Capture Compose diagnostics
        if: failure()
        run: |
          docker compose -f compose.test.yaml ps --all | tee .test-artifacts/compose-ps.txt || true
          docker compose -f compose.test.yaml logs --no-color 2>&1 | tee .test-artifacts/compose.log || true

      - name: Tear down validation stack
        if: always()
        run: docker compose -f compose.test.yaml down -v --remove-orphans

      - name: Upload backend test evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: woobe-backend-test-evidence
          path: .test-artifacts
          if-no-files-found: warn
          include-hidden-files: true
