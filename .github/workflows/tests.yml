name: Backend test suite

on:
  pull_request:
    branches: [development, master]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feature/durable-run-event-journal' }}
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v6
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feature/durable-run-event-journal' }}

      - name: Refresh Run journal dependency lock
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feature/durable-run-event-journal' }}
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch origin "$HEAD_REF"
          git checkout -B "$HEAD_REF" "origin/$HEAD_REF"
          uv lock
          git checkout "$BASE_SHA" -- .github/workflows/tests.yml
          if git diff --quiet -- uv.lock .github/workflows/tests.yml; then
            echo "uv.lock is already synchronized"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add uv.lock .github/workflows/tests.yml
            git commit -m "chore(runtime): synchronize uv lock"
            git push origin "HEAD:$HEAD_REF"
          fi

      - name: Prepare Docker access
        run: bash scripts/ci/prepare_docker_access.sh

      - name: Reset stale validation stack
        run: docker compose -f compose.test.yaml down -v --remove-orphans || true

      - name: Prepare validation artifacts
        run: |
          rm -rf .test-artifacts
          mkdir -p .test-artifacts

      - name: Validate standalone backend test Compose contract
        run: docker compose -f compose.test.yaml config --quiet

      - name: Run the local/CI backend test contract
        run: docker compose -f compose.test.yaml up --build --exit-code-from tests tests

      - name: Capture Compose diagnostics
        if: failure()
        run: |
          docker compose -f compose.test.yaml ps --all | tee .test-artifacts/compose-ps.txt || true
          docker compose -f compose.test.yaml logs --no-color 2>&1 | tee .test-artifacts/compose.log || true

      - name: Tear down validation stack
        if: always()
        run: docker compose -f compose.test.yaml down -v --remove-orphans

      - name: Cleanup Docker access
        if: always()
        run: bash scripts/ci/cleanup_docker_access.sh

      - name: Upload backend test evidence
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: woobe-backend-test-evidence
          path: .test-artifacts
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 1
