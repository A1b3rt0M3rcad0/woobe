name: Backend test suite

on:
  pull_request:
    branches: [development]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - name: Apply deterministic runtime CI repair
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/agent-runtime-transaction-boundaries'
        run: python scripts/tmp_ci_repair_runtime.py

      - name: Refresh runtime dependency lock
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/agent-runtime-transaction-boundaries'
        run: uv lock

      - name: Validate repaired architecture before persist
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/agent-runtime-transaction-boundaries'
        run: |
          uv sync --frozen --all-groups --extra test
          uv run pytest -q tests/quality_gate/architecture
          uv run python -m quality_gate.architecture.checker --project-root . --policy-dir quality_gate/architecture/policies

      - name: Persist validated runtime repair
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/agent-runtime-transaction-boundaries'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock \
            src/modules/agent/application/interfaces/agent_run_rerun.py \
            src/modules/agent/presentation/controllers/rerun_agent_run_controller.py \
            src/modules/agent/composition/composers/rerun_agent_run_composer.py \
            src/modules/agent/infra/execution/runtime_preparation.py \
            src/modules/agent/infra/execution/explicit_runtime_persistence.py \
            src/modules/agent/infra/database/runtime_vector_search_reader.py \
            src/modules/agent/composition/factories/ask_agent_runtime_factory.py \
            quality_gate/architecture/policy.py \
            quality_gate/architecture/checker.py \
            quality_gate/architecture/policies/agent.toml \
            tests/quality_gate/architecture/test_strict_composer_contract.py
          if git diff --cached --quiet; then
            echo "Runtime repair already persisted"
          else
            git commit -m "fix(ci): align runtime architecture gates and lockfile"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Reset stale validation stack
        run: docker compose -f compose.test.yaml down -v --remove-orphans || true

      - name: Prepare validation artifacts
        run: |
          rm -rf .test-artifacts
          mkdir -p .test-artifacts

      - name: Validate standalone backend test Compose contract
        run: docker compose -f compose.test.yaml config --quiet

      - name: Run the local/CI backend test contract
        run: docker compose -f compose.test.yaml up --build --exit-code-from tests tests

      - name: Capture Compose diagnostics
        if: failure()
        run: |
          docker compose -f compose.test.yaml ps --all | tee .test-artifacts/compose-ps.txt || true
          docker compose -f compose.test.yaml logs --no-color 2>&1 | tee .test-artifacts/compose.log || true

      - name: Tear down validation stack
        if: always()
        run: docker compose -f compose.test.yaml down -v --remove-orphans

      - name: Upload backend test evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: woobe-backend-test-evidence
          path: .test-artifacts
          if-no-files-found: warn
          include-hidden-files: true
