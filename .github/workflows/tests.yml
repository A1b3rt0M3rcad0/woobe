name: Test suite

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reset stale validation stack
        run: docker compose -f compose.test.yaml down -v --remove-orphans || true

      - name: Prepare validation artifacts
        run: |
          rm -rf .test-artifacts
          mkdir -p .test-artifacts

      - name: Validate standalone test Compose contract
        run: docker compose -f compose.test.yaml config --quiet

      - name: Run reproducible validation stack
        run: docker compose -f compose.test.yaml run --rm tests

      - name: Capture Compose diagnostics
        if: failure()
        run: |
          docker compose -f compose.test.yaml ps --all > .test-artifacts/compose-ps.txt || true
          docker compose -f compose.test.yaml logs --no-color > .test-artifacts/compose.log 2>&1 || true

      - name: Tear down validation stack
        if: always()
        run: docker compose -f compose.test.yaml down -v --remove-orphans

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: woobe-test-evidence
          path: .test-artifacts
          if-no-files-found: warn
