name: Acceptance

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONPATH: packages/woobe-core/src:packages/woobe-api/src:packages/woobe-workers/src:.
      WOOBE_SECRET_KEY: acceptance-secret-key-at-least-32-characters
      WOOBE_ENCRYPTION_KEY: acceptance-encryption-key-at-least-32-characters
      WOOBE_CHAT_TOKEN_SIGNING_KEY: acceptance-chat-key-at-least-32-characters
      WOOBE_ENVIRONMENT: test
      WOOBE_DEBUG: "false"
      WOOBE_RUN_PERSISTENCE_MODE: legacy_finalization
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Prepare Docker access
        run: bash scripts/ci/prepare_docker_access.sh
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Allocate isolated acceptance dependencies
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import os
          import socket

          sockets = []
          ports = []
          for _ in range(2):
              sock = socket.socket()
              sock.bind(("127.0.0.1", 0))
              sockets.append(sock)
              ports.append(sock.getsockname()[1])

          postgres_port, rabbitmq_port = ports
          run_id = os.environ.get("GITHUB_RUN_ID", "local")
          attempt = os.environ.get("GITHUB_RUN_ATTEMPT", "1")
          suffix = f"{run_id}-{attempt}"

          print(f"WOOBE_POSTGRES_PORT={postgres_port}")
          print(f"WOOBE_RABBITMQ_PORT={rabbitmq_port}")
          print(f"WOOBE_POSTGRES_URL=postgresql://postgres:postgres@localhost:{postgres_port}/woobe")
          print(f"WOOBE_DATABASE_URL=postgresql://postgres:postgres@localhost:{postgres_port}/woobe")
          print(f"WOOBE_RESTORE_URL=postgresql://postgres:postgres@localhost:{postgres_port}/woobe_restore")
          print(f"WOOBE_RABBITMQ_URL=amqp://woobe:woobe@localhost:{rabbitmq_port}/")
          print(f"WOOBE_ACCEPTANCE_POSTGRES_CONTAINER=woobe-acceptance-postgres-{suffix}")
          print(f"WOOBE_ACCEPTANCE_RABBITMQ_CONTAINER=woobe-acceptance-rabbitmq-{suffix}")

          for sock in sockets:
              sock.close()
          PY
      - name: Start isolated acceptance dependencies
        run: |
          set -euo pipefail
          docker rm -f "$WOOBE_ACCEPTANCE_POSTGRES_CONTAINER" "$WOOBE_ACCEPTANCE_RABBITMQ_CONTAINER" >/dev/null 2>&1 || true
          docker run -d \
            --name "$WOOBE_ACCEPTANCE_POSTGRES_CONTAINER" \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=woobe \
            -p "127.0.0.1:${WOOBE_POSTGRES_PORT}:5432" \
            -v "${RUNNER_TEMP}:${RUNNER_TEMP}" \
            pgvector/pgvector:pg17 >/dev/null
          docker run -d \
            --name "$WOOBE_ACCEPTANCE_RABBITMQ_CONTAINER" \
            -e RABBITMQ_DEFAULT_USER=woobe \
            -e RABBITMQ_DEFAULT_PASS=woobe \
            -p "127.0.0.1:${WOOBE_RABBITMQ_PORT}:5672" \
            rabbitmq:4-management >/dev/null

          ready=false
          for _ in $(seq 1 60); do
            if docker exec "$WOOBE_ACCEPTANCE_POSTGRES_CONTAINER" pg_isready -U postgres -d woobe >/dev/null 2>&1 \
              && docker exec --user 999:999 "$WOOBE_ACCEPTANCE_RABBITMQ_CONTAINER" rabbitmq-diagnostics -q ping >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != "true" ]]; then
            docker logs "$WOOBE_ACCEPTANCE_POSTGRES_CONTAINER" || true
            docker logs "$WOOBE_ACCEPTANCE_RABBITMQ_CONTAINER" || true
            exit 1
          fi
      - name: Install dependencies and prepare PostgreSQL 17 client
        run: |
          set -euo pipefail
          uv sync --frozen --all-groups --extra test

          pg_client_bin="$RUNNER_TEMP/pg-client-bin"
          mkdir -p "$pg_client_bin"
          cat > "$pg_client_bin/pg-client" <<'SH'
          #!/bin/sh
          set -eu
          : "${WOOBE_ACCEPTANCE_POSTGRES_CONTAINER:?WOOBE_ACCEPTANCE_POSTGRES_CONTAINER is required}"
          tool="$(basename "$0")"
          exec docker exec \
            -e PGPASSWORD \
            "$WOOBE_ACCEPTANCE_POSTGRES_CONTAINER" \
            "$tool" "$@"
          SH
          chmod +x "$pg_client_bin/pg-client"
          for tool in pg_dump pg_restore; do
            ln -sf pg-client "$pg_client_bin/$tool"
          done
          echo "$pg_client_bin" >> "$GITHUB_PATH"
          export PATH="$pg_client_bin:$PATH"
          docker exec "$WOOBE_ACCEPTANCE_POSTGRES_CONTAINER" \
            sh -c "pg_dump --version | grep -Eq ' 17\\.'"
      - name: Migration rollback, legacy Run backfill, and re-upgrade
        run: |
          set -euo pipefail
          uv run alembic -c packages/woobe-core/alembic.ini upgrade head

          # Regression probe: 0068 was already applied on developer databases before
          # runtime-environment External Context values were introduced. The new
          # columns must therefore live in 0069, not in the historical 0068 revision.
          uv run alembic -c packages/woobe-core/alembic.ini downgrade 0068

          context_columns_before="$(
            docker exec -e PGPASSWORD "$WOOBE_ACCEPTANCE_POSTGRES_CONTAINER" \
              psql -U postgres -d woobe -Atv ON_ERROR_STOP=1 -c "
                SELECT count(*)
                FROM information_schema.columns
                WHERE column_name = 'external_context_values'
                  AND (
                    (table_schema = 'agent' AND table_name = 'agent_runtime_environment_states')
                    OR
                    (table_schema = 'network' AND table_name = 'network_runtime_environment_states')
                  );
              "
          )"
          test "$context_columns_before" = "0"

          uv run alembic -c packages/woobe-core/alembic.ini upgrade 0069

          context_columns_after="$(
            docker exec -e PGPASSWORD "$WOOBE_ACCEPTANCE_POSTGRES_CONTAINER" \
              psql -U postgres -d woobe -Atv ON_ERROR_STOP=1 -c "
                SELECT count(*)
                FROM information_schema.columns
                WHERE column_name = 'external_context_values'
                  AND data_type = 'jsonb'
                  AND is_nullable = 'NO'
                  AND column_default LIKE '%{}%jsonb%'
                  AND (
                    (table_schema = 'agent' AND table_name = 'agent_runtime_environment_states')
                    OR
                    (table_schema = 'network' AND table_name = 'network_runtime_environment_states')
                  );
              "
          )"
          printf 'migration 0069 runtime context columns: %s\n' "$context_columns_after"
          test "$context_columns_after" = "2"

          # Also reproduce the transient feature-branch shape where a developer
          # already had the columns while Alembic still reported revision 0068.
          uv run alembic -c packages/woobe-core/alembic.ini downgrade 0068
          docker exec -i -e PGPASSWORD "$WOOBE_ACCEPTANCE_POSTGRES_CONTAINER" \
            psql -U postgres -d woobe -v ON_ERROR_STOP=1 <<'SQL'
          ALTER TABLE agent.agent_runtime_environment_states
            ADD COLUMN external_context_values JSONB NOT NULL DEFAULT '{}'::jsonb;
          ALTER TABLE network.network_runtime_environment_states
            ADD COLUMN external_context_values JSONB NOT NULL DEFAULT '{}'::jsonb;
          SQL
          uv run alembic -c packages/woobe-core/alembic.ini upgrade 0069

          preexisting_context_columns="$(
            docker exec -e PGPASSWORD "$WOOBE_ACCEPTANCE_POSTGRES_CONTAINER" \
              psql -U postgres -d woobe -Atv ON_ERROR_STOP=1 -c "
                SELECT count(*)
                FROM information_schema.columns
                WHERE column_name = 'external_context_values'
                  AND (
                    (table_schema = 'agent' AND table_name = 'agent_runtime_environment_states')
                    OR
                    (table_schema = 'network' AND table_name = 'network_runtime_environment_states')
                  );
              "
          )"
          test "$preexisting_context_columns" = "2"

          # This probe specifically exercises migration 0067. Pin the database to
          # its pre-0067 state instead of assuming 0067 is always the repository head.
          uv run alembic -c packages/woobe-core/alembic.ini downgrade 0066

          docker exec -i -e PGPASSWORD "$WOOBE_ACCEPTANCE_POSTGRES_CONTAINER" \
            psql -U postgres -d woobe -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO identity.workspaces (id, name, slug, status)
          VALUES (
            '67000000-0000-0000-0000-000000000001',
            'migration-0067-probe',
            'migration-0067-probe',
            'active'
          );

          INSERT INTO core.projects (id, workspace_id, name, slug, status, data)
          VALUES (
            '67000000-0000-0000-0000-000000000002',
            '67000000-0000-0000-0000-000000000001',
            'migration-0067-probe',
            'migration-0067-probe',
            'active',
            '{}'::jsonb
          );

          INSERT INTO agent.agents (
            id,
            project_id,
            name,
            description,
            type,
            system_prompt,
            provider,
            model,
            session_mode,
            status,
            settings
          ) VALUES (
            '67000000-0000-0000-0000-000000000003',
            '67000000-0000-0000-0000-000000000002',
            'migration-0067-probe',
            '',
            'assistant',
            '',
            'openai',
            'migration-probe',
            'stateless',
            'active',
            '{}'::jsonb
          );

          INSERT INTO agent.agent_runs (
            id,
            project_id,
            agent_id,
            session_id,
            trace_id,
            environment,
            origin,
            status,
            input_message,
            execution_snapshot
          ) VALUES (
            '67000000-0000-0000-0000-000000000004',
            '67000000-0000-0000-0000-000000000002',
            '67000000-0000-0000-0000-000000000003',
            NULL,
            '67000000-0000-0000-0000-000000000005',
            'draft',
            'playground',
            'running',
            'legacy migration probe',
            '{}'::jsonb
          );
          SQL

          uv run alembic -c packages/woobe-core/alembic.ini upgrade head

          backfill_probe="$(
            docker exec -e PGPASSWORD "$WOOBE_ACCEPTANCE_POSTGRES_CONTAINER" \
              psql -U postgres -d woobe -Atv ON_ERROR_STOP=1 -c "
                SELECT CASE
                  WHEN run.session_id IS NOT NULL
                    AND session.project_id = run.project_id
                    AND session.agent_id = run.agent_id
                    AND session.runtime_environment = run.environment
                    AND session.origin = run.origin
                    AND session.data ->> 'legacy_run_id' = run.id::text
                    AND session.data ->> 'source' = run.origin
                    AND session.data ->> 'legacy_environment' = run.environment
                    AND session.data ->> 'session_backfill' = '0067'
                  THEN 'ok'
                  ELSE 'invalid'
                END
                FROM agent.agent_runs AS run
                JOIN agent.sessions AS session ON session.id = run.session_id
                WHERE run.id = '67000000-0000-0000-0000-000000000004';
              "
          )"
          printf 'migration 0067 backfill probe: %s\n' "$backfill_probe"
          test "$backfill_probe" = "ok"

          session_count="$(
            docker exec -e PGPASSWORD "$WOOBE_ACCEPTANCE_POSTGRES_CONTAINER" \
              psql -U postgres -d woobe -Atv ON_ERROR_STOP=1 -c "
                SELECT count(*)
                FROM agent.sessions
                WHERE data ->> 'legacy_run_id' = '67000000-0000-0000-0000-000000000004';
              "
          )"
          test "$session_count" = "1"

          session_nullable="$(
            docker exec -e PGPASSWORD "$WOOBE_ACCEPTANCE_POSTGRES_CONTAINER" \
              psql -U postgres -d woobe -Atv ON_ERROR_STOP=1 -c "
                SELECT is_nullable
                FROM information_schema.columns
                WHERE table_schema = 'agent'
                  AND table_name = 'agent_runs'
                  AND column_name = 'session_id';
              "
          )"
          test "$session_nullable" = "NO"

          docker exec -i -e PGPASSWORD "$WOOBE_ACCEPTANCE_POSTGRES_CONTAINER" \
            psql -U postgres -d woobe -v ON_ERROR_STOP=1 <<'SQL'
          DELETE FROM agent.agent_runs
          WHERE id = '67000000-0000-0000-0000-000000000004';
          DELETE FROM agent.sessions
          WHERE data ->> 'legacy_run_id' = '67000000-0000-0000-0000-000000000004';
          DELETE FROM agent.agents
          WHERE id = '67000000-0000-0000-0000-000000000003';
          DELETE FROM core.projects
          WHERE id = '67000000-0000-0000-0000-000000000002';
          DELETE FROM identity.workspaces
          WHERE id = '67000000-0000-0000-0000-000000000001';
          SQL

          uv run alembic -c packages/woobe-core/alembic.ini downgrade -1
          uv run alembic -c packages/woobe-core/alembic.ini upgrade head
          uv run alembic -c packages/woobe-core/alembic.ini check
      - name: Backup and restore isolated database
        run: |
          set -euo pipefail
          docker exec -e PGPASSWORD "$WOOBE_ACCEPTANCE_POSTGRES_CONTAINER" \
            psql -U postgres -d woobe -v ON_ERROR_STOP=1 \
            -c "CREATE TABLE IF NOT EXISTS public.release_restore_probe (id integer PRIMARY KEY, value text NOT NULL);" \
            -c "INSERT INTO public.release_restore_probe (id, value) VALUES (1, 'woobe') ON CONFLICT (id) DO UPDATE SET value = EXCLUDED.value;"

          mkdir -p "$RUNNER_TEMP/backups"
          backup="$(WOOBE_POSTGRES_URL=postgresql://postgres:postgres@localhost:5432/woobe BACKUP_DIR="$RUNNER_TEMP/backups" sh scripts/backup_postgres.sh)"

          docker exec -e PGPASSWORD "$WOOBE_ACCEPTANCE_POSTGRES_CONTAINER" \
            dropdb --if-exists -U postgres woobe_restore
          docker exec -e PGPASSWORD "$WOOBE_ACCEPTANCE_POSTGRES_CONTAINER" \
            createdb -U postgres --template=template0 woobe_restore

          RESTORE_FILE="$backup" \
            RESTORE_CONFIRM=restore-woobe \
            RESTORE_CLEAN=false \
            WOOBE_POSTGRES_URL=postgresql://postgres:postgres@localhost:5432/woobe_restore \
            sh scripts/restore_postgres.sh

          restored_value="$(
            docker exec -e PGPASSWORD "$WOOBE_ACCEPTANCE_POSTGRES_CONTAINER" \
              psql -U postgres -d woobe_restore -Atv ON_ERROR_STOP=1 \
              -c "SELECT value FROM public.release_restore_probe WHERE id = 1;"
          )"
          test "$restored_value" = "woobe"
      - name: Security and integration matrix
        run: uv run pytest -q tests/fakes tests/security tests/performance tests/integration/security tests/integration/agent --junitxml=acceptance-backend.xml
      - name: Upload backend evidence
        if: ${{ always() && github.event_name == 'workflow_dispatch' && vars.WOOBE_UPLOAD_CI_ARTIFACTS == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: acceptance-backend-evidence
          path: acceptance-backend.xml
          if-no-files-found: warn
          retention-days: 1
      - name: Stop acceptance dependencies
        if: always()
        run: docker rm -f "$WOOBE_ACCEPTANCE_POSTGRES_CONTAINER" "$WOOBE_ACCEPTANCE_RABBITMQ_CONTAINER" || true
      - name: Cleanup Docker access
        if: always()
        run: bash scripts/ci/cleanup_docker_access.sh

  core-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      COMPOSE_PROJECT_NAME: woobe-core-${{ github.run_id }}
      WOOBE_API_IMAGE: woobe-api:acceptance-${{ github.run_id }}
      WOOBE_WORKERS_IMAGE: woobe-workers:acceptance-${{ github.run_id }}
      WOOBE_FRONTEND_IMAGE: woobe-frontend:acceptance-${{ github.run_id }}
      WOOBE_EMBED_IMAGE: woobe-embed:acceptance-${{ github.run_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Prepare Docker access
        run: bash scripts/ci/prepare_docker_access.sh
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Allocate isolated Core ports
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import socket

          sockets = []
          ports = []
          for _ in range(3):
              sock = socket.socket()
              sock.bind(("127.0.0.1", 0))
              sockets.append(sock)
              ports.append(sock.getsockname()[1])

          api_port, web_port, chat_port = ports
          print(f"WOOBE_PORT={api_port}")
          print(f"WOOBE_WEB_PORT={web_port}")
          print(f"WOOBE_CHAT_EMBED_PORT={chat_port}")
          print(f"VITE_API_URL=http://localhost:{api_port}")
          print(f"VITE_CHAT_EMBED_URL=http://localhost:{chat_port}")
          print(f"WOOBE_API_BASE_URL=http://127.0.0.1:{api_port}")
          print(f"WOOBE_WEB_BASE_URL=http://127.0.0.1:{web_port}")
          print(f"WOOBE_CHAT_EMBED_BASE_URL=http://127.0.0.1:{chat_port}")

          for sock in sockets:
              sock.close()
          PY
      - name: Generate production-shaped Core environment
        run: |
          python scripts/generate_self_host_env.py --force
          python - <<'PY'
          from pathlib import Path

          def set_env(content: str, key: str, value: str) -> str:
              lines = content.splitlines()
              prefix = f"{key}="
              for index, line in enumerate(lines):
                  if line.startswith(prefix):
                      lines[index] = f"{key}={value}"
                      return "\n".join(lines) + "\n"
              lines.append(f"{key}={value}")
              return "\n".join(lines) + "\n"

          content = Path(".env").read_text()
          for key, value in {
              "WOOBE_ENVIRONMENT": "production",
              "WOOBE_ACCESS_COOKIE_SECURE": "true",
              "WOOBE_REFRESH_COOKIE_SECURE": "true",
              "WOOBE_CORS_ORIGINS": "https://app.example.test,https://chat.example.test",
              "WOOBE_TRUSTED_HOSTS": "localhost,127.0.0.1",
          }.items():
              content = set_env(content, key, value)
          Path(".env").write_text(content)
          PY
      - name: Validate supported Core topology
        run: docker compose config --quiet
      - name: Build exact Core application images once
        run: |
          set -euo pipefail
          docker build --pull --target api --tag "$WOOBE_API_IMAGE" .
          docker build --pull --target workers --tag "$WOOBE_WORKERS_IMAGE" .
          docker build --pull --file packages/woobe-frontend/Dockerfile --tag "$WOOBE_FRONTEND_IMAGE" .
          docker build --pull --file packages/woobe-embed/Dockerfile --tag "$WOOBE_EMBED_IMAGE" .
      - name: Smoke the exact prebuilt Core images
        run: bash scripts/ci/smoke_prebuilt_core_images.sh
      - name: Exercise graceful application restart
        run: |
          set -euo pipefail
          compose=(docker compose -f compose.yaml -f docker/ci/compose.release-images.yml)
          "${compose[@]}" stop --timeout 45 web chat-embed api workers
          "${compose[@]}" up -d --no-build api workers web chat-embed
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$WOOBE_API_BASE_URL/ready" >/dev/null \
              && curl --fail --silent "$WOOBE_CHAT_EMBED_BASE_URL/chat/v1/health" >/dev/null \
              && "${compose[@]}" exec -T workers sh -c 'test -s "${WOOBE_WORKER_HEALTH_FILE:-/tmp/woobe/worker-health.json}"'; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Capture smoke evidence
        if: always()
        run: |
          docker compose -f compose.yaml -f docker/ci/compose.release-images.yml ps --all > core-compose-ps.txt || true
          docker compose -f compose.yaml -f docker/ci/compose.release-images.yml logs --no-color > core-compose.log 2>&1 || true
          cat core-compose-ps.txt || true
          cat core-compose.log || true
      - name: Tear down
        if: always()
        run: docker compose -f compose.yaml -f docker/ci/compose.release-images.yml down -v --remove-orphans
      - name: Cleanup Docker access
        if: always()
        run: bash scripts/ci/cleanup_docker_access.sh
      - name: Upload smoke evidence
        if: ${{ always() && github.event_name == 'workflow_dispatch' && vars.WOOBE_UPLOAD_CI_ARTIFACTS == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: acceptance-core-smoke-evidence
          path: |
            core-compose-ps.txt
            core-compose.log
          if-no-files-found: warn
          retention-days: 1

  previous-release-upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      WOOBE_UPGRADE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
      WOOBE_CURRENT_API_IMAGE: woobe-api:upgrade-${{ github.run_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Prepare Docker access
        run: bash scripts/ci/prepare_docker_access.sh
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate previous release to PR schema upgrade
        run: bash scripts/ci/validate_previous_release_upgrade.sh
      - name: Cleanup Docker access
        if: always()
        run: bash scripts/ci/cleanup_docker_access.sh

