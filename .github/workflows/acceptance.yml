name: Acceptance

on:
  pull_request:
    branches: [development]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: woobe
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d woobe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      rabbitmq:
        image: rabbitmq:4-management
        env:
          RABBITMQ_DEFAULT_USER: woobe
          RABBITMQ_DEFAULT_PASS: woobe
        ports: [5672:5672]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      PYTHONPATH: src:.
      WOOBE_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/woobe
      WOOBE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/woobe
      WOOBE_SECRET_KEY: acceptance-secret-key-at-least-32-characters
      WOOBE_ENCRYPTION_KEY: acceptance-encryption-key-at-least-32-characters
      WOOBE_CHAT_TOKEN_SIGNING_KEY: acceptance-chat-key-at-least-32-characters
      WOOBE_RABBITMQ_URL: amqp://woobe:woobe@localhost:5672/
      WOOBE_ENVIRONMENT: test
      WOOBE_DEBUG: "false"
      PGPASSWORD: postgres
      POSTGRES_CLIENT_IMAGE: pgvector/pgvector:pg17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
      - name: Install Python dependencies
        run: uv sync --frozen --all-groups --extra test
      - name: Verify PostgreSQL client
        run: |
          set -euo pipefail
          postgres_container="$(docker ps --filter "ancestor=$POSTGRES_CLIENT_IMAGE" --format '{{.ID}}' | head -n 1)"
          test -n "$postgres_container"
          docker exec "$postgres_container" pg_dump --version | grep -Eq ' 17\.'
      - name: Migration rollback and re-upgrade
        run: |
          set -euo pipefail
          uv run alembic upgrade head
          uv run alembic downgrade -1
          uv run alembic upgrade head
          uv run alembic check
      - name: Backup and restore isolated database
        run: |
          set -euo pipefail

          postgres_container="$(docker ps --filter "ancestor=$POSTGRES_CLIENT_IMAGE" --format '{{.ID}}' | head -n 1)"
          test -n "$postgres_container"

          docker exec -i "$postgres_container" psql -U postgres -d woobe -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE IF NOT EXISTS public.release_restore_probe (id integer PRIMARY KEY, value text NOT NULL);
          INSERT INTO public.release_restore_probe (id, value) VALUES (1, 'woobe')
          ON CONFLICT (id) DO UPDATE SET value = EXCLUDED.value;
          SQL

          docker exec "$postgres_container" mkdir -p /tmp/woobe-acceptance-backups
          docker cp scripts/backup_postgres.sh "$postgres_container:/tmp/backup_postgres.sh"
          docker cp scripts/restore_postgres.sh "$postgres_container:/tmp/restore_postgres.sh"

          backup="$(docker exec \
            -e WOOBE_POSTGRES_URL=postgresql://postgres:postgres@127.0.0.1:5432/woobe \
            -e BACKUP_DIR=/tmp/woobe-acceptance-backups \
            "$postgres_container" \
            sh /tmp/backup_postgres.sh)"

          backup_name="$(basename "$backup")"
          mkdir -p "$RUNNER_TEMP/backups"
          docker cp "$postgres_container:$backup" "$RUNNER_TEMP/backups/$backup_name"
          docker cp "$postgres_container:${backup}.sha256" "$RUNNER_TEMP/backups/${backup_name}.sha256"

          docker exec "$postgres_container" pg_restore --list "$backup" > "$RUNNER_TEMP/backup-contents.txt"
          grep -Fq 'release_restore_probe' "$RUNNER_TEMP/backup-contents.txt"

          docker exec "$postgres_container" dropdb --if-exists -U postgres woobe_restore
          docker exec "$postgres_container" createdb -U postgres --template=template0 woobe_restore

          docker exec \
            -e RESTORE_FILE="$backup" \
            -e RESTORE_CONFIRM=restore-woobe \
            -e RESTORE_CLEAN=false \
            -e WOOBE_POSTGRES_URL=postgresql://postgres:postgres@127.0.0.1:5432/woobe_restore \
            "$postgres_container" \
            sh /tmp/restore_postgres.sh

          test -f "$RUNNER_TEMP/backups/$backup_name"
          test "$(docker exec "$postgres_container" psql -U postgres -d woobe_restore -Atc "SELECT value FROM public.release_restore_probe WHERE id = 1")" = "woobe"
      - name: Security and integration matrix
        run: uv run pytest -q tests/fakes tests/security tests/performance tests/integration/security tests/integration/agent --junitxml=acceptance-backend.xml
      - name: Upload backend evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-backend-evidence
          path: acceptance-backend.xml
          if-no-files-found: warn

  community-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Generate production-shaped Community environment
        run: |
          python scripts/generate_self_host_env.py --force
          python - <<'PY'
          from pathlib import Path

          def set_env(content: str, key: str, value: str) -> str:
              lines = content.splitlines()
              prefix = f"{key}="
              for index, line in enumerate(lines):
                  if line.startswith(prefix):
                      lines[index] = f"{key}={value}"
                      return "\n".join(lines) + "\n"
              lines.append(f"{key}={value}")
              return "\n".join(lines) + "\n"

          content = Path(".env").read_text()
          for key, value in {
              "WOOBE_ENVIRONMENT": "production",
              "WOOBE_ACCESS_COOKIE_SECURE": "true",
              "WOOBE_REFRESH_COOKIE_SECURE": "true",
              "WOOBE_CORS_ORIGINS": "https://app.example.test,https://chat.example.test",
              "WOOBE_TRUSTED_HOSTS": "localhost,127.0.0.1",
          }.items():
              content = set_env(content, key, value)
          Path(".env").write_text(content)
          PY
      - name: Validate supported Community topology
        run: docker compose config --quiet
      - name: Build and start production-shaped Community stack
        run: |
          set -euo pipefail
          docker compose up -d --build db rabbitmq
          docker compose run --rm migrate
          docker compose up -d api workers web chat-embed
          for attempt in $(seq 1 60); do
            if WOOBE_WEB_BASE_URL=http://127.0.0.1:8080 WOOBE_API_BASE_URL=http://127.0.0.1:8000 WOOBE_CHAT_EMBED_BASE_URL=http://127.0.0.1:8081 sh scripts/smoke_production.sh; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color
          exit 1
      - name: Exercise graceful application restart
        run: |
          set -euo pipefail
          docker compose stop --timeout 45 web chat-embed api workers
          docker compose up -d api workers web chat-embed
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/ready >/dev/null && curl --fail --silent http://127.0.0.1:8081/chat/v1/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Capture smoke evidence
        if: always()
        run: |
          docker compose ps --all > community-compose-ps.txt || true
          docker compose logs --no-color > community-compose.log 2>&1 || true
      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
      - name: Upload smoke evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-community-smoke-evidence
          path: |
            community-compose-ps.txt
            community-compose.log
          if-no-files-found: warn
