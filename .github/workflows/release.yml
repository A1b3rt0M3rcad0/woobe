name: Publish Woobe Core images
run-name: Publish Woobe ${{ inputs.version }} @ ${{ inputs.revision }} / ${{ inputs.orchestration_id }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix.
        required: true
        type: string
      revision:
        description: Exact validated merge commit SHA.
        required: true
        type: string
      candidate_run_id:
        description: Successful Release candidate images run that produced the manifest.
        required: true
        type: string
      orchestration_id:
        description: Parent Release Woobe run ID used to identify this exact child run.
        required: true
        type: string

permissions:
  actions: read
  contents: write
  packages: write

concurrency:
  group: publish-woobe-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      owner: ${{ steps.meta.outputs.owner }}
      revision: ${{ steps.meta.outputs.revision }}
      version: ${{ steps.meta.outputs.version }}
      candidate_run_id: ${{ steps.meta.outputs.candidate_run_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Verify release identity
        id: meta
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_REVISION: ${{ inputs.revision }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          test "$version" = "$EXPECTED_VERSION"
          python scripts/ci/check_package_versions.py

          revision="$(git rev-parse HEAD)"
          test "$revision" = "$EXPECTED_REVISION"

          git fetch --force --tags origin
          tag="v$version"
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::Immutable release tag $tag does not exist."
            exit 1
          fi
          tag_revision="$(git rev-parse "$tag^{commit}")"
          if [[ "$tag_revision" != "$revision" ]]; then
            echo "::error::Release tag $tag points to $tag_revision, expected $revision."
            exit 1
          fi

          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "candidate_run_id=$CANDIDATE_RUN_ID" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download validated candidate manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_RUN_ID: ${{ steps.meta.outputs.candidate_run_id }}
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/release-manifest"
          mkdir -p "$destination"
          gh run download "$CANDIDATE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "woobe-release-manifest-$CANDIDATE_RUN_ID" \
            --dir "$destination"
          test -s "$destination/release-manifest.json"

      - name: Verify candidate manifest contract
        id: manifest
        env:
          MANIFEST: ${{ runner.temp }}/release-manifest/release-manifest.json
          EXPECTED_VERSION: ${{ steps.meta.outputs.version }}
          EXPECTED_REVISION: ${{ steps.meta.outputs.revision }}
          EXPECTED_RUN_ID: ${{ steps.meta.outputs.candidate_run_id }}
          EXPECTED_OWNER: ${{ steps.meta.outputs.owner }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path(os.environ["MANIFEST"]).read_text(encoding="utf-8"))
          expected = {
              "version": os.environ["EXPECTED_VERSION"],
              "revision": os.environ["EXPECTED_REVISION"],
              "candidate_run_id": os.environ["EXPECTED_RUN_ID"],
              "owner": os.environ["EXPECTED_OWNER"],
          }
          for key, value in expected.items():
              actual = str(manifest.get(key, ""))
              if actual != value:
                  raise SystemExit(f"release manifest {key}={actual!r}; expected {value!r}")

          if manifest.get("platforms") != ["linux/amd64", "linux/arm64"]:
              raise SystemExit(f"unexpected manifest platforms: {manifest.get('platforms')!r}")

          images = manifest.get("images") or {}
          required = ("api", "workers", "frontend", "embed")
          for unit in required:
              digest = images.get(unit)
              if not isinstance(digest, str) or not digest.startswith("sha256:"):
                  raise SystemExit(f"missing or invalid digest for {unit}: {digest!r}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              for unit in required:
                  handle.write(f"{unit}_digest={images[unit]}\n")
          PY

      - name: Verify exact validated candidate manifests
        shell: bash
        env:
          OWNER: ${{ steps.meta.outputs.owner }}
          REVISION: ${{ steps.meta.outputs.revision }}
          API_DIGEST: ${{ steps.manifest.outputs.api_digest }}
          WORKERS_DIGEST: ${{ steps.manifest.outputs.workers_digest }}
          FRONTEND_DIGEST: ${{ steps.manifest.outputs.frontend_digest }}
          EMBED_DIGEST: ${{ steps.manifest.outputs.embed_digest }}
        run: |
          set -euo pipefail

          inspect_with_retry() {
            local ref="$1"
            local output=""
            local delay=2
            for attempt in 1 2 3 4 5; do
              if output="$(docker buildx imagetools inspect "$ref" 2>&1)"; then
                printf '%s\n' "$output"
                return 0
              fi
              echo "::warning::Unable to inspect $ref (attempt $attempt/5): $output" >&2
              if [[ "$attempt" != 5 ]]; then
                sleep "$delay"
                delay=$((delay * 2))
              fi
            done
            echo "::error::Unable to inspect validated candidate after retries: $ref" >&2
            return 1
          }

          expected_digest() {
            case "$1" in
              api) printf '%s\n' "$API_DIGEST" ;;
              workers) printf '%s\n' "$WORKERS_DIGEST" ;;
              frontend) printf '%s\n' "$FRONTEND_DIGEST" ;;
              embed) printf '%s\n' "$EMBED_DIGEST" ;;
              *) return 2 ;;
            esac
          }

          candidate_tag="sha-$REVISION"
          for unit in api workers frontend embed; do
            ref="ghcr.io/$OWNER/woobe-$unit:$candidate_tag"
            manifest="$(inspect_with_retry "$ref")"
            actual="$(awk '$1 == "Digest:" { print $2; exit }' <<<"$manifest")"
            expected="$(expected_digest "$unit")"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::Validated candidate digest changed for $ref: actual=$actual expected=$expected"
              exit 1
            fi
            grep -q 'linux/amd64' <<<"$manifest"
            grep -q 'linux/arm64' <<<"$manifest"
            echo "$unit: $actual"
          done

      - name: Promote exact validated digests to release version
        shell: bash
        env:
          OWNER: ${{ steps.meta.outputs.owner }}
          VERSION: ${{ steps.meta.outputs.version }}
          API_DIGEST: ${{ steps.manifest.outputs.api_digest }}
          WORKERS_DIGEST: ${{ steps.manifest.outputs.workers_digest }}
          FRONTEND_DIGEST: ${{ steps.manifest.outputs.frontend_digest }}
          EMBED_DIGEST: ${{ steps.manifest.outputs.embed_digest }}
        run: |
          set -euo pipefail

          inspect_with_retry() {
            local ref="$1"
            local output=""
            local delay=2
            for attempt in 1 2 3 4 5; do
              if output="$(docker buildx imagetools inspect "$ref" 2>&1)"; then
                printf '%s\n' "$output"
                return 0
              fi
              if [[ "$attempt" != 5 ]]; then
                echo "::warning::Unable to inspect $ref (attempt $attempt/5): $output" >&2
                sleep "$delay"
                delay=$((delay * 2))
              fi
            done
            return 1
          }

          expected_digest() {
            case "$1" in
              api) printf '%s\n' "$API_DIGEST" ;;
              workers) printf '%s\n' "$WORKERS_DIGEST" ;;
              frontend) printf '%s\n' "$FRONTEND_DIGEST" ;;
              embed) printf '%s\n' "$EMBED_DIGEST" ;;
              *) return 2 ;;
            esac
          }

          for unit in api workers frontend embed; do
            repository="ghcr.io/$OWNER/woobe-$unit"
            target_ref="$repository:$VERSION"
            digest="$(expected_digest "$unit")"

            if existing="$(inspect_with_retry "$target_ref")"; then
              target_digest="$(awk '$1 == "Digest:" { print $2; exit }' <<<"$existing")"
              if [[ "$target_digest" != "$digest" ]]; then
                echo "::error::Immutable release image already exists with a different digest: $target_ref"
                echo "::error::existing=$target_digest expected=$digest"
                exit 1
              fi
              echo "$unit: already published as $target_digest"
              continue
            fi

            echo "Promoting $repository@$digest -> $target_ref"
            docker buildx imagetools create --tag "$target_ref" "$repository@$digest"

            verified="$(inspect_with_retry "$target_ref")" || {
              echo "::error::Published release image could not be read back: $target_ref"
              exit 1
            }
            target_digest="$(awk '$1 == "Digest:" { print $2; exit }' <<<"$verified")"
            test "$target_digest" = "$digest"
            echo "$unit: $target_digest"
          done

  post-publish-smoke:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: woobe-release-${{ github.run_id }}
      WOOBE_API_IMAGE: ghcr.io/${{ needs.publish.outputs.owner }}/woobe-api:${{ needs.publish.outputs.version }}
      WOOBE_WORKERS_IMAGE: ghcr.io/${{ needs.publish.outputs.owner }}/woobe-workers:${{ needs.publish.outputs.version }}
      WOOBE_FRONTEND_IMAGE: ghcr.io/${{ needs.publish.outputs.owner }}/woobe-frontend:${{ needs.publish.outputs.version }}
      WOOBE_EMBED_IMAGE: ghcr.io/${{ needs.publish.outputs.owner }}/woobe-embed:${{ needs.publish.outputs.version }}
      WOOBE_API_BASE_URL: http://127.0.0.1:8000
      WOOBE_WEB_BASE_URL: http://127.0.0.1:8080
      WOOBE_CHAT_EMBED_BASE_URL: http://127.0.0.1:8081
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.publish.outputs.revision }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull published release images
        shell: bash
        run: |
          set -euo pipefail
          for image in "$WOOBE_API_IMAGE" "$WOOBE_WORKERS_IMAGE" "$WOOBE_FRONTEND_IMAGE" "$WOOBE_EMBED_IMAGE"; do
            docker pull "$image"
            revision="$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
            version="$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
            test "$revision" = "${{ needs.publish.outputs.revision }}"
            test "$version" = "${{ needs.publish.outputs.version }}"
          done

      - name: Generate production-shaped environment
        run: |
          python scripts/generate_self_host_env.py --force
          python - <<'PY'
          from pathlib import Path

          path = Path(".env")
          values = {
              "WOOBE_ENVIRONMENT": "production",
              "WOOBE_ACCESS_COOKIE_SECURE": "true",
              "WOOBE_REFRESH_COOKIE_SECURE": "true",
              "WOOBE_CORS_ORIGINS": "https://app.example.test,https://chat.example.test",
              "WOOBE_TRUSTED_HOSTS": "localhost,127.0.0.1",
          }
          lines = path.read_text().splitlines()
          for key, value in values.items():
              prefix = f"{key}="
              for index, line in enumerate(lines):
                  if line.startswith(prefix):
                      lines[index] = f"{key}={value}"
                      break
              else:
                  lines.append(f"{key}={value}")
          path.write_text("\n".join(lines) + "\n")
          PY

      - name: Smoke published release images
        run: bash scripts/ci/smoke_prebuilt_core_images.sh

      - name: Capture post-publish diagnostics
        if: failure()
        run: |
          docker compose -f compose.yaml -f docker/ci/compose.release-images.yml ps --all || true
          docker compose -f compose.yaml -f docker/ci/compose.release-images.yml logs --no-color || true

      - name: Tear down
        if: always()
        run: docker compose -f compose.yaml -f docker/ci/compose.release-images.yml down -v --remove-orphans || true

  github-release:
    needs: [publish, post-publish-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.publish.outputs.revision }}
          fetch-depth: 0

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.publish.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $tag already exists; preserving the existing immutable release record."
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Woobe $tag" \
              --generate-notes
          fi

      - name: Remove completed release branch
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          branch="release/$VERSION"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git push origin --delete "$branch"
          else
            echo "Release branch $branch is already absent."
          fi

      - name: Release summary
        run: |
          {
            echo "### Woobe v${{ needs.publish.outputs.version }} published"
            echo
            echo "Revision: `${{ needs.publish.outputs.revision }}`"
            echo "Candidate run: `${{ needs.publish.outputs.candidate_run_id }}`"
            echo "Git tag: `v${{ needs.publish.outputs.version }}`"
            echo "GitHub Release: published"
            echo "Core images: promoted from the exact validated candidate digests"
            echo "Post-publish smoke: passed"
          } >> "$GITHUB_STEP_SUMMARY"
