name: Publish Woobe Core images

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without v prefix, for example 0.13.0
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}

      - name: Normalize GHCR owner
        id: ghcr
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Core API
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ steps.ghcr.outputs.owner }}/woobe-api:${{ inputs.version }}

      - name: Build and push Core Web reference image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/woobe-frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ steps.ghcr.outputs.owner }}/woobe-web:${{ inputs.version }}

      - name: Build and push Core ChatSurface
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/woobe-embed/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ steps.ghcr.outputs.owner }}/woobe-chat-embed:${{ inputs.version }}
