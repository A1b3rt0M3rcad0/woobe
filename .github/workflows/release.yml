name: Publish Woobe Core images
run-name: Publish Woobe ${{ inputs.version }} @ ${{ inputs.revision }} / ${{ inputs.orchestration_id }}

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      revision:
        required: true
        type: string
      validation_id:
        required: true
        type: string
      api_digest:
        required: true
        type: string
      workers_digest:
        required: true
        type: string
      frontend_digest:
        required: true
        type: string
      embed_digest:
        required: true
        type: string
      orchestration_id:
        required: true
        type: string
    outputs:
      release_url:
        value: ${{ jobs.github-release.outputs.release_url }}
permissions:
  contents: write
  packages: write

concurrency:
  group: publish-woobe-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      owner: ${{ steps.meta.outputs.owner }}
      revision: ${{ steps.meta.outputs.revision }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Verify release identity
        id: meta
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          test "$version" = "$EXPECTED_VERSION"
          python scripts/ci/check_package_versions.py

          revision="$(git rev-parse HEAD)"
          test "$revision" = "$EXPECTED_REVISION"

          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate candidate digest inputs
        shell: bash
        env:
          API_DIGEST: ${{ inputs.api_digest }}
          WORKERS_DIGEST: ${{ inputs.workers_digest }}
          FRONTEND_DIGEST: ${{ inputs.frontend_digest }}
          EMBED_DIGEST: ${{ inputs.embed_digest }}
          VALIDATION_ID: ${{ inputs.validation_id }}
        run: |
          set -euo pipefail
          test -n "$VALIDATION_ID"
          for value in "$API_DIGEST" "$WORKERS_DIGEST" "$FRONTEND_DIGEST" "$EMBED_DIGEST"; do
            [[ "$value" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "::error::Invalid candidate digest: $value"
              exit 1
            }
          done

      - name: Verify exact validated candidate manifests
        shell: bash
        env:
          OWNER: ${{ steps.meta.outputs.owner }}
          REVISION: ${{ steps.meta.outputs.revision }}
          API_DIGEST: ${{ inputs.api_digest }}
          WORKERS_DIGEST: ${{ inputs.workers_digest }}
          FRONTEND_DIGEST: ${{ inputs.frontend_digest }}
          EMBED_DIGEST: ${{ inputs.embed_digest }}
        run: |
          set -euo pipefail

          inspect_with_retry() {
            local ref="$1"
            local output=""
            local delay=2
            for attempt in 1 2 3 4 5; do
              if output="$(docker buildx imagetools inspect "$ref" 2>&1)"; then
                printf '%s\n' "$output"
                return 0
              fi
              echo "::warning::Unable to inspect $ref (attempt $attempt/5): $output" >&2
              if [[ "$attempt" != 5 ]]; then
                sleep "$delay"
                delay=$((delay * 2))
              fi
            done
            echo "::error::Unable to inspect validated candidate after retries: $ref" >&2
            return 1
          }

          expected_digest() {
            case "$1" in
              api) printf '%s\n' "$API_DIGEST" ;;
              workers) printf '%s\n' "$WORKERS_DIGEST" ;;
              frontend) printf '%s\n' "$FRONTEND_DIGEST" ;;
              embed) printf '%s\n' "$EMBED_DIGEST" ;;
              *) return 2 ;;
            esac
          }

          candidate_tag="sha-$REVISION"
          for unit in api workers frontend embed; do
            ref="ghcr.io/$OWNER/woobe-$unit:$candidate_tag"
            manifest="$(inspect_with_retry "$ref")"
            actual="$(awk '$1 == "Digest:" { print $2; exit }' <<<"$manifest")"
            expected="$(expected_digest "$unit")"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::Validated candidate digest changed for $ref: actual=$actual expected=$expected"
              exit 1
            fi
            grep -q 'linux/amd64' <<<"$manifest"
            grep -q 'linux/arm64' <<<"$manifest"
            echo "$unit: $actual"
          done

      - name: Preflight release version targets
        shell: bash
        env:
          OWNER: ${{ steps.meta.outputs.owner }}
          VERSION: ${{ steps.meta.outputs.version }}
          API_DIGEST: ${{ inputs.api_digest }}
          WORKERS_DIGEST: ${{ inputs.workers_digest }}
          FRONTEND_DIGEST: ${{ inputs.frontend_digest }}
          EMBED_DIGEST: ${{ inputs.embed_digest }}
        run: |
          set -euo pipefail

          expected_digest() {
            case "$1" in
              api) printf '%s\n' "$API_DIGEST" ;;
              workers) printf '%s\n' "$WORKERS_DIGEST" ;;
              frontend) printf '%s\n' "$FRONTEND_DIGEST" ;;
              embed) printf '%s\n' "$EMBED_DIGEST" ;;
              *) return 2 ;;
            esac
          }

          probe_target() {
            local ref="$1"
            local output=""
            local delay=2

            for attempt in 1 2 3 4 5; do
              if output="$(docker buildx imagetools inspect "$ref" 2>&1)"; then
                printf '%s\n' "$output"
                return 0
              fi

              if grep -Eqi '(manifest unknown|no such manifest|not found)' <<<"$output"; then
                return 3
              fi

              echo "::warning::Release target lookup failed for $ref (attempt $attempt/5): $output" >&2
              if [[ "$attempt" != 5 ]]; then
                sleep "$delay"
                delay=$((delay * 2))
              fi
            done

            echo "::error::Unable to determine registry state for release ref: $ref" >&2
            return 1
          }

          for unit in api workers frontend embed; do
            repository="ghcr.io/$OWNER/woobe-$unit"
            target_ref="$repository:$VERSION"
            expected="$(expected_digest "$unit")"

            set +e
            existing="$(probe_target "$target_ref")"
            state=$?
            set -e

            if [[ "$state" == 0 ]]; then
              actual="$(awk '$1 == "Digest:" { print $2; exit }' <<<"$existing")"
              if [[ "$actual" != "$expected" ]]; then
                echo "::error::Immutable release image already exists with a different digest: $target_ref"
                echo "::error::existing=$actual expected=$expected"
                exit 1
              fi
              echo "$unit: existing release tag matches validated digest $actual"
              continue
            fi

            if [[ "$state" == 3 ]]; then
              echo "$unit: release tag is absent and may be promoted"
              continue
            fi

            echo "::error::Registry state is unknown for $target_ref; refusing to publish."
            exit 1
          done

      - name: Promote exact validated digests to release version
        shell: bash
        env:
          OWNER: ${{ steps.meta.outputs.owner }}
          VERSION: ${{ steps.meta.outputs.version }}
          API_DIGEST: ${{ inputs.api_digest }}
          WORKERS_DIGEST: ${{ inputs.workers_digest }}
          FRONTEND_DIGEST: ${{ inputs.frontend_digest }}
          EMBED_DIGEST: ${{ inputs.embed_digest }}
        run: |
          set -euo pipefail

          expected_digest() {
            case "$1" in
              api) printf '%s\n' "$API_DIGEST" ;;
              workers) printf '%s\n' "$WORKERS_DIGEST" ;;
              frontend) printf '%s\n' "$FRONTEND_DIGEST" ;;
              embed) printf '%s\n' "$EMBED_DIGEST" ;;
              *) return 2 ;;
            esac
          }

          probe_target() {
            local ref="$1"
            local output=""
            local delay=2

            for attempt in 1 2 3 4 5; do
              if output="$(docker buildx imagetools inspect "$ref" 2>&1)"; then
                printf '%s\n' "$output"
                return 0
              fi

              if grep -Eqi '(manifest unknown|no such manifest|not found)' <<<"$output"; then
                return 3
              fi

              echo "::warning::Release tag lookup failed for $ref (attempt $attempt/5): $output" >&2
              if [[ "$attempt" != 5 ]]; then
                sleep "$delay"
                delay=$((delay * 2))
              fi
            done

            echo "::error::Unable to determine registry state for release ref: $ref" >&2
            return 1
          }

          inspect_strict() {
            local ref="$1"
            local output=""
            local delay=2
            for attempt in 1 2 3 4 5; do
              if output="$(docker buildx imagetools inspect "$ref" 2>&1)"; then
                printf '%s\n' "$output"
                return 0
              fi
              echo "::warning::Unable to verify $ref after promotion (attempt $attempt/5): $output" >&2
              if [[ "$attempt" != 5 ]]; then
                sleep "$delay"
                delay=$((delay * 2))
              fi
            done
            echo "::error::Unable to verify published release image: $ref" >&2
            return 1
          }

          for unit in api workers frontend embed; do
            repository="ghcr.io/$OWNER/woobe-$unit"
            target_ref="$repository:$VERSION"
            digest="$(expected_digest "$unit")"

            set +e
            existing="$(probe_target "$target_ref")"
            state=$?
            set -e

            if [[ "$state" == 0 ]]; then
              target_digest="$(awk '$1 == "Digest:" { print $2; exit }' <<<"$existing")"
              if [[ "$target_digest" != "$digest" ]]; then
                echo "::error::Immutable release image already exists with a different digest: $target_ref"
                echo "::error::existing=$target_digest expected=$digest"
                exit 1
              fi
              echo "$unit: already published as $target_digest"
              continue
            fi

            if [[ "$state" != 3 ]]; then
              echo "::error::Registry state is unknown for $target_ref; refusing to publish."
              exit 1
            fi

            echo "Promoting $repository@$digest -> $target_ref"
            docker buildx imagetools create --tag "$target_ref" "$repository@$digest"

            verified="$(inspect_strict "$target_ref")"
            target_digest="$(awk '$1 == "Digest:" { print $2; exit }' <<<"$verified")"
            test "$target_digest" = "$digest"
            echo "$unit: $target_digest"
          done

  post-publish-smoke:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: woobe-release-${{ github.run_id }}-${{ github.run_attempt }}
      WOOBE_API_IMAGE: ghcr.io/${{ needs.publish.outputs.owner }}/woobe-api:${{ needs.publish.outputs.version }}
      WOOBE_WORKERS_IMAGE: ghcr.io/${{ needs.publish.outputs.owner }}/woobe-workers:${{ needs.publish.outputs.version }}
      WOOBE_FRONTEND_IMAGE: ghcr.io/${{ needs.publish.outputs.owner }}/woobe-frontend:${{ needs.publish.outputs.version }}
      WOOBE_EMBED_IMAGE: ghcr.io/${{ needs.publish.outputs.owner }}/woobe-embed:${{ needs.publish.outputs.version }}
      WOOBE_API_BASE_URL: http://127.0.0.1:8000
      WOOBE_WEB_BASE_URL: http://127.0.0.1:8080
      WOOBE_CHAT_EMBED_BASE_URL: http://127.0.0.1:8081
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.publish.outputs.revision }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull published release images
        shell: bash
        run: |
          set -euo pipefail
          for image in "$WOOBE_API_IMAGE" "$WOOBE_WORKERS_IMAGE" "$WOOBE_FRONTEND_IMAGE" "$WOOBE_EMBED_IMAGE"; do
            docker pull "$image"
            revision="$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
            version="$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
            test "$revision" = "${{ needs.publish.outputs.revision }}"
            test "$version" = "${{ needs.publish.outputs.version }}"
          done

      - name: Generate production-shaped environment
        run: |
          python scripts/generate_self_host_env.py --force
          python - <<'PY'
          from pathlib import Path

          path = Path(".env")
          values = {
              "WOOBE_ENVIRONMENT": "production",
              "WOOBE_ACCESS_COOKIE_SECURE": "true",
              "WOOBE_REFRESH_COOKIE_SECURE": "true",
              "WOOBE_CORS_ORIGINS": "https://app.example.test,https://chat.example.test",
              "WOOBE_TRUSTED_HOSTS": "localhost,127.0.0.1",
          }
          lines = path.read_text().splitlines()
          for key, value in values.items():
              prefix = f"{key}="
              for index, line in enumerate(lines):
                  if line.startswith(prefix):
                      lines[index] = f"{key}={value}"
                      break
              else:
                  lines.append(f"{key}={value}")
          path.write_text("\n".join(lines) + "\n")
          PY

      - name: Smoke published release images
        run: bash scripts/ci/smoke_prebuilt_core_images.sh

      - name: Capture post-publish diagnostics
        if: failure()
        run: |
          docker compose -f compose.yaml -f docker/ci/compose.release-images.yml ps --all || true
          docker compose -f compose.yaml -f docker/ci/compose.release-images.yml logs --no-color || true

      - name: Tear down
        if: always()
        run: docker compose -f compose.yaml -f docker/ci/compose.release-images.yml down -v --remove-orphans || true

  tag:
    name: Create immutable release tag
    needs: [publish, post-publish-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.publish.outputs.revision }}
          fetch-depth: 0

      - name: Create or verify immutable release tag
        env:
          VERSION: ${{ needs.publish.outputs.version }}
          REVISION: ${{ needs.publish.outputs.revision }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          git fetch --force --tags origin

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
            tagged_revision="$(git rev-parse "$tag^{commit}")"
            if [[ "$tagged_revision" != "$REVISION" ]]; then
              echo "::error::Immutable release tag $tag already points to $tagged_revision; expected $REVISION."
              exit 1
            fi
            echo "Tag $tag already exists on the exact validated release commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" "$REVISION" -m "Woobe $tag"
            git push origin "refs/tags/$tag"
          fi

  github-release:
    needs: [publish, post-publish-smoke, tag]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      release_url: ${{ steps.release.outputs.release_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.publish.outputs.revision }}
          fetch-depth: 0

      - name: Write permanent release manifest
        env:
          VERSION: ${{ needs.publish.outputs.version }}
          REVISION: ${{ needs.publish.outputs.revision }}
          VALIDATION_ID: ${{ inputs.validation_id }}
          API_DIGEST: ${{ inputs.api_digest }}
          WORKERS_DIGEST: ${{ inputs.workers_digest }}
          FRONTEND_DIGEST: ${{ inputs.frontend_digest }}
          EMBED_DIGEST: ${{ inputs.embed_digest }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "schema_version": 1,
              "version": os.environ["VERSION"],
              "revision": os.environ["REVISION"],
              "validation_id": os.environ["VALIDATION_ID"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "platforms": ["linux/amd64", "linux/arm64"],
              "images": {
                  "api": os.environ["API_DIGEST"],
                  "workers": os.environ["WORKERS_DIGEST"],
                  "frontend": os.environ["FRONTEND_DIGEST"],
                  "embed": os.environ["EMBED_DIGEST"],
              },
          }
          Path("release-manifest.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Publish GitHub Release and permanent manifest
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.publish.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            assets="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
            if grep -Fxq 'release-manifest.json' <<<"$assets"; then
              temp="$RUNNER_TEMP/existing-release-manifest"
              mkdir -p "$temp"
              gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern release-manifest.json --dir "$temp"
              cmp --silent release-manifest.json "$temp/release-manifest.json" || {
                echo "::error::Existing release-manifest.json differs from the validated release state."
                exit 1
              }
            else
              gh release upload "$tag" release-manifest.json --repo "$GITHUB_REPOSITORY"
            fi
          else
            gh release create "$tag" release-manifest.json \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Woobe $tag" \
              --generate-notes
          fi
          release_url="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
          echo "release_url=$release_url" >> "$GITHUB_OUTPUT"

      - name: Remove completed release branch
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          branch="release/$VERSION"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git push origin --delete "$branch"
          else
            echo "Release branch $branch is already absent."
          fi

      - name: Release summary
        env:
          VERSION: ${{ needs.publish.outputs.version }}
          REVISION: ${{ needs.publish.outputs.revision }}
          VALIDATION_ID: ${{ inputs.validation_id }}
          RELEASE_URL: ${{ steps.release.outputs.release_url }}
        shell: bash
        run: |
          {
            printf '### Woobe v%s published\n\n' "$VERSION"
            printf 'Revision: `%s`\n' "$REVISION"
            printf 'Candidate validation: `%s`\n' "$VALIDATION_ID"
            printf 'Git tag: `v%s`\n' "$VERSION"
            printf 'GitHub Release: %s\n' "$RELEASE_URL"
            echo "Core images: promoted from the exact validated candidate digests"
            echo "Post-publish smoke: passed"
            echo "Permanent manifest: release-manifest.json"
          } >> "$GITHUB_STEP_SUMMARY"
