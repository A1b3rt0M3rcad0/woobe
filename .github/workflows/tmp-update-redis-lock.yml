name: Temporary runtime CI repair

on:
  push:
    branches:
      - feature/agent-runtime-transaction-boundaries
    paths:
      - .github/workflows/tmp-update-redis-lock.yml

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/agent-runtime-transaction-boundaries
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Apply deterministic architecture fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"replacement anchor not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Presentation depends on an Application contract, not a concrete use case.
          replace_once(
              "src/modules/agent/application/interfaces/agent_run_rerun.py",
              "class AgentRunExecutor(Protocol):\n    async def execute(self, input_dto: AskInput) -> AskOutput: ...\n",
              "class AgentRunExecutor(Protocol):\n    async def execute(self, input_dto: AskInput) -> AskOutput: ...\n\n\nclass AgentRunRerunExecutor(Protocol):\n    async def execute(self, *, run_id: UUID, project_id: UUID) -> AskOutput: ...\n",
          )
          replace_once(
              "src/modules/agent/presentation/controllers/rerun_agent_run_controller.py",
              "from modules.agent.application.use_cases.rerun_agent_run import RerunAgentRunUseCase\n",
              "from modules.agent.application.interfaces.agent_run_rerun import AgentRunRerunExecutor\n",
          )
          replace_once(
              "src/modules/agent/presentation/controllers/rerun_agent_run_controller.py",
              "    def __init__(self, use_case: RerunAgentRunUseCase) -> None:\n",
              "    def __init__(self, use_case: AgentRunRerunExecutor) -> None:\n",
          )

          # Long-lived rerun composer exposes a direct Callable without transport types.
          p = Path("src/modules/agent/composition/composers/rerun_agent_run_composer.py")
          text = p.read_text(encoding="utf-8")
          text = text.replace("from collections.abc import Awaitable, Callable", "from collections.abc import Callable")
          text = text.replace("from shared.presentation.http.request import Request\n", "")
          text = text.replace("from shared.presentation.http.response import Response\n", "")
          text = text.replace("\n\nRerunAgentRunHandler = Callable[[Request], Awaitable[Response]]\n", "")
          text = text.replace("def rerun_agent_run_composer() -> RerunAgentRunHandler:", "def rerun_agent_run_composer() -> Callable:")
          p.write_text(text, encoding="utf-8")

          # runtime_preparation stays Infra-pure: Application snapshot implementation is injected
          # by the already-explicit transitional persistence boundary.
          p = Path("src/modules/agent/infra/execution/runtime_preparation.py")
          text = p.read_text(encoding="utf-8")
          text = text.replace("import re\n", "import re\nfrom collections.abc import Callable\n", 1)
          text = re.sub(
              r"from modules\.agent\.application\.tool_release_snapshots import \(\n(?:    .*\n)+?\)\n",
              "",
              text,
              count=1,
          )
          text = text.replace(
              "_SECRET_PATTERN = re.compile(r\"\\{\\{secret:([^}]+)\\}\\}\")\n",
              "_SECRET_PATTERN = re.compile(r\"\\{\\{secret:([^}]+)\\}\\}\")\n\nToolFromSnapshot = Callable[[dict[str, Any]], Any]\nToolWithPermissions = Callable[[Any, Any], Any]\nToolToSnapshot = Callable[[Any], dict[str, Any]]\n",
              1,
          )
          text = text.replace(
              "async def prepare_tool_state(\n    repositories: AgentRuntimeRepositories,\n    *,\n    agent: Any,\n) -> tuple[list[Any], dict[str, str]]:",
              "async def prepare_tool_state(\n    repositories: AgentRuntimeRepositories,\n    *,\n    agent: Any,\n    tool_from_snapshot: ToolFromSnapshot,\n    tool_with_permissions: ToolWithPermissions,\n) -> tuple[list[Any], dict[str, str]]:",
              1,
          )
          text = text.replace("tool_from_release_snapshot(snapshot)", "tool_from_snapshot(snapshot)")
          text = text.replace("tool_with_permission_overrides(", "tool_with_permissions(")
          text = text.replace(
              "    release_version: str | None,\n) -> dict[str, Any]:",
              "    release_version: str | None,\n    tool_to_snapshot: ToolToSnapshot,\n) -> dict[str, Any]:",
              1,
          )
          text = text.replace(
              '        "tools": [tool_to_release_snapshot(tool) for tool in tools],',
              '        "tools": [tool_to_snapshot(tool) for tool in tools],',
              1,
          )
          if "modules.agent.application.tool_release_snapshots" in text:
              raise SystemExit("runtime_preparation still imports concrete Application snapshot code")
          p.write_text(text, encoding="utf-8")

          p = Path("src/modules/agent/infra/execution/explicit_runtime_persistence.py")
          text = p.read_text(encoding="utf-8")
          anchor = "from modules.agent.application.tool_converter import agent_tools_to_openai_definitions_and_mapping\n"
          addition = anchor + "from modules.agent.application.tool_release_snapshots import (\n    tool_from_release_snapshot,\n    tool_to_release_snapshot,\n    tool_with_permission_overrides,\n)\n"
          if "from modules.agent.application.tool_release_snapshots import" not in text:
              if anchor not in text:
                  raise SystemExit("explicit_runtime_persistence snapshot import anchor missing")
              text = text.replace(anchor, addition, 1)
          text = text.replace(
              "            tools, encrypted_tool_secrets = await prepare_tool_state(\n                repositories,\n                agent=agent,\n            )",
              "            tools, encrypted_tool_secrets = await prepare_tool_state(\n                repositories,\n                agent=agent,\n                tool_from_snapshot=tool_from_release_snapshot,\n                tool_with_permissions=tool_with_permission_overrides,\n            )",
              1,
          )
          text = text.replace(
              "                        release_id=release_id,\n                        release_version=release_version,\n                    ),",
              "                        release_id=release_id,\n                        release_version=release_version,\n                        tool_to_snapshot=tool_to_release_snapshot,\n                    ),",
              1,
          )
          p.write_text(text, encoding="utf-8")

          # Move vector read runtime helper out of composition. Composition only wires it.
          Path("src/modules/agent/infra/database/runtime_vector_search_reader.py").write_text(
              '''from __future__ import annotations\n\nfrom uuid import UUID\n\nfrom modules.agent.infra.database.runtime_transaction_runner import AgentRuntimeTransactionRunner\n\n\nclass AgentRuntimeVectorSearchReader:\n    \"\"\"Short read-only pgvector access behind the runtime persistence boundary.\"\"\"\n\n    def __init__(self, transactions: AgentRuntimeTransactionRunner) -> None:\n        self._transactions = transactions\n\n    async def search(\n        self,\n        *,\n        vector_snapshot_id: UUID,\n        embedding: list[float],\n        limit: int,\n        threshold: float,\n    ):\n        async def read(repositories, _outbox):\n            return await repositories.vector_snapshots.search_similar(\n                vector_snapshot_id=vector_snapshot_id,\n                embedding=embedding,\n                limit=limit,\n                threshold=threshold,\n            )\n\n        return await self._transactions.read(read)\n''',
              encoding="utf-8",
          )
          p = Path("src/modules/agent/composition/factories/ask_agent_runtime_factory.py")
          text = p.read_text(encoding="utf-8")
          import_anchor = "from modules.agent.infra.database.runtime_transaction_runner import AgentRuntimeTransactionRunner\n"
          if "runtime_vector_search_reader" not in text:
              text = text.replace(
                  import_anchor,
                  import_anchor + "from modules.agent.infra.database.runtime_vector_search_reader import AgentRuntimeVectorSearchReader\n",
                  1,
              )
          pattern = re.compile(
              r"\n    async def search_vector_snapshot\(.*?\n    runtime\.configure_vector_search_reader\(search_vector_snapshot\)",
              re.S,
          )
          text, count = pattern.subn(
              "\n    runtime.configure_vector_search_reader(\n        AgentRuntimeVectorSearchReader(transactions).search\n    )",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("ask_agent_runtime_factory nested vector reader block not found")
          p.write_text(text, encoding="utf-8")

          # Composer contract now distinguishes transactional CRUD from long-lived Run roots.
          p = Path("quality_gate/architecture/policy.py")
          text = p.read_text(encoding="utf-8")
          text = text.replace(
              "    uow_types: tuple[str, ...]\n    forbidden_parameter_types: tuple[str, ...] = ()\n",
              "    uow_types: tuple[str, ...]\n    long_lived_functions: tuple[str, ...] = ()\n    long_lived_handler: str = \"Callable\"\n    uow_factory_functions: tuple[str, ...] = ()\n    forbidden_parameter_types: tuple[str, ...] = ()\n",
              1,
          )
          text = text.replace(
              "        uow_types=uow_types,\n        forbidden_parameter_types=",
              "        uow_types=uow_types,\n        long_lived_functions=_string_tuple(value.get(\"long_lived_functions\"), field=\"composer_contract.long_lived_functions\"),\n        long_lived_handler=str(value.get(\"long_lived_handler\") or \"Callable\"),\n        uow_factory_functions=_string_tuple(value.get(\"uow_factory_functions\"), field=\"composer_contract.uow_factory_functions\"),\n        forbidden_parameter_types=",
              1,
          )
          p.write_text(text, encoding="utf-8")

          p = Path("quality_gate/architecture/checker.py")
          text = p.read_text(encoding="utf-8")
          text = text.replace(
              "def _uow_call(node: ast.AST | None, contract: ComposerContract) -> bool:\n    return _call_target(node) in set(contract.uow_types)\n",
              "def _uow_call(node: ast.AST | None, contract: ComposerContract) -> bool:\n    target = _call_target(node)\n    return target in set(contract.uow_types).union(contract.uow_factory_functions)\n",
              1,
          )
          start = text.index("def _composer_violations(")
          end = text.index("\n\ndef _composer_function_names", start)
          replacement = '''def _composer_violations(contract: ComposerContract, relative: str, tree: ast.Module) -> tuple[tuple[str, int, str], ...]:\n    if not any(fnmatch(relative, pattern) for pattern in contract.source_globs):\n        return ()\n\n    violations = _module_level_composer_violations(contract, tree)\n    for function in tree.body:\n        if not isinstance(function, (ast.FunctionDef, ast.AsyncFunctionDef)):\n            continue\n        if function.name.startswith("_") or not function.name.endswith(contract.function_suffix):\n            continue\n\n        is_long_lived = function.name in set(contract.long_lived_functions)\n        is_stream = function.name.endswith(contract.streaming_suffix)\n        expected_handler = (\n            contract.long_lived_handler\n            if is_long_lived\n            else contract.streaming_handler if is_stream else contract.regular_handler\n        )\n        annotation = _short_name(_expression_name(function.returns))\n        if annotation != expected_handler:\n            rule = "ARCH020" if is_long_lived else "ARCH023" if is_stream else "ARCH021"\n            violations.append((rule, function.lineno, f"{function.name} must declare return type {expected_handler}"))\n\n        function_args = _function_args(function)\n        if contract.require_zero_arguments:\n            for arg in function_args:\n                rule = "ARCH051" if _parameter_is_dependency(arg, contract) else "ARCH062"\n                message = (\n                    f"{function.name} is a composition root and cannot receive dependency {arg.arg!r}; resolve it inside composition"\n                    if rule == "ARCH051"\n                    else f"{function.name} must be a zero-argument factory; operation data belongs to the request/DTO, not the composer signature"\n                )\n                violations.append((rule, arg.lineno, message))\n        else:\n            for arg in function_args:\n                if arg.arg in contract.forbidden_parameter_names:\n                    violations.append(("ARCH030", arg.lineno, f"{function.name} cannot receive framework-shaped parameter {arg.arg!r}"))\n                forbidden_types = _annotation_names(arg.annotation).intersection(contract.forbidden_parameter_types)\n                if forbidden_types:\n                    violations.append(("ARCH030", arg.lineno, f"{function.name} cannot expose framework type(s) in its signature: {', '.join(sorted(forbidden_types))}"))\n\n        inspector = _ComposerBodyInspector(function).inspect()\n        if isinstance(function, ast.AsyncFunctionDef) or inspector.awaits:\n            violations.append(("ARCH022", function.lineno, f"{function.name} must compose dependencies without executing async work"))\n\n        if contract.forbid_control_flow:\n            for node in inspector.control_flow:\n                if isinstance(node, ast.Await):\n                    continue\n                violations.append(("ARCH027", getattr(node, "lineno", function.lineno), f"{function.name} must be pure wiring; {type(node).__name__} is forbidden"))\n\n        if contract.forbid_nested_definitions:\n            for node in inspector.nested_definitions:\n                violations.append(("ARCH028", getattr(node, "lineno", function.lineno), f"{function.name} cannot define nested runtime helpers"))\n\n        for call in inspector.calls:\n            target = _expression_name(call.func) or ""\n            if any(target == forbidden or target.endswith(f".{forbidden}") for forbidden in contract.forbidden_calls):\n                violations.append(("ARCH031", call.lineno, f"{function.name} cannot construct or resolve operational configuration via {target}()"))\n\n        if contract.forbid_composed_dependency_calls:\n            composed_names = {name for name, value, _ in inspector.assignments if isinstance(value, ast.Call)}\n            for call in inspector.calls:\n                if not isinstance(call.func, ast.Attribute) or not isinstance(call.func.value, ast.Name):\n                    continue\n                owner = call.func.value.id\n                if owner in composed_names:\n                    violations.append(("ARCH059", call.lineno, f"{function.name} cannot execute composed dependency {owner}.{call.func.attr}(); composers only instantiate and connect objects"))\n\n        if not inspector.returns:\n            message = "direct callable" if is_long_lived else "transactional handler"\n            violations.append(("ARCH022", function.lineno, f"{function.name} must return a {message}"))\n        elif is_long_lived:\n            for return_node in inspector.returns:\n                if _call_target(return_node.value) in contract.allowed_handlers:\n                    violations.append(("ARCH020", return_node.lineno, f"{function.name} is long-lived and cannot return a transactional handler"))\n        else:\n            for return_node in inspector.returns:\n                returned_handler = _call_target(return_node.value)\n                if returned_handler not in contract.allowed_handlers:\n                    violations.append(("ARCH022", return_node.lineno, f"{function.name} cannot return a raw controller, use case or callable"))\n                elif returned_handler != expected_handler:\n                    rule = "ARCH023" if is_stream else "ARCH021"\n                    violations.append((rule, return_node.lineno, f"{function.name} must return {expected_handler}"))\n\n        uow_assignments = [(name, value, line) for name, value, line in inspector.assignments if _uow_call(value, contract)]\n        uow_names = {name for name, _, _ in uow_assignments}\n        for async_with in inspector.async_with:\n            for item in async_with.items:\n                context = item.context_expr\n                opens_uow = _uow_call(context, contract)\n                if isinstance(context, ast.Name) and context.id in uow_names:\n                    opens_uow = True\n                if opens_uow:\n                    violations.append(("ARCH024", async_with.lineno, f"{function.name} cannot open the UnitOfWork; the persistence boundary owns it"))\n                    break\n\n        if is_long_lived:\n            if uow_assignments:\n                violations.append(("ARCH025", function.lineno, f"{function.name} is long-lived and cannot create a global UnitOfWork"))\n            continue\n\n        if len(uow_assignments) != 1:\n            violations.append(("ARCH025", function.lineno, f"{function.name} must create exactly one configured UnitOfWork"))\n            continue\n\n        uow_name, uow_value, _ = uow_assignments[0]\n        if (\n            contract.uow_resource_names\n            and isinstance(uow_value, ast.Call)\n            and _call_target(uow_value) in set(contract.uow_types)\n        ):\n            resource = uow_value.args[0] if uow_value.args else None\n            allowed_resources = set(contract.uow_resource_names)\n            if not isinstance(resource, ast.Name) or resource.id not in allowed_resources:\n                violations.append(("ARCH052", uow_value.lineno, f"{function.name} must create its UnitOfWork from a canonical process resource: {', '.join(sorted(allowed_resources))}"))\n\n        if contract.forbid_uow_attribute_access:\n            for attribute in inspector.attributes:\n                if isinstance(attribute.value, ast.Name) and attribute.value.id == uow_name:\n                    violations.append(("ARCH029", attribute.lineno, f"{function.name} cannot use UnitOfWork as a repository/service locator ({uow_name}.{attribute.attr})"))\n\n        if contract.require_repository_uow_argument:\n            for _, value, line in inspector.assignments:\n                if not isinstance(value, ast.Call) or not _is_repository_call(value, contract):\n                    continue\n                first_arg = value.args[0] if value.args else None\n                if not isinstance(first_arg, ast.Name) or first_arg.id != uow_name:\n                    target = _expression_name(value.func) or "repository"\n                    violations.append(("ARCH036", line, f"{function.name} must construct {target} with the same UnitOfWork as its first argument"))\n\n        for return_node in inspector.returns:\n            if _call_target(return_node.value) not in contract.allowed_handlers:\n                continue\n            call = return_node.value\n            assert isinstance(call, ast.Call)\n            handler_uow: ast.AST | None = call.args[0] if call.args else None\n            if handler_uow is None:\n                for keyword in call.keywords:\n                    if keyword.arg in {"uow", "unit_of_work"}:\n                        handler_uow = keyword.value\n                        break\n            if not isinstance(handler_uow, ast.Name) or handler_uow.id != uow_name:\n                violations.append(("ARCH025", return_node.lineno, f"{function.name} must pass the same UnitOfWork to its transactional handler"))\n\n    return tuple(violations)\n'''
          text = text[:start] + replacement + text[end:]
          p.write_text(text, encoding="utf-8")

          p = Path("quality_gate/architecture/policies/agent.toml")
          text = p.read_text(encoding="utf-8")
          text = text.replace(
              'uow_types = ["AgentUnitOfWork"]\n',
              'uow_types = ["AgentUnitOfWork"]\nuow_factory_functions = ["build_agent_uow"]\nlong_lived_handler = "Callable"\nlong_lived_functions = [\n  "ask_agent_composer",\n  "ask_agent_stream_composer",\n  "public_run_composer",\n  "public_stream_composer",\n  "rerun_agent_run_composer",\n]\n',
              1,
          )
          p.write_text(text, encoding="utf-8")

          p = Path("tests/quality_gate/architecture/test_strict_composer_contract.py")
          text = p.read_text(encoding="utf-8")
          text = text.replace(
              'uow_types = ["AgentUnitOfWork"]\n',
              'uow_types = ["AgentUnitOfWork"]\nuow_factory_functions = ["build_agent_uow"]\nlong_lived_handler = "Callable"\nlong_lived_functions = ["ask_agent_composer"]\n',
              1,
          )
          text += '''\n\ndef test_long_lived_composer_returns_direct_callable_without_uow(tmp_path: Path) -> None:\n    checker, policy, root = _checker(tmp_path)\n    (root / "composition/composers/ask_agent.py").write_text(\n        "from collections.abc import Callable\\n"\n        "def ask_agent_composer() -> Callable:\\n"\n        "    return build_ask_agent_handler()\\n",\n        encoding="utf-8",\n    )\n    result = checker.check(policy)\n    assert result.passed, result.violations\n\n\ndef test_long_lived_composer_cannot_create_global_uow(tmp_path: Path) -> None:\n    checker, policy, root = _checker(tmp_path)\n    (root / "composition/composers/ask_agent.py").write_text(\n        "from collections.abc import Callable\\n"\n        "def ask_agent_composer() -> Callable:\\n"\n        "    uow = AgentUnitOfWork(DATABASE_ENGINE)\\n"\n        "    return build_ask_agent_handler()\\n",\n        encoding="utf-8",\n    )\n    result = checker.check(policy)\n    assert any(item.rule_id == "ARCH025" for item in result.violations)\n'''
          p.write_text(text, encoding="utf-8")
          PY

      - name: Refresh lockfile
        run: uv lock

      - name: Install locked dependencies
        run: uv sync --frozen --all-groups --extra test

      - name: Validate architecture gate self-tests
        run: uv run pytest -q tests/quality_gate/architecture

      - name: Validate repository architecture policies
        run: uv run python -m quality_gate.architecture.checker --project-root . --policy-dir quality_gate/architecture/policies

      - name: Commit validated repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock \
            src/modules/agent/application/interfaces/agent_run_rerun.py \
            src/modules/agent/presentation/controllers/rerun_agent_run_controller.py \
            src/modules/agent/composition/composers/rerun_agent_run_composer.py \
            src/modules/agent/infra/execution/runtime_preparation.py \
            src/modules/agent/infra/execution/explicit_runtime_persistence.py \
            src/modules/agent/infra/database/runtime_vector_search_reader.py \
            src/modules/agent/composition/factories/ask_agent_runtime_factory.py \
            quality_gate/architecture/policy.py \
            quality_gate/architecture/checker.py \
            quality_gate/architecture/policies/agent.toml \
            tests/quality_gate/architecture/test_strict_composer_contract.py
          if git diff --cached --quiet; then
            echo "No repair changes to commit"
            exit 0
          fi
          git commit -m "fix(ci): align runtime architecture gates and lockfile"
          git push origin HEAD:feature/agent-runtime-transaction-boundaries
