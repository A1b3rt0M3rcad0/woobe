name: Production containers

on:
  pull_request:
    branches: [development-mvp, development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-images:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Compose environment
        run: cp .env.production.example .env.production
      - name: Validate production topology
        run: |
          docker compose -f docker-compose.prod.yml config --quiet
          docker compose -f docker-compose.prod.yml config --format json > compose-prod.json
          python - <<'PY'
          import json
          from pathlib import Path

          services = json.loads(Path('compose-prod.json').read_text())['services']
          for name in ('db', 'pgbouncer', 'rabbitmq'):
              assert not services[name].get('ports'), f'{name} publishes a host port'
          for name, service in services.items():
              for volume in service.get('volumes', []):
                  assert volume.get('type') != 'bind', f'{name} uses a bind mount'
          assert services['migrate']['restart'] == 'no'
          PY
      - name: Build production images
        run: |
          docker build --tag projectrai-api:ci .
          docker build --tag projectrai-web:ci web
      - name: Verify cached builds without build-network access
        run: |
          docker build --network=none --tag projectrai-api:ci-offline .
          docker build --network=none --tag projectrai-web:ci-offline web
      - name: Require non-root runtime users
        run: |
          for image in projectrai-api:ci projectrai-web:ci; do
            configured_user="$(docker image inspect "$image" --format '{{.Config.User}}')"
            test -n "$configured_user"
            test "$configured_user" != "0"
            test "$configured_user" != "root"
            docker run --rm --entrypoint sh "$image" -c 'test "$(id -u)" -ne 0'
          done
      - name: Reject development server in frontend image
        run: |
          docker image inspect projectrai-web:ci --format '{{json .Config}}' > web-image-config.json
          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path('web-image-config.json').read_text())
          command = ' '.join(config.get('Entrypoint') or []) + ' ' + ' '.join(config.get('Cmd') or [])
          normalized = command.lower()
          assert 'vite' not in normalized, command
          assert 'npm run dev' not in normalized, command
          PY
      - name: Record reproducibility and image-size evidence
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          images = ('projectrai-api:ci', 'projectrai-web:ci')
          evidence = {}
          for image in images:
              raw = subprocess.check_output(
                  ['docker', 'image', 'inspect', image, '--format', '{{json .}}'],
                  text=True,
              )
              metadata = json.loads(raw)
              evidence[image] = {
                  'id': metadata['Id'],
                  'repo_digests': metadata.get('RepoDigests') or [],
                  'size_bytes': metadata['Size'],
                  'configured_user': metadata['Config'].get('User'),
                  'entrypoint': metadata['Config'].get('Entrypoint'),
                  'cmd': metadata['Config'].get('Cmd'),
              }
          Path('production-image-evidence.json').write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + '\n'
          )
          PY
      - name: Generate backend SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: projectrai-api:ci
          artifact-name: projectrai-api-sbom.spdx.json
          format: spdx-json
      - name: Generate frontend SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: projectrai-web:ci
          artifact-name: projectrai-web-sbom.spdx.json
          format: spdx-json
      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: projectrai-api:ci
          format: json
          output: trivy-api.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: projectrai-web:ci
          format: json
          output: trivy-web.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-container-evidence
          path: |
            compose-prod.json
            web-image-config.json
            production-image-evidence.json
            trivy-api.json
            trivy-web.json
          if-no-files-found: warn
