name: Production containers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-images:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Prepare production deployment manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          from secrets import token_urlsafe

          def set_env(content: str, key: str, value: str) -> str:
              prefix = f"{key}="
              lines = content.splitlines()
              for index, line in enumerate(lines):
                  if line.startswith(prefix):
                      lines[index] = f"{key}={value}"
                      return "\n".join(lines) + "\n"
              lines.append(f"{key}={value}")
              return "\n".join(lines) + "\n"

          content = Path('.env.example').read_text()
          database_password = token_urlsafe(24)
          rabbitmq_password = token_urlsafe(24)
          values = {
              'WOOBE_EDITION': 'community',
              'WOOBE_ENVIRONMENT': 'production',
              'WOOBE_SECRET_KEY': token_urlsafe(48),
              'WOOBE_ENCRYPTION_KEY': token_urlsafe(48),
              'WOOBE_CHAT_TOKEN_SIGNING_KEY': token_urlsafe(48),
              'WOOBE_POSTGRES_URL': f'postgresql://migration:{database_password}@postgres.internal:5432/woobe',
              'WOOBE_DATABASE_URL': f'postgresql://runtime:{database_password}@pool.internal:6432/woobe',
              'WOOBE_RABBITMQ_URL': f'amqps://worker:{rabbitmq_password}@rabbitmq.internal:5671/',
              'WOOBE_REDIS_URL': 'rediss://redis.internal:6379/0',
              'WOOBE_S3_BUCKET': 'woobe-production',
              'WOOBE_S3_ENDPOINT_URL': 'https://s3.example.com',
              'WOOBE_S3_FORCE_PATH_STYLE': 'false',
              'WOOBE_S3_SERVER_SIDE_ENCRYPTION': 'AES256',
              'WOOBE_ACCESS_COOKIE_SECURE': 'true',
              'WOOBE_REFRESH_COOKIE_SECURE': 'true',
              'WOOBE_CORS_ORIGINS': 'https://app.example.com,https://chat.example.com',
              'WOOBE_TRUSTED_HOSTS': 'api.example.com',
              'VITE_API_URL': 'https://api.example.com',
              'VITE_CHAT_EMBED_URL': 'https://chat.example.com',
              'VITE_WOOBE_EDITION': 'community',
              'WOOBE_WEB_PORT': '8080',
          }
          for key, value in values.items():
              content = set_env(content, key, value)
          Path('.env').write_text(content)
          PY
      - name: Validate production topology
        run: |
          docker compose -f docker-compose.prod.yml config --quiet
          docker compose -f docker-compose.prod.yml config --format json > compose-prod.json
          python - <<'PY'
          import json
          from pathlib import Path
          services = json.loads(Path('compose-prod.json').read_text())['services']
          assert set(services) == {'migrate', 'api', 'workers', 'web', 'chat-embed'}, services.keys()
          assert services['migrate']['restart'] == 'no'
          for name in ('api', 'workers', 'web', 'chat-embed'):
              assert services[name]['read_only'] is True, name
          for name, service in services.items():
              for volume in service.get('volumes', []):
                  assert volume.get('type') != 'bind', f'{name} uses a bind mount'
          PY
      - name: Build production images
        run: |
          set -euo pipefail
          docker build --tag woobe-api:ci .
          docker build --build-arg VITE_API_URL=https://api.example.com --build-arg VITE_CHAT_EMBED_URL=https://chat.example.com --build-arg VITE_WOOBE_EDITION=community --tag woobe-web:ci web
          docker build --tag woobe-chat-embed:ci embed
      - name: Require non-root runtime users
        run: |
          set -euo pipefail
          for image in woobe-api:ci woobe-web:ci woobe-chat-embed:ci; do
            configured_user="$(docker image inspect "$image" --format '{{.Config.User}}')"
            test -n "$configured_user"
            test "$configured_user" != "0"
            test "$configured_user" != "root"
            docker run --rm --entrypoint sh "$image" -c 'test "$(id -u)" -ne 0'
          done
      - name: Generate SBOMs
        uses: anchore/sbom-action@v0.24.0
        with:
          image: woobe-api:ci
          artifact-name: woobe-api-sbom.spdx.json
          format: spdx-json
      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: woobe-api:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: woobe-web:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan ChatSurface image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: woobe-chat-embed:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Upload topology evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-container-evidence
          path: compose-prod.json
          if-no-files-found: warn
