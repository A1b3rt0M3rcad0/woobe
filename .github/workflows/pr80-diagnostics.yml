name: PR 80 diagnostics

on:
  push:
    branches:
      - agent/multiple-networks-per-project
  pull_request:
    branches:
      - development-mvp

permissions:
  contents: read
  pull-requests: write

jobs:
  frontend-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      VITE_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Capture frontend diagnostics
        shell: bash
        run: |
          set +e
          npm ci > frontend-install.log 2>&1
          install_status=$?
          if [[ "$install_status" -eq 0 ]]; then
            npm run build > frontend-build.log 2>&1
            build_status=$?
            npm run test:run > frontend-test.log 2>&1
            test_status=$?
          else
            build_status=99
            test_status=99
            echo "Skipped because npm ci failed" > frontend-build.log
            echo "Skipped because npm ci failed" > frontend-test.log
          fi
          printf 'install=%s\nbuild=%s\ntest=%s\n' "$install_status" "$build_status" "$test_status" > frontend-status.txt
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr80-frontend-diagnostics
          path: |
            web/frontend-install.log
            web/frontend-build.log
            web/frontend-test.log
            web/frontend-status.txt
          if-no-files-found: warn
      - name: Comment frontend diagnostics
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const read = (path) => fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : `Missing: ${path}`
            const tail = (text, lines = 120) => text.split('\n').slice(-lines).join('\n')
            const body = [
              '<!-- pr80-frontend-diagnostics -->',
              '## PR 80 frontend diagnostics',
              '```text',
              read('web/frontend-status.txt'),
              '```',
              '### Build tail',
              '```text',
              tail(read('web/frontend-build.log')),
              '```',
              '### Test tail',
              '```text',
              tail(read('web/frontend-test.log')),
              '```',
              '### Install tail',
              '```text',
              tail(read('web/frontend-install.log'), 60),
              '```',
            ].join('\n')
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body.slice(0, 60000),
            })

  backend-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: projectrai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d projectrai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      rabbitmq:
        image: rabbitmq:4-management
        env:
          RABBITMQ_DEFAULT_USER: projectrai
          RABBITMQ_DEFAULT_PASS: projectrai
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      PYTHONPATH: src
      PROJECTRAI_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/projectrai
      PROJECTRAI_SECRET_KEY: ci-secret-key-at-least-32-characters
      PROJECTRAI_ENCRYPTION_KEY: ci-encryption-key-at-least-32-characters
      PROJECTRAI_RABBITMQ_URL: amqp://projectrai:projectrai@localhost:5672/
      PROJECTRAI_ENVIRONMENT: test
      PROJECTRAI_DEBUG: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Capture backend diagnostics
        shell: bash
        run: |
          set +e
          uv sync --frozen --all-groups --extra test > uv-sync.log 2>&1
          sync_status=$?
          if [[ "$sync_status" -eq 0 ]]; then
            uv run ruff check src tests > ruff.log 2>&1
            ruff_status=$?
            uv run pyright src migrations > pyright.log 2>&1
            pyright_status=$?
            uv run alembic heads > alembic-heads.log 2>&1
            heads_status=$?
            uv run alembic upgrade head > alembic-upgrade.log 2>&1
            upgrade_status=$?
            uv run alembic current > alembic-current.log 2>&1
            current_status=$?
            uv run alembic check > alembic-check.log 2>&1
            check_status=$?
            uv run python -m pytest -q > pytest.log 2>&1
            pytest_status=$?
          else
            ruff_status=99; pyright_status=99; heads_status=99; upgrade_status=99; current_status=99; check_status=99; pytest_status=99
            for file in ruff.log pyright.log alembic-heads.log alembic-upgrade.log alembic-current.log alembic-check.log pytest.log; do
              echo "Skipped because uv sync failed" > "$file"
            done
          fi
          printf 'sync=%s\nruff=%s\npyright=%s\nheads=%s\nupgrade=%s\ncurrent=%s\ncheck=%s\npytest=%s\n' \
            "$sync_status" "$ruff_status" "$pyright_status" "$heads_status" "$upgrade_status" "$current_status" "$check_status" "$pytest_status" > backend-status.txt
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr80-backend-diagnostics
          path: |
            uv-sync.log
            ruff.log
            pyright.log
            alembic-heads.log
            alembic-upgrade.log
            alembic-current.log
            alembic-check.log
            pytest.log
            backend-status.txt
          if-no-files-found: warn
      - name: Comment backend diagnostics
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const read = (path) => fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : `Missing: ${path}`
            const tail = (text, lines = 80) => text.split('\n').slice(-lines).join('\n')
            const sections = [
              ['Status', read('backend-status.txt'), 30],
              ['Ruff', read('ruff.log'), 100],
              ['Pyright', read('pyright.log'), 120],
              ['Alembic heads', read('alembic-heads.log'), 40],
              ['Alembic upgrade', read('alembic-upgrade.log'), 120],
              ['Alembic check', read('alembic-check.log'), 120],
              ['Pytest', read('pytest.log'), 160],
              ['uv sync', read('uv-sync.log'), 60],
            ]
            const body = [
              '<!-- pr80-backend-diagnostics -->',
              '## PR 80 backend diagnostics',
              ...sections.flatMap(([title, text, lines]) => [`### ${title}`, '```text', tail(text, lines), '```']),
            ].join('\n')
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body.slice(0, 60000),
            })
