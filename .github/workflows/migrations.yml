name: Migration validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: woobe
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d woobe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PYTHONPATH: src
      WOOBE_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/woobe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --all-groups --extra test
      - name: Upgrade and schema check
        run: |
          set -euo pipefail
          uv run alembic upgrade head
          uv run alembic current
          uv run alembic check
      - name: Exercise one-step rollback and re-upgrade
        run: |
          set -euo pipefail
          uv run alembic downgrade -1
          uv run alembic upgrade head
          uv run alembic check
