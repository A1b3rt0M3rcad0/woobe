name: Migrations

on:
  push:
    branches:
      - chore/mvp-01-green-gates
  pull_request:
    branches:
      - development-mvp
      - development
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrations-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema:
    name: schema
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: projectrai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d projectrai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PYTHONPATH: src
      PROJECTRAI_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/projectrai
      PROJECTRAI_SECRET_KEY: ci-secret-key-at-least-32-characters
      PROJECTRAI_ENCRYPTION_KEY: ci-encryption-key-at-least-32-characters
      PROJECTRAI_ENVIRONMENT: test
      PROJECTRAI_DEBUG: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        run: uv sync --frozen --all-groups --extra test
      - name: Require exactly one Alembic head
        shell: bash
        run: |
          set -euo pipefail
          heads="$(uv run alembic heads)"
          printf '%s\n' "$heads"
          head_count="$(printf '%s\n' "$heads" | awk '/\(head\)/ {count++} END {print count+0}')"
          if [[ "$head_count" -ne 1 ]]; then
            echo "Expected exactly one Alembic head, found $head_count" >&2
            exit 1
          fi
      - name: Upgrade empty database to head
        run: uv run alembic upgrade head
      - name: Report current revision
        run: uv run alembic current
      - name: Detect schema drift
        shell: bash
        run: |
          set -o pipefail
          uv run alembic check 2>&1 | tee alembic-check.txt
      - name: Upload Alembic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alembic-check-report
          path: alembic-check.txt
          if-no-files-found: error
