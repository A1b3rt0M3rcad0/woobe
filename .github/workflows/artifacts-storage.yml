name: Artifact storage qualification

on:
  pull_request:
    branches: [master]
    paths:
      - 'packages/woobe-core/src/shared/contracts/object_storage.py'
      - 'packages/woobe-core/src/shared/infra/object_storage/**'
      - 'packages/woobe-core/src/modules/agent/infra/storage/**'
      - 'packages/woobe-core/src/modules/artifacts/**'
      - 'tests/integration/artifacts/**'
      - 'tests/unit/artifacts/**'
      - 'scripts/ci/artifact_s3_test_server.py'
      - '.github/workflows/artifacts-storage.yml'

permissions:
  contents: read

jobs:
  local-and-s3:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WOOBE_ENVIRONMENT: test
      WOOBE_RUN_PERSISTENCE_MODE: legacy_finalization
      WOOBE_ARTIFACT_TEST_S3_CONFIG_FILE: /tmp/woobe-artifact-s3/test-credentials.json
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Install frozen test dependencies
        run: uv sync --frozen --all-groups --extra test --no-install-project
      - name: Start a verified private S3-compatible server
        run: .venv/bin/python scripts/ci/artifact_s3_test_server.py
      - name: Qualify local faults and real S3 operations
        run: >-
          .venv/bin/python -m pytest -q
          tests/unit/artifacts/test_object_storage.py
          tests/unit/artifacts/test_local_storage_faults.py
          tests/unit/agent/test_portable_document_storage.py
          tests/integration/artifacts/test_s3_storage.py
      - name: Stop only the owned qualification process
        if: always()
        run: |
          if [[ -x .venv/bin/python ]]; then
            .venv/bin/python scripts/ci/artifact_s3_test_server.py --stop
          fi
