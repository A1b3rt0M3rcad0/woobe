server {
    listen 8080;
    server_name _;

    location = / {
        default_type text/plain;
        return 200 "Woobe Chat Embed is running\n";
    }

    location = /chat/v1/health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /chat/v1/embed.js {
        alias /usr/share/nginx/html/embed.js;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src https: http:; img-src 'self' data:; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'" always;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }

    location = /chat/v1/iframe.html {
        alias /usr/share/nginx/html/iframe.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src https: http:; img-src 'self' data:; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /chat/v1/preview.html {
        alias /usr/share/nginx/html/preview.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location /chat/v1/assets/ {
        alias /usr/share/nginx/html/assets/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src https: http:; img-src 'self' data:; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        return 404;
    }
}
