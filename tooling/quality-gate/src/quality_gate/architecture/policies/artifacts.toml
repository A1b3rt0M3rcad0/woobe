[module]
name = "artifacts"
root = "packages/woobe-core/src/modules/artifacts"
package = "modules.artifacts"
required_layers = ["domain", "application", "infra", "presentation", "composition"]

[constraints]
forbid_cross_module_imports = true
forbid_dynamic_imports = true
forbid_wildcard_imports = true
forbid_cycles = true
forbidden_paths = ["application/composers", "presentation/http"]

[composer_contract]
source = ["composition/composers/**"]
function_suffix = "_composer"
streaming_suffix = "_stream_composer"
allowed_handlers = ["TransactionalHandler", "StreamingTransactionalHandler"]
regular_handler = "TransactionalHandler"
streaming_handler = "StreamingTransactionalHandler"
uow_types = ["ArtifactsUnitOfWork"]
forbidden_parameter_types = ["AsyncSession", "AsyncEngine", "async_sessionmaker"]
forbidden_parameter_names = ["session", "session_factory", "async_engine", "engine"]
forbidden_calls = ["Settings", "create_engine", "create_session_factory"]
repository_suffixes = ["Repository", "Reader", "Writer"]
forbid_control_flow = true
forbid_nested_definitions = true
forbid_uow_attribute_access = true
require_repository_uow_argument = true
require_zero_arguments = true
dependency_parameter_tokens = ["database", "settings", "session", "engine", "factory", "repository", "repo", "reader", "writer", "uow"]
uow_resource_names = ["DATABASE_ENGINE"]
forbid_module_level_transients = true
transient_suffixes = ["UnitOfWork", "Repository", "Reader", "Writer", "UseCase", "Controller", "Handler", "Service"]
forbid_composed_dependency_calls = true
enforce_zero_arg_callsites = true
forbidden_module_level_calls = ["Settings", "create_engine", "create_session_factory"]

[unit_of_work_contract]
interface_files = ["packages/woobe-core/src/shared/contracts/unit_of_work.py"]
deprecated_interface_files = []
concrete_sources = ["infra/database/unit_of_work.py"]
forbidden_interface_imports = ["sqlalchemy", "fastapi", "starlette", "shared.infra", "modules"]
repository_name_fragments = ["Repository", "Reader", "Writer"]
allowed_properties = ["session"]
forbid_repository_imports = true
forbid_repository_properties = true

[[rules]]
id = "ARCH426"
description = "composers wire module dependencies without transport or framework inputs"
source = ["composition/composers/**"]
allow = ["modules.artifacts", "shared"]
deny = ["fastapi", "starlette", "sqlalchemy", "woobe_api"]

[[rules]]
id = "ARCH421"
description = "the background boundary exposes capabilities without depending on process hosts"
source = ["background_boundary.py"]
allow = []
deny = ["fastapi", "starlette", "woobe_api", "woobe_workers"]
enforce_internal_allowlist = false

[[rules]]
id = "ARCH420"
description = "the public entrypoint reaches internals only through composition"
source = ["entrypoint.py", "__init__.py"]
allow = ["modules.artifacts.composition"]
deny = ["modules.artifacts.application", "modules.artifacts.domain", "modules.artifacts.infra", "modules.artifacts.presentation"]

[[rules]]
id = "ARCH422"
description = "domain remains independent of outer layers and transport frameworks"
source = ["domain/**"]
allow = ["modules.artifacts.domain", "shared.contracts"]
deny = ["modules.artifacts.application", "modules.artifacts.infra", "modules.artifacts.presentation", "modules.artifacts.composition", "fastapi", "starlette", "sqlalchemy", "woobe_api"]

[[rules]]
id = "ARCH423"
description = "application cannot depend on infrastructure, presentation, composition or HTTP frameworks"
source = ["application/**"]
allow = []
deny = ["modules.artifacts.infra", "modules.artifacts.presentation", "modules.artifacts.composition", "shared.infra", "sqlalchemy", "fastapi", "starlette", "woobe_api"]
enforce_internal_allowlist = false

[[rules]]
id = "ARCH424"
description = "presentation controllers remain transport-neutral"
source = ["presentation/**"]
allow = []
deny = ["modules.artifacts.infra", "modules.artifacts.composition", "fastapi", "starlette", "woobe_api"]
enforce_internal_allowlist = false

[[rules]]
id = "ARCH425"
description = "infrastructure cannot import presentation, composition or the API host"
source = ["infra/**"]
allow = []
deny = ["modules.artifacts.presentation", "modules.artifacts.composition", "fastapi", "starlette", "woobe_api"]
enforce_internal_allowlist = false

[[rules]]
id = "ARCH429"
description = "composition is the outer module wiring layer"
source = ["composition/**"]
allow = ["modules.artifacts", "shared"]
deny = ["fastapi", "starlette", "woobe_api"]
