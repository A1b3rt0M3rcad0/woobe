[transaction_ownership]
module = "metering"
module_root = "packages/woobe-core/src/modules/metering"
uow_file = "packages/woobe-core/src/modules/metering/infra/database/unit_of_work.py"
resources_file = "packages/woobe-core/src/modules/metering/composition/resources.py"
process_resources = ["SETTINGS", "DATABASE_ENGINE"]
forbidden_database_facades = [
  "MeteringDatabase",
  "MeteringDatabaseInput",
  "metering_session_factory",
  "coerce_metering_database",
  "SESSION_FACTORY",
  "METERING_DATABASE",
]
forbidden_session_creators = [
  "async_sessionmaker",
  "sessionmaker",
  "create_session_factory",
  "open_session",
]
transaction_methods = ["begin", "commit", "rollback", "close"]
transaction_target_names = [
  "session",
  "_session",
  "transaction",
  "_transaction",
  "tx",
  "_tx",
]
facade_forbidden_scopes = [
  "application",
  "presentation",
  "composition",
]
uow_type = "MeteringUnitOfWork"
uow_engine_type = "AsyncEngine"
forbidden_uow_constructor_types = [
  "MeteringDatabase",
  "async_sessionmaker",
  "AsyncSession",
]
