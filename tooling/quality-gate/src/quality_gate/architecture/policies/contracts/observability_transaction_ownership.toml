[transaction_ownership]
module = "observability"
module_root = "packages/woobe-core/src/modules/observability"
uow_file = "packages/woobe-core/src/modules/observability/infra/database/unit_of_work.py"
resources_file = "packages/woobe-core/src/modules/observability/composition/resources.py"
process_resources = ["SETTINGS", "DATABASE_ENGINE"]
forbidden_database_facades = [
  "ObservabilityDatabase",
  "ObservabilityDatabaseInput",
  "observability_session_factory",
  "coerce_observability_database",
  "SESSION_FACTORY",
  "OBSERVABILITY_DATABASE",
]
forbidden_session_creators = [
  "async_sessionmaker",
  "sessionmaker",
  "create_session_factory",
  "open_session",
]
transaction_methods = ["begin", "commit", "rollback", "close"]
transaction_target_names = [
  "session",
  "_session",
  "transaction",
  "_transaction",
  "tx",
  "_tx",
]
facade_forbidden_scopes = [
  "application",
  "presentation",
  "composition",
]
uow_type = "ObservabilityUnitOfWork"
uow_engine_type = "AsyncEngine"
forbidden_uow_constructor_types = [
  "ObservabilityDatabase",
  "async_sessionmaker",
  "AsyncSession",
]
