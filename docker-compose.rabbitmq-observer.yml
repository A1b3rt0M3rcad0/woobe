services:
  rabbitmq:
    volumes:
      - ./docker/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./docker/rabbitmq/90-observer.conf:/etc/rabbitmq/conf.d/90-observer.conf:ro
      - rabbitmq_trace_data:/var/lib/rabbitmq/tracing

  rabbitmq-observer-init:
    image: curlimages/curl:8.12.1
    entrypoint: ["/bin/sh", "/opt/projectrai/init-observer.sh"]
    environment:
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672
      RABBITMQ_USER: ${RABBITMQ_USER:-projectrai}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-projectrai}
      RABBITMQ_EXCHANGE: ${PROJECTRAI_RABBITMQ_EXCHANGE:-projectrai.events}
      RABBITMQ_OBSERVER_QUEUE: ${RABBITMQ_OBSERVER_QUEUE:-projectrai.observer.events}
      RABBITMQ_OBSERVER_MESSAGE_TTL_MS: ${RABBITMQ_OBSERVER_MESSAGE_TTL_MS:-3600000}
      RABBITMQ_OBSERVER_MAX_MESSAGES: ${RABBITMQ_OBSERVER_MAX_MESSAGES:-1000}
      RABBITMQ_OBSERVER_TRACE_NAME: ${RABBITMQ_OBSERVER_TRACE_NAME:-projectrai-events}
      RABBITMQ_OBSERVER_TRACE_PATTERN: "${RABBITMQ_OBSERVER_TRACE_PATTERN:-}"
      RABBITMQ_OBSERVER_MAX_PAYLOAD_BYTES: ${RABBITMQ_OBSERVER_MAX_PAYLOAD_BYTES:-262144}
    volumes:
      - ./docker/rabbitmq/init-observer.sh:/opt/projectrai/init-observer.sh:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: "no"

volumes:
  rabbitmq_trace_data:
