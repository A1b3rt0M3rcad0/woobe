# Temporary Legacy Schema Allowlist
# Each entry permits a known legacy schema reference in agent models/migrations.
# Fields: file_path, line_pattern, schema, reason, removal_spec
# This file must have zero entries after spec 017.

entries:
  # --- models.py: __table_args__ schema references ---
  - file_path: src/modules/agent/infra/database/models.py
    line_pattern: '"schema": "ai"'
    schema: ai
    reason: "Agent models in legacy ai schema (pre-migration)"
    removal_spec: "009"

  - file_path: src/modules/agent/infra/database/models.py
    line_pattern: '"schema": "knowledge"'
    schema: knowledge
    reason: "Agent models in legacy knowledge schema (pre-migration)"
    removal_spec: "009"

  - file_path: src/modules/agent/infra/database/models.py
    line_pattern: '"schema": "runtime"'
    schema: runtime
    reason: "Agent models in legacy runtime schema (pre-migration)"
    removal_spec: "009"

  # --- models.py: ForeignKey legacy schema references ---
  - file_path: src/modules/agent/infra/database/models.py
    line_pattern: 'ForeignKey("ai.'
    schema: ai
    reason: "Intra-agent FK through legacy schema (pre-migration)"
    removal_spec: "009"

  - file_path: src/modules/agent/infra/database/models.py
    line_pattern: 'ForeignKey("knowledge.'
    schema: knowledge
    reason: "Intra-agent FK through legacy schema (pre-migration)"
    removal_spec: "009"

  - file_path: src/modules/agent/infra/database/models.py
    line_pattern: 'ForeignKey("runtime.'
    schema: runtime
    reason: "Intra-agent FK through legacy schema (pre-migration)"
    removal_spec: "009"

  # --- models.py from other modules referencing legacy agent schemas ---
  - file_path: src/modules/metering/infra/database/models.py
    line_pattern: 'ForeignKey("ai.'
    schema: ai
    reason: "Cross-module FK to legacy agent schema (pre-migration)"
    removal_spec: "010"

  - file_path: src/modules/observability/infra/database/models.py
    line_pattern: 'ForeignKey("ai.'
    schema: ai
    reason: "Cross-module FK to legacy agent schema (pre-migration)"
    removal_spec: "010"

  - file_path: src/modules/observability/infra/database/models.py
    line_pattern: 'ForeignKey("runtime.'
    schema: runtime
    reason: "Cross-module FK to legacy agent schema (pre-migration)"
    removal_spec: "010"

  - file_path: src/modules/tools/infra/database/models.py
    line_pattern: 'ForeignKey("ai.'
    schema: ai
    reason: "Cross-module FK to legacy agent schema (pre-migration)"
    removal_spec: "010"

  # --- historical migrations ---
  - file_path: migrations/versions/*
    line_pattern: 'schema="ai"'
    schema: ai
    reason: "Historical migration creating/altering legacy ai schema objects"
    removal_spec: "016"

  - file_path: migrations/versions/*
    line_pattern: 'schema="knowledge"'
    schema: knowledge
    reason: "Historical migration creating/altering legacy knowledge schema objects"
    removal_spec: "016"

  - file_path: migrations/versions/*
    line_pattern: 'schema="runtime"'
    schema: runtime
    reason: "Historical migration creating/altering legacy runtime schema objects"
    removal_spec: "016"
