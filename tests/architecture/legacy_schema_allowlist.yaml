# Temporary Legacy Schema Allowlist
# Each entry permits a known legacy schema reference in agent models/migrations.
# Fields: file_path, line_pattern, schema, reason, removal_spec
# This file must have zero entries after spec 017.

entries:
  # --- models.py: legacy messaging classes (kept until spec 011) ---
  - file_path: src/modules/agent/infra/database/models.py
    line_pattern: '"schema": "ai"'
    schema: ai
    reason: "Legacy messaging OutboxEventModel/InboxEventModel (spec 011)"
    removal_spec: "011"

  - file_path: src/modules/agent/infra/database/models.py
    line_pattern: '"schema": "knowledge"'
    schema: knowledge
    reason: "Legacy messaging KnowledgeOutboxEventModel/KnowledgeInboxEventModel (spec 011)"
    removal_spec: "011"

  - file_path: src/modules/agent/infra/database/models.py
    line_pattern: '"schema": "runtime"'
    schema: runtime
    reason: "Legacy messaging RuntimeOutboxEventModel/RuntimeInboxEventModel (spec 011)"
    removal_spec: "011"


  # --- historical migrations ---
  - file_path: migrations/versions/*
    line_pattern: 'schema="ai"'
    schema: ai
    reason: "Historical migration creating/altering legacy ai schema objects"
    removal_spec: "016"

  - file_path: migrations/versions/*
    line_pattern: 'schema="knowledge"'
    schema: knowledge
    reason: "Historical migration creating/altering legacy knowledge schema objects"
    removal_spec: "016"

  - file_path: migrations/versions/*
    line_pattern: 'schema="runtime"'
    schema: runtime
    reason: "Historical migration creating/altering legacy runtime schema objects"
    removal_spec: "016"
