      <stop stop-color="#020817"/><stop offset="1" stop-color="#10182b"/>
    </linearGradient>
    <radialGradient id="halo"><stop stop-color="#1d4ed8" stop-opacity=".2"/><stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/></radialGradient>
    <linearGradient id="accent"><stop stop-color="#60a5fa"/><stop offset="1" stop-color="#a5b4fc"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity=".045"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#64748b" stroke-width="1.5"/></marker>
  </defs>
