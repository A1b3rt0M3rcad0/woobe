<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" role="img" aria-labelledby="title desc">
  <title id="title">Woobe — AI agents, operated like production software</title>
  <desc id="desc">A conceptual overview of the Woobe control plane and runtime. Agent and Network definitions become immutable releases, selected for production execution with models, tools and knowledge. Each Run has release provenance and observable execution evidence. The lifecycle moves from Draft to Staging, Release, Production and observation.</desc>
  <metadata>Original repository documentation illustration. Authored for the Woobe README from README.md, docs/ARCHITECTURE.md, docs/agents/INVARIANTS.md and docs/CLI.md. No third-party assets, external fonts or generated third-party imagery.</metadata>
  <defs>
