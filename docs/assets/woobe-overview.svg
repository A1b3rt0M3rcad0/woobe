    <text x="80" y="340" fill="#f8fafc" font-size="52" font-weight="700" letter-spacing="-1.8">AI agents.</text>
    <text x="80" y="405" fill="#f8fafc" font-size="52" font-weight="700" letter-spacing="-1.8">Production discipline.</text>
