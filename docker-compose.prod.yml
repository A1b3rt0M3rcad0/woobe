name: projectrai

# Production/application-only reference. Interpolation intentionally does not use
# ${VAR:?} guards: Docker Compose expands the whole file before selecting a service,
# so global guards would force API-only hosts to carry Worker/Web/Migration secrets.
# Each runtime validates its own required subset instead.
x-app-common-environment: &app-common-environment
  PROJECTRAI_ENVIRONMENT: ${PROJECTRAI_ENVIRONMENT:-development}
  PROJECTRAI_DEBUG: ${PROJECTRAI_DEBUG:-false}
  PROJECTRAI_JSON_LOGS: ${PROJECTRAI_JSON_LOGS:-true}
  PROJECTRAI_METRICS_ENABLED: ${PROJECTRAI_METRICS_ENABLED:-true}
  PROJECTRAI_LOG_LEVEL: ${PROJECTRAI_LOG_LEVEL:-INFO}
  PROJECTRAI_DATABASE_URL: ${PROJECTRAI_DATABASE_URL:-}
  PROJECTRAI_ENCRYPTION_KEY: ${PROJECTRAI_ENCRYPTION_KEY:-}
  PROJECTRAI_DB_POOL_SIZE: ${PROJECTRAI_DB_POOL_SIZE:-5}
  PROJECTRAI_DB_MAX_OVERFLOW: ${PROJECTRAI_DB_MAX_OVERFLOW:-5}
  PROJECTRAI_REDIS_URL: ${PROJECTRAI_REDIS_URL:-}
  PROJECTRAI_REDIS_CONNECT_TIMEOUT_SECONDS: ${PROJECTRAI_REDIS_CONNECT_TIMEOUT_SECONDS:-2.0}
  PROJECTRAI_MCP_SESSION_CACHE_ENABLED: ${PROJECTRAI_MCP_SESSION_CACHE_ENABLED:-true}
  PROJECTRAI_MCP_SESSION_KEY_PREFIX: ${PROJECTRAI_MCP_SESSION_KEY_PREFIX:-projectrai:mcp-session}
  PROJECTRAI_MCP_SESSION_TTL_SECONDS: ${PROJECTRAI_MCP_SESSION_TTL_SECONDS:-3600}
  PROJECTRAI_STORAGE_DRIVER: ${PROJECTRAI_STORAGE_DRIVER:-s3}
  PROJECTRAI_UPLOAD_MAX_MB: ${PROJECTRAI_UPLOAD_MAX_MB:-25}
  PROJECTRAI_UPLOAD_ALLOWED_EXTENSIONS: ${PROJECTRAI_UPLOAD_ALLOWED_EXTENSIONS:-.txt,.md,.pdf,.docx}
  PROJECTRAI_UPLOAD_LOCAL_DIR: ${PROJECTRAI_UPLOAD_LOCAL_DIR:-./storage/uploads}
  PROJECTRAI_S3_BUCKET: ${PROJECTRAI_S3_BUCKET:-}
  PROJECTRAI_S3_REGION: ${PROJECTRAI_S3_REGION:-us-east-1}
  PROJECTRAI_S3_PREFIX: ${PROJECTRAI_S3_PREFIX:-uploads}
  PROJECTRAI_S3_ENDPOINT_URL: ${PROJECTRAI_S3_ENDPOINT_URL:-}
  PROJECTRAI_S3_FORCE_PATH_STYLE: ${PROJECTRAI_S3_FORCE_PATH_STYLE:-false}
  PROJECTRAI_S3_SERVER_SIDE_ENCRYPTION: ${PROJECTRAI_S3_SERVER_SIDE_ENCRYPTION:-AES256}
  PROJECTRAI_RAG_DOCX_MAX_UNCOMPRESSED_MB: ${PROJECTRAI_RAG_DOCX_MAX_UNCOMPRESSED_MB:-100}
  PROJECTRAI_RAG_DOCX_MAX_ENTRIES: ${PROJECTRAI_RAG_DOCX_MAX_ENTRIES:-1000}
  PROJECTRAI_RAG_DOCX_MAX_COMPRESSION_RATIO: ${PROJECTRAI_RAG_DOCX_MAX_COMPRESSION_RATIO:-100}
  PROJECTRAI_RUNTIME_MAX_CONCURRENCY_PER_KEY: ${PROJECTRAI_RUNTIME_MAX_CONCURRENCY_PER_KEY:-4}
  PROJECTRAI_RUNTIME_MAX_PROMPT_CHARS: ${PROJECTRAI_RUNTIME_MAX_PROMPT_CHARS:-32768}
  PROJECTRAI_RUNTIME_MAX_METADATA_BYTES: ${PROJECTRAI_RUNTIME_MAX_METADATA_BYTES:-16384}
  PROJECTRAI_RUNTIME_MAX_SNAPSHOT_OVERRIDE_BYTES: ${PROJECTRAI_RUNTIME_MAX_SNAPSHOT_OVERRIDE_BYTES:-32768}
  PROJECTRAI_RUNTIME_MAX_REQUEST_BYTES: ${PROJECTRAI_RUNTIME_MAX_REQUEST_BYTES:-262144}
  PROJECTRAI_RUNTIME_TOTAL_TIMEOUT_SECONDS: ${PROJECTRAI_RUNTIME_TOTAL_TIMEOUT_SECONDS:-120}
  PROJECTRAI_NETWORK_RUNTIME_ENABLED: ${PROJECTRAI_NETWORK_RUNTIME_ENABLED:-true}
  PROJECTRAI_NETWORK_STREAM_HEARTBEAT_SECONDS: ${PROJECTRAI_NETWORK_STREAM_HEARTBEAT_SECONDS:-10}
  PROJECTRAI_NETWORK_MAX_DEPTH_DEFAULT: ${PROJECTRAI_NETWORK_MAX_DEPTH_DEFAULT:-4}
  PROJECTRAI_NETWORK_MAX_DEPTH_HARD: ${PROJECTRAI_NETWORK_MAX_DEPTH_HARD:-8}
  PROJECTRAI_NETWORK_MAX_INVOCATIONS_DEFAULT: ${PROJECTRAI_NETWORK_MAX_INVOCATIONS_DEFAULT:-16}
  PROJECTRAI_NETWORK_MAX_INVOCATIONS_HARD: ${PROJECTRAI_NETWORK_MAX_INVOCATIONS_HARD:-64}
  PROJECTRAI_NETWORK_TIMEOUT_DEFAULT_SECONDS: ${PROJECTRAI_NETWORK_TIMEOUT_DEFAULT_SECONDS:-90}
  PROJECTRAI_NETWORK_TIMEOUT_HARD_SECONDS: ${PROJECTRAI_NETWORK_TIMEOUT_HARD_SECONDS:-300}
  PROJECTRAI_NETWORK_EXECUTION_LEASE_TTL_SECONDS: ${PROJECTRAI_NETWORK_EXECUTION_LEASE_TTL_SECONDS:-30}
  PROJECTRAI_NETWORK_EXECUTION_LEASE_HEARTBEAT_SECONDS: ${PROJECTRAI_NETWORK_EXECUTION_LEASE_HEARTBEAT_SECONDS:-10}
  PROJECTRAI_HTTP_TOOL_TIMEOUT_MAX_MS: ${PROJECTRAI_HTTP_TOOL_TIMEOUT_MAX_MS:-30000}
  PROJECTRAI_HTTP_TOOL_RESPONSE_MAX_BYTES: ${PROJECTRAI_HTTP_TOOL_RESPONSE_MAX_BYTES:-1048576}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}

x-app-service: &app-service
  build: .
  image: projectrai-api:0.1.0
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  migrate:
    <<: *app-service
    environment:
      PROJECTRAI_POSTGRES_URL: ${PROJECTRAI_POSTGRES_URL:-}
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *app-service
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    environment:
      <<: *app-common-environment
      PROJECTRAI_SECRET_KEY: ${PROJECTRAI_SECRET_KEY:-}
      PROJECTRAI_AUTH_ISSUER: ${PROJECTRAI_AUTH_ISSUER:-projectrai}
      PROJECTRAI_AUTH_AUDIENCE: ${PROJECTRAI_AUTH_AUDIENCE:-projectrai-web}
      PROJECTRAI_ACCESS_TOKEN_TTL_SECONDS: ${PROJECTRAI_ACCESS_TOKEN_TTL_SECONDS:-900}
      PROJECTRAI_REFRESH_TOKEN_TTL_DAYS: ${PROJECTRAI_REFRESH_TOKEN_TTL_DAYS:-30}
      PROJECTRAI_AUTH_CLOCK_SKEW_SECONDS: ${PROJECTRAI_AUTH_CLOCK_SKEW_SECONDS:-30}
      PROJECTRAI_ACCESS_COOKIE_NAME: ${PROJECTRAI_ACCESS_COOKIE_NAME:-projectrai_access}
      PROJECTRAI_ACCESS_COOKIE_SECURE: ${PROJECTRAI_ACCESS_COOKIE_SECURE:-true}
      PROJECTRAI_ACCESS_COOKIE_SAME_SITE: ${PROJECTRAI_ACCESS_COOKIE_SAME_SITE:-lax}
      PROJECTRAI_REFRESH_COOKIE_NAME: ${PROJECTRAI_REFRESH_COOKIE_NAME:-projectrai_refresh}
      PROJECTRAI_REFRESH_COOKIE_SECURE: ${PROJECTRAI_REFRESH_COOKIE_SECURE:-true}
      PROJECTRAI_REFRESH_COOKIE_SAME_SITE: ${PROJECTRAI_REFRESH_COOKIE_SAME_SITE:-lax}
      PROJECTRAI_CSRF_COOKIE_NAME: ${PROJECTRAI_CSRF_COOKIE_NAME:-projectrai_csrf}
      PROJECTRAI_CSRF_HEADER_NAME: ${PROJECTRAI_CSRF_HEADER_NAME:-x-csrf-token}
      PROJECTRAI_LOGIN_RATE_LIMIT_ATTEMPTS: ${PROJECTRAI_LOGIN_RATE_LIMIT_ATTEMPTS:-10}
      PROJECTRAI_LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${PROJECTRAI_LOGIN_RATE_LIMIT_WINDOW_SECONDS:-60}
      PROJECTRAI_API_KEY_RATE_LIMIT_REQUESTS: ${PROJECTRAI_API_KEY_RATE_LIMIT_REQUESTS:-120}
      PROJECTRAI_API_KEY_RATE_LIMIT_WINDOW_SECONDS: ${PROJECTRAI_API_KEY_RATE_LIMIT_WINDOW_SECONDS:-60}
      PROJECTRAI_REQUEST_MAX_BYTES: ${PROJECTRAI_REQUEST_MAX_BYTES:-1048576}
      PROJECTRAI_READINESS_TIMEOUT_SECONDS: ${PROJECTRAI_READINESS_TIMEOUT_SECONDS:-3.0}
      PROJECTRAI_CORS_ORIGINS: ${PROJECTRAI_CORS_ORIGINS:-}
      PROJECTRAI_TRUSTED_HOSTS: ${PROJECTRAI_TRUSTED_HOSTS:-}
      PROJECTRAI_HOST: ${PROJECTRAI_HOST:-0.0.0.0}
      PROJECTRAI_PORT: 8000
    ports:
      - "${PROJECTRAI_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 45s

  workers:
    <<: *app-service
    command: ["python", "-m", "src.worker_main"]
    environment:
      <<: *app-common-environment
      PROJECTRAI_RABBITMQ_URL: ${PROJECTRAI_RABBITMQ_URL:-}
      PROJECTRAI_RABBITMQ_EXCHANGE: ${PROJECTRAI_RABBITMQ_EXCHANGE:-projectrai.events}
      PROJECTRAI_WORKER_INTERVAL: ${PROJECTRAI_WORKER_INTERVAL:-5.0}
      PROJECTRAI_WORKER_HEALTH_FILE: ${PROJECTRAI_WORKER_HEALTH_FILE:-/tmp/projectrai/worker-health.json}
      PROJECTRAI_WORKER_HEARTBEAT_INTERVAL_SECONDS: ${PROJECTRAI_WORKER_HEARTBEAT_INTERVAL_SECONDS:-10}
      PROJECTRAI_WORKER_HEALTH_MAX_AGE_SECONDS: ${PROJECTRAI_WORKER_HEALTH_MAX_AGE_SECONDS:-45}
      PROJECTRAI_NETWORK_WORKER_PREFETCH: ${PROJECTRAI_NETWORK_WORKER_PREFETCH:-4}
      PROJECTRAI_NETWORK_WORKER_SLOTS: ${PROJECTRAI_NETWORK_WORKER_SLOTS:-4}
      PROJECTRAI_OUTBOX_BATCH_SIZE: ${PROJECTRAI_OUTBOX_BATCH_SIZE:-50}
      PROJECTRAI_INBOX_BATCH_SIZE: ${PROJECTRAI_INBOX_BATCH_SIZE:-50}
      PROJECTRAI_OUTBOX_LOCK_TIMEOUT_SECONDS: ${PROJECTRAI_OUTBOX_LOCK_TIMEOUT_SECONDS:-300}
      PROJECTRAI_INBOX_LOCK_TIMEOUT_SECONDS: ${PROJECTRAI_INBOX_LOCK_TIMEOUT_SECONDS:-300}
      PROJECTRAI_OUTBOX_MAX_RETRIES: ${PROJECTRAI_OUTBOX_MAX_RETRIES:-3}
      PROJECTRAI_RETRY_BASE_DELAY_SECONDS: ${PROJECTRAI_RETRY_BASE_DELAY_SECONDS:-1.0}
      PROJECTRAI_RETRY_MAX_DELAY_SECONDS: ${PROJECTRAI_RETRY_MAX_DELAY_SECONDS:-300.0}
      PROJECTRAI_RETRY_BACKOFF_MULTIPLIER: ${PROJECTRAI_RETRY_BACKOFF_MULTIPLIER:-2.0}
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib; data=pathlib.Path('/proc/1/cmdline').read_bytes(); raise SystemExit(0 if b'worker_main' in data else 1)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    stop_grace_period: 45s

  web:
    build:
      context: web
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    image: projectrai-web:0.1.0
    ports:
      - "${PROJECTRAI_WEB_PORT:-8080}:8080"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=32m,mode=0755,uid=101,gid=101
      - /var/run:size=4m,mode=0755,uid=101,gid=101
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
