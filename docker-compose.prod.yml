name: projectrai

x-app-service: &app-service
  image: projectrai-api:0.1.0
  env_file:
    - .env.production
  environment:
    PROJECTRAI_ENVIRONMENT: production
    PROJECTRAI_DEBUG: "false"
    PROJECTRAI_REFRESH_COOKIE_SECURE: "true"
    PROJECTRAI_JSON_LOGS: "true"
    PROJECTRAI_METRICS_ENABLED: "true"
    PROJECTRAI_RUN_MIGRATIONS: "false"
  networks:
    - application
    - data
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  migrate:
    <<: *app-service
    command: ["alembic", "upgrade", "head"]
    environment:
      PROJECTRAI_ENVIRONMENT: production
      PROJECTRAI_DEBUG: "false"
      PROJECTRAI_REFRESH_COOKIE_SECURE: "true"
      PROJECTRAI_JSON_LOGS: "true"
      PROJECTRAI_METRICS_ENABLED: "false"
      PROJECTRAI_RUN_MIGRATIONS: "false"
    depends_on:
      pgbouncer:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app-service
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 45s

  workers:
    <<: *app-service
    command: ["python", "-m", "src.worker_main"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib; data=pathlib.Path('/proc/1/cmdline').read_bytes(); raise SystemExit(0 if b'worker_main' in data else 1)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    stop_grace_period: 45s

  web:
    image: projectrai-web:0.1.0
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - application
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=32m,mode=0755,uid=101,gid=101
      - /var/run:size=4m,mode=0755,uid=101,gid=101
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s

  db:
    image: pgvector/pgvector:pg17
    env_file:
      - .env.production
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    env_file:
      - .env.production
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: projectrai
      LISTEN_ADDR: "0.0.0.0"
      LISTEN_PORT: "6432"
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "200"
      DEFAULT_POOL_SIZE: "30"
      AUTH_TYPE: scram-sha-256
    depends_on:
      db:
        condition: service_healthy
    networks:
      - data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U $${DB_USER} -d $${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 6

  rabbitmq:
    image: rabbitmq:4-management-alpine
    env_file:
      - .env.production
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

networks:
  application:
  data:
    internal: true

volumes:
  pgdata:
  rabbitmq_data:
