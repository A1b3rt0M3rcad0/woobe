name: woobe

# Application-only production reference. Database, broker, cache and object storage
# are external services supplied through WOOBE_* connection settings.
x-app-common-environment: &app-common-environment
  WOOBE_EDITION: ${WOOBE_EDITION:-community}
  WOOBE_ENVIRONMENT: ${WOOBE_ENVIRONMENT:-production}
  WOOBE_DEBUG: ${WOOBE_DEBUG:-false}
  WOOBE_JSON_LOGS: ${WOOBE_JSON_LOGS:-true}
  WOOBE_METRICS_ENABLED: ${WOOBE_METRICS_ENABLED:-true}
  WOOBE_LOG_LEVEL: ${WOOBE_LOG_LEVEL:-INFO}
  WOOBE_DATABASE_URL: ${WOOBE_DATABASE_URL:-}
  WOOBE_ENCRYPTION_KEY: ${WOOBE_ENCRYPTION_KEY:-}
  WOOBE_DB_POOL_SIZE: ${WOOBE_DB_POOL_SIZE:-5}
  WOOBE_DB_MAX_OVERFLOW: ${WOOBE_DB_MAX_OVERFLOW:-5}
  WOOBE_REDIS_URL: ${WOOBE_REDIS_URL:-}
  WOOBE_REDIS_CONNECT_TIMEOUT_SECONDS: ${WOOBE_REDIS_CONNECT_TIMEOUT_SECONDS:-2.0}
  WOOBE_MCP_SESSION_CACHE_ENABLED: ${WOOBE_MCP_SESSION_CACHE_ENABLED:-true}
  WOOBE_MCP_SESSION_KEY_PREFIX: ${WOOBE_MCP_SESSION_KEY_PREFIX:-woobe:mcp-session}
  WOOBE_MCP_SESSION_TTL_SECONDS: ${WOOBE_MCP_SESSION_TTL_SECONDS:-3600}
  WOOBE_STORAGE_DRIVER: ${WOOBE_STORAGE_DRIVER:-s3}
  WOOBE_UPLOAD_MAX_MB: ${WOOBE_UPLOAD_MAX_MB:-25}
  WOOBE_UPLOAD_ALLOWED_EXTENSIONS: ${WOOBE_UPLOAD_ALLOWED_EXTENSIONS:-.txt,.md,.pdf,.docx}
  WOOBE_UPLOAD_LOCAL_DIR: ${WOOBE_UPLOAD_LOCAL_DIR:-./storage/uploads}
  WOOBE_S3_BUCKET: ${WOOBE_S3_BUCKET:-}
  WOOBE_S3_REGION: ${WOOBE_S3_REGION:-us-east-1}
  WOOBE_S3_PREFIX: ${WOOBE_S3_PREFIX:-uploads}
  WOOBE_S3_ENDPOINT_URL: ${WOOBE_S3_ENDPOINT_URL:-}
  WOOBE_S3_FORCE_PATH_STYLE: ${WOOBE_S3_FORCE_PATH_STYLE:-false}
  WOOBE_S3_SERVER_SIDE_ENCRYPTION: ${WOOBE_S3_SERVER_SIDE_ENCRYPTION:-AES256}
  WOOBE_RAG_DOCX_MAX_UNCOMPRESSED_MB: ${WOOBE_RAG_DOCX_MAX_UNCOMPRESSED_MB:-100}
  WOOBE_RAG_DOCX_MAX_ENTRIES: ${WOOBE_RAG_DOCX_MAX_ENTRIES:-1000}
  WOOBE_RAG_DOCX_MAX_COMPRESSION_RATIO: ${WOOBE_RAG_DOCX_MAX_COMPRESSION_RATIO:-100}
  WOOBE_RUNTIME_MAX_CONCURRENCY_PER_KEY: ${WOOBE_RUNTIME_MAX_CONCURRENCY_PER_KEY:-4}
  WOOBE_RUNTIME_MAX_PROMPT_CHARS: ${WOOBE_RUNTIME_MAX_PROMPT_CHARS:-32768}
  WOOBE_RUNTIME_MAX_METADATA_BYTES: ${WOOBE_RUNTIME_MAX_METADATA_BYTES:-16384}
  WOOBE_RUNTIME_MAX_SNAPSHOT_OVERRIDE_BYTES: ${WOOBE_RUNTIME_MAX_SNAPSHOT_OVERRIDE_BYTES:-32768}
  WOOBE_RUNTIME_MAX_REQUEST_BYTES: ${WOOBE_RUNTIME_MAX_REQUEST_BYTES:-262144}
  WOOBE_RUNTIME_TOTAL_TIMEOUT_SECONDS: ${WOOBE_RUNTIME_TOTAL_TIMEOUT_SECONDS:-120}
  WOOBE_NETWORK_RUNTIME_ENABLED: ${WOOBE_NETWORK_RUNTIME_ENABLED:-true}
  WOOBE_NETWORK_STREAM_HEARTBEAT_SECONDS: ${WOOBE_NETWORK_STREAM_HEARTBEAT_SECONDS:-10}
  WOOBE_NETWORK_MAX_DEPTH_DEFAULT: ${WOOBE_NETWORK_MAX_DEPTH_DEFAULT:-4}
  WOOBE_NETWORK_MAX_DEPTH_HARD: ${WOOBE_NETWORK_MAX_DEPTH_HARD:-8}
  WOOBE_NETWORK_MAX_INVOCATIONS_DEFAULT: ${WOOBE_NETWORK_MAX_INVOCATIONS_DEFAULT:-16}
  WOOBE_NETWORK_MAX_INVOCATIONS_HARD: ${WOOBE_NETWORK_MAX_INVOCATIONS_HARD:-64}
  WOOBE_NETWORK_TIMEOUT_DEFAULT_SECONDS: ${WOOBE_NETWORK_TIMEOUT_DEFAULT_SECONDS:-90}
  WOOBE_NETWORK_TIMEOUT_HARD_SECONDS: ${WOOBE_NETWORK_TIMEOUT_HARD_SECONDS:-300}
  WOOBE_NETWORK_EXECUTION_LEASE_TTL_SECONDS: ${WOOBE_NETWORK_EXECUTION_LEASE_TTL_SECONDS:-30}
  WOOBE_NETWORK_EXECUTION_LEASE_HEARTBEAT_SECONDS: ${WOOBE_NETWORK_EXECUTION_LEASE_HEARTBEAT_SECONDS:-10}
  WOOBE_HTTP_TOOL_TIMEOUT_MAX_MS: ${WOOBE_HTTP_TOOL_TIMEOUT_MAX_MS:-30000}
  WOOBE_HTTP_TOOL_RESPONSE_MAX_BYTES: ${WOOBE_HTTP_TOOL_RESPONSE_MAX_BYTES:-1048576}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}

x-app-service: &app-service
  build: .
  image: woobe-api:0.1.0
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  migrate:
    <<: *app-service
    environment:
      WOOBE_POSTGRES_URL: ${WOOBE_POSTGRES_URL:-}
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *app-service
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    environment:
      <<: *app-common-environment
      WOOBE_SECRET_KEY: ${WOOBE_SECRET_KEY:-}
      WOOBE_AUTH_ISSUER: ${WOOBE_AUTH_ISSUER:-woobe}
      WOOBE_AUTH_AUDIENCE: ${WOOBE_AUTH_AUDIENCE:-woobe-web}
      WOOBE_ACCESS_TOKEN_TTL_SECONDS: ${WOOBE_ACCESS_TOKEN_TTL_SECONDS:-900}
      WOOBE_REFRESH_TOKEN_TTL_DAYS: ${WOOBE_REFRESH_TOKEN_TTL_DAYS:-30}
      WOOBE_AUTH_CLOCK_SKEW_SECONDS: ${WOOBE_AUTH_CLOCK_SKEW_SECONDS:-30}
      WOOBE_ACCESS_COOKIE_NAME: ${WOOBE_ACCESS_COOKIE_NAME:-woobe_access}
      WOOBE_ACCESS_COOKIE_SECURE: ${WOOBE_ACCESS_COOKIE_SECURE:-true}
      WOOBE_ACCESS_COOKIE_SAME_SITE: ${WOOBE_ACCESS_COOKIE_SAME_SITE:-lax}
      WOOBE_REFRESH_COOKIE_NAME: ${WOOBE_REFRESH_COOKIE_NAME:-woobe_refresh}
      WOOBE_REFRESH_COOKIE_SECURE: ${WOOBE_REFRESH_COOKIE_SECURE:-true}
      WOOBE_REFRESH_COOKIE_SAME_SITE: ${WOOBE_REFRESH_COOKIE_SAME_SITE:-lax}
      WOOBE_CSRF_COOKIE_NAME: ${WOOBE_CSRF_COOKIE_NAME:-woobe_csrf}
      WOOBE_CSRF_HEADER_NAME: ${WOOBE_CSRF_HEADER_NAME:-x-csrf-token}
      WOOBE_LOGIN_RATE_LIMIT_ATTEMPTS: ${WOOBE_LOGIN_RATE_LIMIT_ATTEMPTS:-10}
      WOOBE_LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${WOOBE_LOGIN_RATE_LIMIT_WINDOW_SECONDS:-60}
      WOOBE_API_KEY_RATE_LIMIT_REQUESTS: ${WOOBE_API_KEY_RATE_LIMIT_REQUESTS:-120}
      WOOBE_API_KEY_RATE_LIMIT_WINDOW_SECONDS: ${WOOBE_API_KEY_RATE_LIMIT_WINDOW_SECONDS:-60}
      WOOBE_REQUEST_MAX_BYTES: ${WOOBE_REQUEST_MAX_BYTES:-1048576}
      WOOBE_READINESS_TIMEOUT_SECONDS: ${WOOBE_READINESS_TIMEOUT_SECONDS:-3.0}
      WOOBE_CORS_ORIGINS: ${WOOBE_CORS_ORIGINS:-}
      WOOBE_TRUSTED_HOSTS: ${WOOBE_TRUSTED_HOSTS:-}
      WOOBE_CHAT_SURFACE_ENABLED: ${WOOBE_CHAT_SURFACE_ENABLED:-true}
      WOOBE_CHAT_TOKEN_SIGNING_KEY: ${WOOBE_CHAT_TOKEN_SIGNING_KEY:-}
      WOOBE_CHAT_TOKEN_ISSUER: ${WOOBE_CHAT_TOKEN_ISSUER:-woobe-chat}
      WOOBE_CHAT_TOKEN_AUDIENCE: ${WOOBE_CHAT_TOKEN_AUDIENCE:-woobe-chat-embed}
      WOOBE_CHAT_TOKEN_TTL_SECONDS: ${WOOBE_CHAT_TOKEN_TTL_SECONDS:-900}
      WOOBE_CHAT_SURFACE_SESSION_CREATE_RATE_LIMIT: ${WOOBE_CHAT_SURFACE_SESSION_CREATE_RATE_LIMIT:-30}
      WOOBE_CHAT_SURFACE_TOKEN_ISSUE_RATE_LIMIT: ${WOOBE_CHAT_SURFACE_TOKEN_ISSUE_RATE_LIMIT:-120}
      WOOBE_HOST: ${WOOBE_HOST:-0.0.0.0}
      WOOBE_PORT: 8000
    ports:
      - "${WOOBE_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 45s

  workers:
    <<: *app-service
    command: ["python", "-m", "src.worker_main"]
    environment:
      <<: *app-common-environment
      WOOBE_RABBITMQ_URL: ${WOOBE_RABBITMQ_URL:-}
      WOOBE_RABBITMQ_EXCHANGE: ${WOOBE_RABBITMQ_EXCHANGE:-woobe.events}
      WOOBE_WORKER_INTERVAL: ${WOOBE_WORKER_INTERVAL:-5.0}
      WOOBE_WORKER_HEALTH_FILE: ${WOOBE_WORKER_HEALTH_FILE:-/tmp/woobe/worker-health.json}
      WOOBE_WORKER_HEARTBEAT_INTERVAL_SECONDS: ${WOOBE_WORKER_HEARTBEAT_INTERVAL_SECONDS:-10}
      WOOBE_WORKER_HEALTH_MAX_AGE_SECONDS: ${WOOBE_WORKER_HEALTH_MAX_AGE_SECONDS:-45}
      WOOBE_NETWORK_WORKER_PREFETCH: ${WOOBE_NETWORK_WORKER_PREFETCH:-4}
      WOOBE_NETWORK_WORKER_SLOTS: ${WOOBE_NETWORK_WORKER_SLOTS:-4}
      WOOBE_OUTBOX_BATCH_SIZE: ${WOOBE_OUTBOX_BATCH_SIZE:-50}
      WOOBE_INBOX_BATCH_SIZE: ${WOOBE_INBOX_BATCH_SIZE:-50}
      WOOBE_OUTBOX_LOCK_TIMEOUT_SECONDS: ${WOOBE_OUTBOX_LOCK_TIMEOUT_SECONDS:-300}
      WOOBE_INBOX_LOCK_TIMEOUT_SECONDS: ${WOOBE_INBOX_LOCK_TIMEOUT_SECONDS:-300}
      WOOBE_OUTBOX_MAX_RETRIES: ${WOOBE_OUTBOX_MAX_RETRIES:-3}
      WOOBE_RETRY_BASE_DELAY_SECONDS: ${WOOBE_RETRY_BASE_DELAY_SECONDS:-1.0}
      WOOBE_RETRY_MAX_DELAY_SECONDS: ${WOOBE_RETRY_MAX_DELAY_SECONDS:-300.0}
      WOOBE_RETRY_BACKOFF_MULTIPLIER: ${WOOBE_RETRY_BACKOFF_MULTIPLIER:-2.0}
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib; data=pathlib.Path('/proc/1/cmdline').read_bytes(); raise SystemExit(0 if b'worker_main' in data else 1)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    stop_grace_period: 45s

  web:
    build:
      context: web
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_CHAT_EMBED_URL: ${VITE_CHAT_EMBED_URL:-}
        VITE_WOOBE_EDITION: ${VITE_WOOBE_EDITION:-community}
    image: woobe-web:0.1.0
    ports:
      - "${WOOBE_WEB_PORT:-8080}:8080"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=32m,mode=0755,uid=101,gid=101
      - /var/run:size=4m,mode=0755,uid=101,gid=101
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s

  chat-embed:
    build:
      context: embed
    image: woobe-chat-embed:1.0.0
    ports:
      - "${WOOBE_CHAT_EMBED_PORT:-8081}:8080"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=32m,mode=0755,uid=101,gid=101
      - /var/run:size=4m,mode=0755,uid=101,gid=101
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/chat/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
